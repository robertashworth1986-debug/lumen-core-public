<style>

  .markdown table { border-collapse: collapse; margin: 8px 0; width: 100%; }
  .markdown th, .markdown td { padding: 6px 10px; border-bottom: 1px solid var(--border); }
  .markdown th { font-family: 'Orbitron', sans-serif; font-size: 10px;

  .gaps li { color: var(--neon-a); }

<script>
  (() => {
    const params = new URLSearchParams(window.location.search || '');

function normalizeApiBase(value) {
  const raw = String(value || '').trim();

  if (!/^https?:\/\//i.test(raw)) return '';
  return raw.replace(/\/$/, '');
}

function resolveApiBase() {
  const fromWindow = normalizeApiBase(window.LUMA_API_BASE);
  if (fromWindow) return fromWindow;

  const params = new URLSearchParams(window.location.search || '');
  const fromQuery = normalizeApiBase(params.get('api_base') || params.get('api'));
  if (fromQuery) {
    try { localStorage.setItem('LUMA_API_BASE', fromQuery); } catch {}
    return fromQuery;
  }

  try {
    const fromStorage = normalizeApiBase(localStorage.getItem('LUMA_API_BASE'));
    if (fromStorage) return fromStorage;
  } catch {}

  if (location.protocol === 'file:') {
    return 'https://lumen-core.ai';
  }

  return normalizeApiBase(location.origin);
}

  const src = Array.isArray(values) ? values : [];
  const deduped = [];
  const seen = new Set();
  src.forEach((value) => {
    const key = String(value || '').trim();
    if (!key || seen.has(key)) return;
    seen.add(key);
    deduped.push(key);
  });
  if (!FILE_MODE) return deduped;
  const relOnly = deduped.filter((path) => !/^(\/|[A-Za-z]:[\\/])/.test(path));
  const ordered = relOnly.length ? relOnly : deduped;
  const mirror = ordered.filter((path) => path.includes(mirrorNeedle));
  const other = ordered.filter((path) => !path.includes(mirrorNeedle));
  return mirror.concat(other);
}

function joinPath(base, rel) {

function moneyCompact(value) {
  const n = Number(value);
  if (!Number.isFinite(n)) return '$0';
  const abs = Math.abs(n);
  if (abs >= 1e9) return `$${(n / 1e9).toFixed(2)}B`;
  if (abs >= 1e6) return `$${(n / 1e6).toFixed(2)}M`;
  if (abs >= 1e3) return `$${(n / 1e3).toFixed(1)}K`;
  return `$${n.toFixed(0)}`;
}
function clampPct(value) {
  const n = Number(value);
  if (!Number.isFinite(n)) return 0;
  return Math.max(0, Math.min(100, n));
}

function resolveApiPath(path) {
  if (/^https?:\/\//i.test(path)) return path;

function safeSeg(v) {

function escAttr(s) {

function normOpp(v) {

function isUuid(v) {

}

function isHttpUrl(v) {

function parseOppFromGrantUrl(url) {
  const txt = String(url || '').trim();
  if (!txt) return '';
  const m = txt.match(/search-results-detail\/([^/?#]+)/i);
  if (!m || !m[1]) return '';
  try {
    return decodeURIComponent(m[1]);
  } catch {
    return m[1];
  }
}

function grantSearchUrl(opp) {
  const token = String(opp || '').trim();
  if (!token) return 'https://www.grants.gov/search-grants';
  if (/^SKIP-/i.test(token)) return 'https://helloskip.com/';
  if (isUuid(token)) return `https://simpler.grants.gov/opportunity/${encodeURIComponent(token)}`;
  return `https://www.grants.gov/search-results-detail/${encodeURIComponent(token)}`;
}

function isInformationalGrantLanding(url) {
  const target = String(url || '').trim();
  if (!isHttpUrl(target)) return false;
  let parsed;
  try {
    parsed = new URL(target);
  } catch {
    return false;
  }
  const host = parsed.hostname.toLowerCase();
  const path = parsed.pathname.toLowerCase();

  if (host.includes('grants.gov') || host.includes('simpler.grants.gov')) return false;
  if (host.includes('helloskip.com') || host.includes('smartsimple')) return false;

  if (host.includes('science.osti.gov') && /^\/sbir\/?$/.test(path)) return true;
  if (host.includes('nist.gov') && /\/sbir\/?$/.test(path)) return true;
  if (host.includes('seedfund.nsf.gov')) return true;
  if (host.includes('sbir.nasa.gov')) return true;
  if (host.includes('afwerx.com')) return true;
  if (host.includes('arpa-e.energy.gov')) return true;
  if (host.includes('techpartnerships.noaa.gov')) return true;

  if ((path === '/' || path === '') && /(sbir|sttr|grant|funding|opportun)/i.test(target)) return true;
  return false;
}

async function fetchJsonStrict(path, opts = {}) {
  const r = await fetch(resolveApiPath(path), { cache: 'no-store', ...opts });
  if (!r.ok) {
    const e = await r.text();
    const body = String(e || '').trim();
    if (/gateway time-?out|\b504\b/i.test(body)) {
      throw new Error(`${r.status} Gateway Timeout`);
    }
    const plain = body.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
    const snippet = plain ? (plain.length > 220 ? `${plain.slice(0, 217)}...` : plain) : 'HTTP error';
    throw new Error(`${r.status} ${snippet}`);
  }
  const ct = r.headers.get('content-type') || '';
  return ct.includes('json') ? r.json() : r.text();
}

    const status = normalizeSubmissionStatus(row?.status);

  }).length;
  return { records, submitted, validated, rejected };

    REPRESENTATIVE_DATA_AND_COMPLIANCE_GATED: 'Representative data gated',

  };

function reviewerFeedFreshness(feed) {
  const generatedRaw = feed?.freshness?.generated_utc || feed?.generated_utc || '';
  const generatedMs = Date.parse(generatedRaw);
  const ttlHours = Number(feed?.freshness?.ttl_hours || 24);
  const ageHours = Number.isFinite(generatedMs)
    ? Math.max((Date.now() - generatedMs) / 3600000, 0)
    : null;
  const stale = ageHours === null || !Number.isFinite(ttlHours) || ttlHours <= 0 || ageHours > ttlHours;
  return {
    stale,
    ageHours,
    ttlHours,
    label: stale ? 'Stale snapshot - reverify deadlines' : 'Snapshot within freshness window',
  };
}

    PUBLISHED_DEADLINE_PASSED_REVERIFY: 'Published deadline passed - recheck',
    DEADLINE_UNVERIFIED: 'Deadline unverified',
  };

  const raw = String(row?.source_authority_status || 'SOURCE_UNVERIFIED').toUpperCase();
  if (raw === 'TOPIC_MIRROR_VERIFIED_DSIP_RECHECK_REQUIRED') return 'Unofficial topic mirror - DSIP recheck required';
  if (raw === 'OFFICIAL_PAGE_VERIFIED') return 'Official opportunity page verified';
  if (raw === 'OFFICIAL_DISCOVERY_SNAPSHOT_NOTICE_RECHECK_REQUIRED') return 'Official discovery snapshot - complete notice recheck required';
  return raw.replace(/_/g, ' ').toLowerCase();
}

function reviewerSourceLinkLabel(row) {
  const raw = String(row?.source_authority_status || '').toUpperCase();
  return raw.includes('TOPIC_MIRROR') ? 'Open topic mirror' : 'Open official source';
}

function reviewerDate(value) {
  const raw = String(value || '').trim();
  if (!raw) return 'Verify in official notice';
  const parsed = new Date(raw);
  if (Number.isNaN(parsed.getTime())) return raw;
  const dateOnly = /^\d{4}-\d{2}-\d{2}$/.test(raw) || /^\d{2}\/\d{2}\/\d{4}$/.test(raw);
  const options = dateOnly
    ? { year: 'numeric', month: 'short', day: 'numeric', timeZone: 'UTC' }
    : { year: 'numeric', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', timeZone: 'America/New_York', timeZoneName: 'short' };
  return new Intl.DateTimeFormat('en-US', options).format(parsed);
}

function reviewerSourceStatus(value, source) {
  const raw = String(value || 'unknown');
  if (raw === 'ZERO_RECORDS_CAUSE_UNVERIFIED') return `${source} zero records; cause unverified`;
  if (raw === 'HARVESTED_RECORDS_PRESENT') return `${source} records present in bounded harvest`;
  return `${source} ${raw.replace(/_/g, ' ').toLowerCase()}`;
}
function drapersFrame(payload) {
  const rows = Array.isArray(payload?.scenario_projection)
    ? payload.scenario_projection
    : [];
  const byStart = (usd) => rows.filter((row) => Number(row?.start_usd) === usd && Number.isFinite(Number(row?.months_to_target)));
  const rows50 = byStart(50000).sort((a, b) => Number(a.months_to_target) - Number(b.months_to_target));
  const rows10 = byStart(10000).sort((a, b) => Number(a.months_to_target) - Number(b.months_to_target));
  const at10Pct = rows50.find((row) => Math.abs(Number(row?.monthly_return) - 0.10) < 1e-6) || null;
  return {
    fastest50: rows50[0] || null,
    fastest10: rows10[0] || null,
    at10Pct: at10Pct,
  };
}

function toneClass(value, warnAt = 62, alertAt = 40) {
  const v = Number(value);
  if (!Number.isFinite(v)) return 'warn';
  if (v <= alertAt) return 'alert';
  if (v <= warnAt) return 'warn';
  return 'good';
}

function shortPosture(value, fallback = 'OFFLINE') {
  const raw = String(value || fallback).trim();
  if (!raw) return fallback;
  if (raw === 'PUBLIC_AIS_RAW_ACQUIRED_HASHED_PROFILED') return 'AIS ACQUIRED';
  if (raw === 'PUBLIC_AIS_SINGLE_LANE_GATE_READY') return 'AIS GATE READY';
  if (raw === 'LOCAL_LOCKED_PORTAL_BLOCKED') return 'LOCKED / GATED';
  if (raw === 'LOCAL_READY_PORTAL_BLOCKED') return 'READY / GATED';
  return raw.replace(/_/g, ' ').slice(0, 28);
}

function missionSnapshot() {
  const total = Number(queue?.n_total || submissionDashboard?.totals?.n_total || 0);
  const ready = Number(submissionDashboard?.totals?.n_ready_to_submit || 0);
  const approved = Number(queue?.n_approved || submissionDashboard?.totals?.n_approved || 0);
  const submitted = Math.max(
    Number(queue?.n_submitted || 0),
    Number(submissionDashboard?.totals?.n_submitted || 0),
    Number(externalSubmissionSummary(externalSubmissionLedger).submitted || 0)
  );
  const waiting = waitingActionSummary(waitingActions);
  const tracked = Number(opportunityTracker?.opportunities?.n_total || 0);
  const awarded = Number(opportunityTracker?.awards?.count || 0);

  const safeTotal = Math.max(total, 1);
  const readyRatio = ready / safeTotal;
  const submittedRatio = submitted / safeTotal;
  const blockedRatio = waiting.blockedCount / safeTotal;
  const validated = Number(externalSubmissionSummary(externalSubmissionLedger).validated || 0);
  const validatedRatio = submitted > 0 ? validated / submitted : 0;

  const pulse = clampPct(36 + readyRatio * 40 + submittedRatio * 24 + awarded * 2);
  const integrity = clampPct(84 - blockedRatio * 56 + validatedRatio * 18);
  const throughput = clampPct(18 + submittedRatio * 58 + (approved / safeTotal) * 24);
  const anomaly = clampPct(8 + blockedRatio * 70 + Math.min(waiting.waitingCount * 4, 24));
  const confidence = clampPct(42 + readyRatio * 26 + validatedRatio * 24 - blockedRatio * 24 + (runtimeMode === 'artifact' ? -8 : 8));

  return {
    total,
    ready,
    approved,
    submitted,
    tracked,
    awarded,
    waitingCount: waiting.waitingCount,
    blockedCount: waiting.blockedCount,
    pulse,
    integrity,
    throughput,
    anomaly,
    confidence,
  };
}

  cinematicLayer = window.LumaCinematic.mount({
    host,
    mode: 'GRANTS',
    source: runtimeMode === 'artifact' ? 'ARTIFACT' : 'LIVE',
  });
}

function updateCinematicLayer(snapshot) {
  if (REVIEWER_MODE) return;
  ensureCinematicLayer();
  if (!cinematicLayer || !snapshot) return;
  cinematicLayer.setMetrics({
    pulse: snapshot.pulse,
    integrity: snapshot.integrity,
    throughput: snapshot.throughput,
    anomaly: snapshot.anomaly,
    confidence: snapshot.confidence,
  });
  cinematicLayer.setMeta('mode', runtimeMode === 'artifact' ? 'ARTIFACT' : 'LIVE');
  cinematicLayer.setMeta('source', runtimeMode === 'artifact' ? 'FILE' : 'API');
  const cue = snapshot.blockedCount > 0
    ? 'BLOCKERS'
    : (snapshot.submitted > 0 ? 'SUBMIT' : 'BUILD');
  cinematicLayer.setMeta('cue', cue);
}

async function localQueue() {
  if (localCache.queue) return localCache.queue;
  const candidates = joinAllPaths(LOCAL_GRANTS_ROOT_CANDIDATES, '_queue/index.json');
  for (const candidate of candidates) {
    const q = await fetchJsonLoose(candidate);
    if (!q || typeof q !== 'object') continue;
    const root = candidate.replace(/\/_queue\/index\.json$/i, '');
    const taggedItems = Array.isArray(q.items)
      ? q.items.map((item) => ({ ...item, _local_root: root }))
      : [];
    localCache.queueRoot = root || LOCAL_GRANTS_ROOT;
    localCache.queue = {
      ...q,
      items: taggedItems,
      run_utc: q.run_utc || q.generated_utc || null,
      source: 'local-artifacts',
      source_root: localCache.queueRoot,
    };
    return localCache.queue;
  }
  return null;
}

async function localQueueItem(programId) {
  const q = await localQueue();
  return (q?.items || []).find(it => it.program_id === programId) || null;
}

async function localGrantDetail(programId) {
  if (localCache.details.has(programId)) return localCache.details.get(programId);
  const item = await localQueueItem(programId);
  if (!item) throw new Error(`Unknown grant id: ${programId}`);

  const runUtc = item.latest_utc;
  const base = `${queueItemRoot(item)}/${safeSeg(programId)}/${safeSeg(runUtc)}`;
  const [application, eligibility_report, approval_state, budget] = await Promise.all([
    fetchJsonLoose(`${base}/application.json`),
    fetchJsonLoose(`${base}/eligibility_report.json`),
    fetchJsonLoose(`${base}/approval_state.json`),
    fetchJsonLoose(`${base}/budget.json`),
  ]);

  if (!application) {
    throw new Error(`Missing local artifact: ${base}/application.json`);
  }

  const detail = {
    grant_id: programId,
    run_utc: runUtc,
    source: 'local-artifacts',
    application: application || {},
    eligibility_report: eligibility_report || {},
    approval_state: approval_state || {},
    budget: budget || {},
  };
  localCache.details.set(programId, detail);
  return detail;
}

async function localGrantMarkdown(programId, section) {

function valueDiff(current, approved) {
  return {
    current: current == null ? null : current,
    approved: approved == null ? null : approved,
    changed: JSON.stringify(current ?? null) !== JSON.stringify(approved ?? null),
  };
}

async function localGrantDiff(programId) {
  const item = await localQueueItem(programId);
  if (!item) throw new Error(`Unknown grant id: ${programId}`);
  const runUtc = item.latest_utc;
  const grantRoot = queueItemRoot(item);
  const currentBase = `${grantRoot}/${safeSeg(programId)}/${safeSeg(runUtc)}`;
  const approvedBase = `${grantRoot}/_approved/${safeSeg(programId)}/${safeSeg(runUtc)}`;

  const [currentApp, approvedApp, currentBudget, approvedBudget] = await Promise.all([
    fetchJsonLoose(`${currentBase}/application.json`),
    fetchJsonLoose(`${approvedBase}/application.json`),
    fetchJsonLoose(`${currentBase}/budget.json`),
    fetchJsonLoose(`${approvedBase}/budget.json`),
  ]);

  if (!approvedApp) {
    return {
      has_approved: false,
      current_run_utc: runUtc,
      approved_run_utc: null,
      headline: {},
      layers: {},
      files: [],
    };
  }

  const layersCurrent = currentApp?.evidence_summary || {};
  const layersApproved = approvedApp?.evidence_summary || {};
  const layerKeys = Array.from(new Set([...Object.keys(layersCurrent), ...Object.keys(layersApproved)]));
  const layers = {};
  layerKeys.forEach(k => {
    layers[k] = {
      current: layersCurrent[k] ?? null,
      approved: layersApproved[k] ?? null,
      changed: JSON.stringify(layersCurrent[k] ?? null) !== JSON.stringify(layersApproved[k] ?? null),
    };
  });

  const fileNames = [
    'application.json',
    'eligibility_report.json',
    'approval_state.json',
    'budget.json',
    'application.md',
    'technical_volume.md',
    'commercialization_plan.md',
    'cover_letter.md',
    'submission_packet.json',
  ];

  const files = await Promise.all(fileNames.map(async (name) => {
    const [curTxt, appTxt] = await Promise.all([
      fetchTextLoose(`${currentBase}/${name}`),
      fetchTextLoose(`${approvedBase}/${name}`),
    ]);
    const currentBytes = curTxt == null ? null : curTxt.length;
    const approvedBytes = appTxt == null ? null : appTxt.length;

    let status = 'unchanged';
    if (curTxt == null && appTxt != null) status = 'removed';
    else if (curTxt != null && appTxt == null) status = 'added';
    else if (curTxt !== appTxt) status = 'modified';

    return {
      name,
      status,
      current_bytes: currentBytes,
      approved_bytes: approvedBytes,
    };
  }));

  return {
    has_approved: true,
    current_run_utc: runUtc,
    approved_run_utc: runUtc,
    headline: {
      evidence_run_utc: valueDiff(currentApp?.evidence_run_utc, approvedApp?.evidence_run_utc),
      eligibility_score: valueDiff(currentApp?.eligibility?.score, approvedApp?.eligibility?.score),
      budget_total: valueDiff(currentBudget?.total ?? currentApp?.budget?.total, approvedBudget?.total ?? approvedApp?.budget?.total),
      layers,
    },
    files,
  };
}

async function localSubmissionDashboard() {
  const q = await localQueue();
  if (!q) return { items: [], totals: {} };
  const rows = Array.isArray(q.items) ? q.items : [];
  const items = [];
  let nReady = 0;
  let nApproved = 0;
  let nSubmitted = 0;
  let ceilingTotal = 0;
  let ceilingReady = 0;

  rows.forEach((row) => {
    const state = String(row?.state || '').toLowerCase();
    const ceiling = Number(row?.ceiling_usd || 0);
    ceilingTotal += Number.isFinite(ceiling) ? ceiling : 0;
    if (state === 'approved') nApproved += 1;
    if (state === 'submitted') nSubmitted += 1;
    if (state === 'approved' || state === 'submitted') {
      nReady += 1;
      ceilingReady += Number.isFinite(ceiling) ? ceiling : 0;
    }
  });

  const extSummary = externalSubmissionSummary(await loadExternalSubmissionLedger());
  nSubmitted = Math.max(nSubmitted, extSummary.submitted);
  return {
    items,
    totals: {
      n_total: items.length,
      n_approved: nApproved,
      n_submitted: nSubmitted,
      n_ready_to_submit: nReady,
      ceiling_total_usd: Math.round(ceilingTotal * 100) / 100,
      ceiling_ready_to_submit_usd: Math.round(ceilingReady * 100) / 100,
      preflight_utc: q.generated_utc || null,
    },
  };
}

async function localApi(path) {
  const u = new URL(path, location.href);
  const parts = u.pathname.split('/').filter(Boolean);
  if (parts[0] && parts[0].includes(':')) parts.shift();
  if (parts[0] !== 'api' || parts[1] !== 'grants') return null;

  if (parts.length === 4 && parts[2] === 'submission' && parts[3] === 'dashboard') {
    return localSubmissionDashboard();
  }

  if (parts.length === 2) return localQueue();
  const id = decodeURIComponent(parts[2] || '');
  if (!id) return null;

  if (parts.length === 3) return localGrantDetail(id);
  if (parts.length === 4 && parts[3] === 'markdown') {
    const section = u.searchParams.get('section') || 'application';
    return localGrantMarkdown(id, section);
  }
  if (parts.length === 4 && parts[3] === 'submission') return localGrantSubmission(id);
  if (parts.length === 4 && parts[3] === 'diff') return localGrantDiff(id);

  return null;
}

async function api(path, opts = {}) {
  const method = String(opts.method || 'GET').toUpperCase();
  const allowFallback = method === 'GET';

  if (!CAN_TRY_LIVE_API && allowFallback) {
    runtimeMode = 'artifact';
  }

  if ((runtimeMode !== 'artifact' || !allowFallback) && CAN_TRY_LIVE_API) {
    try {
      const data = await fetchJsonStrict(path, opts);
      runtimeMode = 'api';
      return data;
    } catch (err) {
      if (!allowFallback) throw err;
      runtimeMode = 'artifact';
    }
  }

  if (!allowFallback) {
    throw new Error('Live grants API unavailable in this mode.');
  }

  const fallback = await localApi(path);
  if (fallback != null) return fallback;

  throw new Error('Read-only artifact mode: endpoint unavailable.');
}

function grantActionRowsForOpp(oppNum) {
  const key = normOpp(oppNum);
  if (!key) return [];
  const summary = waitingActionSummary(waitingActions);
  const rows = [...summary.blocked, ...summary.waiting]
    .filter((row) => normOpp(row?.opp_num) === key);

  const priorityRank = { P0: 0, P1: 1, P2: 2 };
  rows.sort((a, b) => {
    const pa = String(a?.priority || 'P2').toUpperCase();
    const pb = String(b?.priority || 'P2').toUpperCase();
    return (priorityRank[pa] ?? 9) - (priorityRank[pb] ?? 9);
  });
  return rows;
}

function classifySubmissionBlocker(text) {
  const value = String(text || '');
  if (/SAM\.gov|Grants\.gov|AOR|signature|portal|registration/i.test(value)) {
    return { lane: 'operator', action: 'Verify this in the official account or submission portal, then record the verification date in the company profile.' };
  }
  if (/opportunity window|source_never_verified|not verified open|deadline/i.test(value)) {
    return { lane: 'source', action: 'Open the official opportunity notice. Do not submit until the open window and exact solicitation are confirmed.' };
  }
  if (/TO_BE_FILLED|budget total|package|missing file/i.test(value)) {
    return { lane: 'system', action: 'Update the missing company/project facts, then use Regenerate and Prepare submission draft.' };
  }
  if (/approval_state|approved/i.test(value)) {
    return { lane: 'review', action: 'Review the regenerated package and approve it only after every factual and legal field is correct.' };
  }
  return { lane: 'review', action: 'Review and resolve this item before approval.' };
}

function blockerActionPanel(blockers) {
  const rows = (blockers || []).map((blocker) => {
    const item = classifySubmissionBlocker(blocker);
    return `<tr><td>${escHTML(item.lane.toUpperCase())}</td><td>${escHTML(String(blocker))}</td><td>${escHTML(item.action)}</td></tr>`;
  }).join('');
  if (!rows) return '';
  return `<h3>How to unblock this package</h3>
    <table class="sf-table"><thead><tr><th>Owner</th><th>Blocker</th><th>Next action</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="gaps"><b>Safety rule:</b> the factory may draft and validate files, but it must not invent registration status, authorization, signatures, or an open solicitation window.</div>`;
}

function parseBootstrapFlag(value) {
  const token = String(value || '').trim().toLowerCase();
  return token === '1' || token === 'true' || token === 'yes' || token === 'y' || token === 'on';
}

function isTimeoutLikeError(err) {
  const msg = String(err?.message || err || '');
  return /\b504\b|gateway time-?out|timed? out|timeout/i.test(msg);
}

function compactErrorMessage(err, fallback = 'Request failed') {
  const raw = String(err?.message || err || '').trim();
  if (!raw) return fallback;
  if (isTimeoutLikeError(raw)) return '504 Gateway Timeout';
  const firstLine = raw.split(/\r?\n/).map(s => s.trim()).find(Boolean) || raw;
  const plain = firstLine.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
  if (!plain) return fallback;
  return plain.length > 220 ? `${plain.slice(0, 217)}...` : plain;
}

function showBootstrapNotice(message) {
  const slot = $('detail');
  if (!slot) return;
  const id = 'bootstrap-notice';
  const existing = document.getElementById(id);
  if (existing) existing.remove();
  const note = document.createElement('div');
  note.id = id;
  note.className = 'gaps';
  note.innerHTML = `<b>Auto-fill notice:</b> ${escHTML(message)}`;
  slot.prepend(note);
}

function resolveBootstrapGrantId() {
  const params = new URLSearchParams(window.location.search || '');
  const direct = String(params.get('grant_id') || params.get('grant') || '').trim();
  if (direct) return direct;

  const opp = normOpp(params.get('opp') || params.get('opp_num'));
  if (!opp) return '';

  const items = Array.isArray(queue?.items) ? queue.items : [];
  const found = items.find((it) => {
    const itemOpp = normOpp(it?.opp_num || parseOppFromGrantUrl(it?.url));
    return itemOpp && itemOpp === opp;
  });
  return found ? String(found.program_id || '').trim() : '';
}

async function applyUrlBootstrap() {
  if (urlBootstrapApplied) return;
  urlBootstrapApplied = true;

  const params = new URLSearchParams(window.location.search || '');
  const grantId = resolveBootstrapGrantId();
  if (!grantId) return;

  const exists = Array.isArray(queue?.items)
    ? queue.items.some((it) => String(it?.program_id || '').trim() === grantId)
    : false;
  if (!exists) return;

  activeTab = 'submission';
  await loadDetail(grantId);

  if (REVIEWER_MODE) return;

  if (!parseBootstrapFlag(params.get('auto_fill'))) {
    return;
  }

  if (runtimeMode === 'artifact') {
    showBootstrapNotice('Auto-fill requested, but console is in read-only artifact mode. You can still use Open submit site and Copy SF-424.');
    return;
  }

  const existingSubmission = submissionByGrant.get(grantId)?.submission_packet || null;
  if (existingSubmission?.ready) {
    return;
  }

  try {
    await prepareSubmission(grantId, { quiet: true });
    return;
  } catch {}

  try {
    await draft(grantId, { quiet: true, skipSuccessAlert: true });
  } catch (err) {
    const msg = isTimeoutLikeError(err)
      ? 'Auto-fill timed out (504). Continue with Open submit site and Copy SF-424 now, then retry AI autofill in ~30 seconds.'
      : `Auto-fill unavailable: ${compactErrorMessage(err, 'request failed')}`;
    showBootstrapNotice(msg);
  }
}

function escHTML(s) {
  return String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
}

async function loadDetail(id) {
  activeId = id;
  try {
    const next = new URLSearchParams(window.location.search || '');
    next.set('grant_id', String(id || ''));
    history.replaceState(null, '', `${window.location.pathname}?${next.toString()}`);
  } catch {}
  document.querySelectorAll('.grant-item').forEach(el => {
    el.classList.toggle('active', el.dataset.id === id);
  });
  if (REVIEWER_MODE) {
    const item = (queue?.items || []).find((row) => row.program_id === id);
    if (!item) {
      $('detail').innerHTML = '<div class="err">Sanitized reviewer record not found.</div>';
      return;
    }
    renderReviewerDetail(item);
    return;
  }
  try {
    const d = await api(`/api/grants/${encodeURIComponent(id)}`);
    activeDetail = d;
    try {
      const sub = await api(`/api/grants/${encodeURIComponent(id)}/submission`);
      submissionByGrant.set(id, sub);
    } catch {
      submissionByGrant.delete(id);
    }
    renderDetail(d);
    loadMarkdown(activeTab);
  } catch (e) {
    $('detail').innerHTML = `<div class="err">${e.message}</div>`;
  }
}

  const submitUrl = grantSubmitUrl(queueItem, d, submission);

async function loadMarkdown(tab) {
  if (!activeId) return;
  const slot = $('md');
  if (!slot) return;

  if (tab === 'budget') {
    try {
      const d = await api(`/api/grants/${encodeURIComponent(activeId)}`);
      const b = d.budget || {};
      const rows = Object.entries(b.categories || {}).map(([k, v]) =>
        `<tr><td>${k.replace(/_/g, ' ')}</td><td style="text-align:right">$${Number(v || 0).toLocaleString()}</td></tr>`).join('');
      slot.innerHTML = `
        <h3>Budget — $${Number(b.total || 0).toLocaleString()} / ${b.duration_months || '—'}mo</h3>
        <table>${rows}</table>
        <ul>${(b.notes || []).map(n => `<li>${escHTML(n)}</li>`).join('')}</ul>
      `;
    } catch (e) {
      slot.innerHTML = `<div class="err">${e.message}</div>`;
    }
    return;
  }

  if (tab === 'submission') {
    try {
      const payload = await api(`/api/grants/${encodeURIComponent(activeId)}/submission`);
      submissionByGrant.set(activeId, payload);
      const p = payload.submission_packet || {};
      const rowItem = (queue?.items || []).find(x => x.program_id === activeId) || {};
      const submitLaneUrl = grantSubmitUrl(rowItem, activeDetail, p);
      const portal = p.portal || {};
      const blockers = (p.blockers || []).map(x => `<li>${escHTML(String(x))}</li>`).join('');
      const warnings = (p.warnings || []).map(x => `<li>${escHTML(String(x))}</li>`).join('');
      const reqs = (portal.requires || []).map(x => `<li>${escHTML(String(x))}</li>`).join('');
      const sfPairs = Object.entries(p.sf424_map || {});
      const sfRows = sfPairs.map(([k, v]) => {
        const val = String(v ?? '');
        return `<tr>
          <td>${escHTML(String(k))}</td>
          <td>${escHTML(val)}</td>
          <td><button class="secondary sf-copy-btn" data-copy="${escAttr(val)}">Copy</button></td>
        </tr>`;
      }).join('');
      const sfTsv = sfPairs.map(([k, v]) => `${k}\t${String(v ?? '')}`).join('\n');
      const canMarkSubmittedFast = runtimeMode !== 'artifact' && p.approval_state === 'approved';

      slot.innerHTML = `
        <div class="quick-lane">
          <div class="submission-title">3-Minute Fast Submit Lane</div>
          <ol class="quick-steps">
            <li>Open the live submit route for this grant.</li>
            <li>Copy the SF-424 field map in one click (or field-by-field).</li>
            <li>Finalize uploads/signature, then mark submitted with tracking ID.</li>
          </ol>
          <div class="toolbar" style="margin-bottom:0">
            <a class="btn-link" href="${escAttr(submitLaneUrl)}" target="_blank" rel="noopener"
               style="border-color:var(--neon-g);color:var(--neon-g)">1) Open submit site ↗</a>
            <button class="secondary" id="copy-sf424-all">2) Copy SF-424 TSV</button>
            <button class="success" id="mark-submitted-fast" ${canMarkSubmittedFast ? '' : 'disabled'}>3) Mark submitted</button>
          </div>
        </div>
        <h3>Submission Readiness: ${p.ready ? '<span style="color:var(--neon-g)">READY</span>' : '<span style="color:var(--neon-a)">BLOCKED</span>'}</h3>
        <p><b>Portal:</b> <a href="${escHTML(portal.portal_url || '#')}" target="_blank" rel="noopener" style="color:var(--accent-2)">${escHTML(portal.portal_url || 'n/a')}</a></p>
        <p><b>System:</b> ${escHTML(portal.submission_system || 'n/a')}</p>
        <p><b>Approval state:</b> ${escHTML(String(p.approval_state || 'draft'))}</p>
        <p><b>Package complete:</b> ${p.package_complete ? 'yes' : 'no'}</p>
        ${blockers ? `<div class="gaps"><b>Blockers</b><ul>${blockers}</ul></div>` : '<div class="reasons"><b>No blockers detected</b></div>'}
        ${blockerActionPanel(p.blockers || [])}
        ${warnings ? `<div class="gaps"><b>Warnings</b><ul>${warnings}</ul></div>` : ''}
        ${reqs ? `<h3>Portal required checklist</h3><ul>${reqs}</ul>` : ''}
        <h3>SF-424 Copy/Paste Map</h3>
        <table class="sf-table"><thead><tr><th>Field</th><th>Value</th><th>Copy</th></tr></thead><tbody>${sfRows}</tbody></table>
      `;

      const copyAllBtn = slot.querySelector('#copy-sf424-all');
      if (copyAllBtn) {
        copyAllBtn.addEventListener('click', async () => {
          const ok = await copyTextValue(sfTsv);
          const prev = copyAllBtn.textContent;
          copyAllBtn.textContent = ok ? 'Copied TSV' : 'Clipboard blocked';
          setTimeout(() => { copyAllBtn.textContent = prev; }, 1500);
        });
      }

      slot.querySelectorAll('.sf-copy-btn').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const val = btn.getAttribute('data-copy') || '';
          const ok = await copyTextValue(val);
          const prev = btn.textContent;
          btn.textContent = ok ? 'Copied' : 'No clipboard';
          setTimeout(() => { btn.textContent = prev; }, 1200);
        });
      });

      const markSubmittedFastBtn = slot.querySelector('#mark-submitted-fast');
      if (markSubmittedFastBtn) {
        markSubmittedFastBtn.addEventListener('click', () => markSubmitted(activeId));
      }
    } catch (e) {
      slot.innerHTML = `<div class="empty">No submission packet yet. Click "Prepare submission draft" to build it.</div>`;
    }
    return;
  }

  if (tab === 'diff') {
    try {
      const d = await api(`/api/grants/${encodeURIComponent(activeId)}/diff`);
      if (!d.has_approved) {
        slot.innerHTML = `<div class="empty">No approved snapshot yet — approve this draft to start tracking diffs.</div>`;
        return;
      }
      const h = d.headline || {};
      const fileRows = (d.files || []).map(f => {
        const color = f.status === 'unchanged' ? 'var(--ink-dim)' :
                      f.status === 'modified' ? 'var(--warn)' :
                      f.status === 'added' ? 'var(--ok)' : 'var(--alert)';
        return `<tr><td>${escHTML(f.name)}</td>
                    <td style="color:${color}">${f.status}</td>
                    <td style="text-align:right">${f.current_bytes || '—'}</td>
                    <td style="text-align:right; color:var(--ink-dim)">${f.approved_bytes || '—'}</td></tr>`;
      }).join('');
      const numRow = (label, val) => {
        if (!val) return '';
        const c = val.changed ? 'var(--warn)' : 'var(--ok)';
        return `<tr><td>${label}</td>
                    <td style="color:${c}">${escHTML(String(val.current))}</td>
                    <td style="color:var(--ink-dim)">${escHTML(String(val.approved))}</td>
                    <td>${val.changed ? 'changed' : 'unchanged'}</td></tr>`;
      };
      const layers = h.layers || {};
      const layerRows = Object.entries(layers).map(([k, v]) => {
        const cur = JSON.stringify(v.current);
        const prev = JSON.stringify(v.approved);
        const c = v.changed ? 'var(--warn)' : 'var(--ok)';
        return `<tr><td>${k}</td>
                    <td style="color:${c}; font-family:monospace; font-size:11px">${escHTML(cur).slice(0, 80)}</td>
                    <td style="color:var(--ink-dim); font-family:monospace; font-size:11px">${escHTML(prev).slice(0, 80)}</td>
                    <td>${v.changed ? 'changed' : 'same'}</td></tr>`;
      }).join('');
      slot.innerHTML = `
        <h3>Diff: current draft (${escHTML(d.current_run_utc)}) vs approved (${escHTML(d.approved_run_utc)})</h3>
        <h3>Headline numbers</h3>
        <table><thead><tr><th>field</th><th>current</th><th>approved</th><th></th></tr></thead><tbody>
          ${numRow('Evidence run UTC', h.evidence_run_utc)}
          ${numRow('Eligibility score', h.eligibility_score)}
          ${numRow('Budget total', h.budget_total)}
        </tbody></table>
        <h3>Evidence layers</h3>
        <table><thead><tr><th>layer</th><th>current</th><th>approved</th><th></th></tr></thead><tbody>
          ${layerRows}
        </tbody></table>
        <h3>File-level deltas (SHA-256)</h3>
        <table><thead><tr><th>file</th><th>status</th><th>cur bytes</th><th>app bytes</th></tr></thead><tbody>
          ${fileRows}
        </tbody></table>`;
    } catch (e) {
      slot.innerHTML = `<div class="err">${e.message}</div>`;
    }
    return;
  }

  try {
    const md = await api(`/api/grants/${encodeURIComponent(activeId)}/markdown?section=${tab}`);
    slot.innerHTML = renderMarkdown(md);
  } catch (e) {
    slot.innerHTML = `<div class="err">${e.message}</div>`;
  }
}

function renderMarkdown(md) {
  // Minimal markdown -> HTML (headings, lists, tables, code, bold, italics, links).
  const lines = md.split(/\r?\n/);
  let html = '';
  let inList = false, inTable = false;
  const flush = () => {
    if (inList) { html += '</ul>'; inList = false; }
    if (inTable) { html += '</tbody></table>'; inTable = false; }
  };
  const inline = s => s
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/\*([^*]+)\*/g, '<i>$1</i>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,
             '<a href="$2" target="_blank" style="color:var(--accent-2)">$1</a>');
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i];
    if (/^### /.test(l)) { flush(); html += `<h3>${inline(l.slice(4))}</h3>`; continue; }
    if (/^## /.test(l)) { flush(); html += `<h2>${inline(l.slice(3))}</h2>`; continue; }
    if (/^# /.test(l)) { flush(); html += `<h1>${inline(l.slice(2))}</h1>`; continue; }
    if (/^---/.test(l)) { flush(); html += '<hr style="border-color:var(--border)"/>'; continue; }
    if (/^\| /.test(l)) {
      const cells = l.split('|').slice(1, -1).map(c => c.trim());
      if (lines[i+1] && /^\|[-:\s|]+\|$/.test(lines[i+1])) {
        flush();
        html += '<table><thead><tr>' +
          cells.map(c => `<th>${inline(c)}</th>`).join('') +
          '</tr></thead><tbody>';
        inTable = true;
        i++; continue;
      }
      if (inTable) {
        html += '<tr>' + cells.map(c => `<td>${inline(c)}</td>`).join('') + '</tr>';
        continue;
      }
    }
    if (/^- /.test(l)) {
      if (!inList) { flush(); html += '<ul>'; inList = true; }
      html += `<li>${inline(l.slice(2))}</li>`;
      continue;
    }
    flush();
    if (l.trim()) html += `<p>${inline(l)}</p>`;
  }
  flush();
  return html;
}

async function approve(id) {
  if (runtimeMode === 'artifact') {
    alert('Read-only artifact mode: approve requires the live grants API.');
    return;
  }
  if (!confirm(`Approve "${id}"? This locks the draft and copies it to /out/grants/_approved/.`)) return;
  try {
    const r = await api(`/api/grants/${encodeURIComponent(id)}/approve`, {method: 'POST'});
    queue = r.queue;
    renderQueue();
    loadDetail(id);
  } catch (e) {
    alert(`Approve failed: ${e.message}`);
  }
}

async function regenerate(id) {
  if (runtimeMode === 'artifact') {
    alert('Read-only artifact mode: regenerate requires the live grants API.');
    return;
  }
  try {
    const r = await api('/api/grants/regenerate', {
      method: 'POST',
      headers: {'content-type': 'application/json'},
      body: JSON.stringify({grant_id: id || null}),
    });
    queue = r.queue;
    renderQueue();
    if (activeId) loadDetail(activeId);
  } catch (e) {
    alert(`Regenerate failed: ${e.message}`);
  }
}

async function draft(grantId, options = {}) {
  const quiet = !!options.quiet;
  const skipSuccessAlert = !!options.skipSuccessAlert;
  if (runtimeMode === 'artifact') {
    const msg = 'Read-only artifact mode: drafting requires the live grants API.';
    if (quiet) throw new Error(msg);
    alert(msg);
    return;
  }
  try {
    const r = await api('/api/grants/draft', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ grant_id: grantId || null, force: true, prepare_submission: true }),
    });
    queue = r.queue;
    try {
      submissionDashboard = await api('/api/grants/submission/dashboard');
    } catch {
      submissionDashboard = null;
    }
    const draftMeta = r.draft || {};
    const targets = draftMeta.items || [];
    targets.forEach(it => {
      if (!it.grant_id) return;
      submissionByGrant.delete(it.grant_id);
    });
    renderQueue();
    if (activeId) {
      activeTab = 'submission';
      await loadDetail(activeId);
    }
    if (!quiet && !skipSuccessAlert) {
      alert(`Draft complete: ${draftMeta.n_ready || 0} ready, ${draftMeta.n_blocked || 0} blocked. Open Submission Kit tab for blockers.`);
    }
  } catch (e) {
    if (quiet) throw e;
    const msg = isTimeoutLikeError(e)
      ? 'Draft failed: 504 Gateway Timeout. The server took too long; retry in a moment.'
      : `Draft failed: ${compactErrorMessage(e, 'request failed')}`;
    alert(msg);
  }
}

async function draftAll() {
  await draft(null);
}

async function runOpportunityAutopilot() {
  if (runtimeMode === 'artifact') {
    alert('Read-only artifact mode: opportunity autopilot requires the live API.');
    return;
  }
  try {
    const r = await fetchJsonStrict('/api/opportunities/autopilot', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        harvest_min_score: 0.3,
        fill_min_score: 0.4,
        fill_limit: 30,
        build_funding_queue: true,
        funding_top: 20,
        funding_channels: 'grant,key-source,contract,loan',
        include_outreach: true,
        outreach_limit: 30,
        no_network: false,
      }),
    });

    try {
      opportunityTracker = await api('/api/opportunities/tracker');
    } catch {
      opportunityTracker = null;
    }
    try {
      queue = await api('/api/grants');
      submissionDashboard = await api('/api/grants/submission/dashboard');
    } catch {
      // keep current queue view if grants API temporarily unavailable
    }
    renderQueue();
    if (activeId) {
      activeTab = 'submission';
      await loadDetail(activeId);
    }

    const ranked = Number(r?.ranked_actionable || 0);
    const tracked = Number(r?.tracker?.opportunities?.n_total || 0);
    const awarded = Number(r?.tracker?.awards?.count || 0);
    alert(`Opportunity autopilot complete. Actionable found: ${ranked}. Tracked: ${tracked}. Awarded: ${awarded}. Outreach pack generated.`);
  } catch (e) {
    alert(`Opportunity autopilot failed: ${e.message}`);
  }
}

async function prepareSubmission(id, options = {}) {
  const quiet = !!options.quiet;
  if (runtimeMode === 'artifact') {
    const msg = 'Read-only artifact mode: prepare requires the live grants API.';
    if (quiet) throw new Error(msg);
    alert(msg);
    return;
  }
  try {
    await api(`/api/grants/${encodeURIComponent(id)}/prepare_submission`, {
      method: 'POST',
    });
    try {
      const payload = await api(`/api/grants/${encodeURIComponent(id)}/submission`);
      submissionByGrant.set(id, payload);
    } catch {
      submissionByGrant.delete(id);
    }
    try {
      submissionDashboard = await api('/api/grants/submission/dashboard');
    } catch {
      submissionDashboard = null;
    }
    activeTab = 'submission';
    await loadDetail(id);
  } catch (e) {
    if (quiet) throw e;
    const msg = isTimeoutLikeError(e)
      ? 'Prepare submission failed: 504 Gateway Timeout. The server took too long; retry in a moment.'
      : `Prepare submission failed: ${compactErrorMessage(e, 'request failed')}`;
    alert(msg);
  }
}

async function markSubmitted(id) {
  if (runtimeMode === 'artifact') {
    alert('Read-only artifact mode: mark-submitted requires the live grants API.');
    return;
  }
  const tracking = prompt(`External tracking ID for "${id}" (e.g. grants.gov reference):`);
  if (tracking === null) return;
  const by = prompt('Submitted by (your name)?', 'Robert Ashworth');
  if (by === null) return;
  try {
    const r = await api(`/api/grants/${encodeURIComponent(id)}/submitted`, {
      method: 'POST',
      headers: {'content-type': 'application/json'},
      body: JSON.stringify({submitted_by: by, external_tracking_id: tracking}),
    });
    queue = r.queue;
    try {
      submissionDashboard = await api('/api/grants/submission/dashboard');
    } catch {
      submissionDashboard = null;
    }
    renderQueue();
    loadDetail(id);
  } catch (e) {
    alert(`Mark-submitted failed: ${e.message}`);
  }
}

$('draft-all').addEventListener('click', () => draftAll());
$('opps-autopilot').addEventListener('click', () => runOpportunityAutopilot());
$('regenerate').addEventListener('click', () => regenerate(null));
ensureCinematicLayer();
renderMissionPulse();
renderTop5LiveProofBoard();
loadQueue();
