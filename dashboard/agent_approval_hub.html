<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>LumenCore — Agent Approval Hub</title>
<script>window.LUMA_PAGE_ID = 'agent_approval_hub';</script>
<script src="assets/lumencore.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet"/>
<style>
/* ============================================================
   Base + CSS Custom Properties
   ============================================================ */
:root {
  --bg-0:       #03060e;
  --bg-1:       #070b1c;
  --ink:        #e8f1ff;
  --ink-dim:    #6b7aaa;
  --neon-c:     #22d3ee;
  --neon-p:     #a855f7;
  --neon-g:     #34d399;
  --neon-a:     #f59e0b;
  --neon-r:     #ef4444;
  --neon-b:     #0ea5e9;
  --glass:      rgba(7,11,28,0.58);
  --glass-hi:   rgba(14,22,55,0.70);
  --border:     rgba(34,211,238,0.18);
  --border-hi:  rgba(34,211,238,0.42);
  --radius:     14px;
  --shadow-neon: 0 0 28px rgba(34,211,238,0.20);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }

body {
  background: var(--bg-0);
  color: var(--ink);
  font-family: 'Inter', -apple-system, sans-serif;
  overflow-x: hidden;
}

/* ============================================================
   Globe Panel
   ============================================================ */
.globe-panel {
  position: relative;
  width: 100%;
  height: 320px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

#globe-canvas {
  width: 320px;
  height: 320px;
  border-radius: 50%;
  cursor: grab;
  position: relative;
  z-index: 2;
  filter: drop-shadow(0 0 32px rgba(34,211,238,0.35));
}

#globe-canvas:active { cursor: grabbing; }

.globe-label {
  position: absolute;
  top: 50%;
  left: calc(50% + 175px);
  transform: translateY(-50%);
  z-index: 3;
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 160px;
}

.globe-stat-chip {
  background: var(--glass);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 6px 12px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  display: flex;
  justify-content: space-between;
  gap: 12px;
  backdrop-filter: blur(8px);
}

.globe-stat-chip span:last-child {
  color: var(--neon-c);
  font-weight: 700;
}

/* ============================================================
   Hub Stage
   ============================================================ */
.hub-stage {
  position: relative;
  z-index: 10;
  max-width: 1720px;
  margin: 0 auto;
  padding: 0 24px 64px;
}

/* ============================================================
   Page Heading
   ============================================================ */
.hub-heading {
  padding: 24px 0 16px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
}

.hub-title {
  font-family: 'Orbitron', sans-serif;
  font-size: 1.5rem;
  font-weight: 900;
  letter-spacing: 2px;
  color: var(--ink);
  text-shadow: 0 0 24px rgba(34,211,238,0.45);
}

.hub-sub {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--ink-dim);
  margin-top: 3px;
  letter-spacing: 0.5px;
}

.hub-meta {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

/* Stat chips in heading */
.stat-chip {
  background: var(--glass);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 5px 14px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  display: flex;
  align-items: center;
  gap: 7px;
  white-space: nowrap;
  backdrop-filter: blur(8px);
}

.stat-chip .count {
  font-weight: 700;
  font-size: 13px;
}

.stat-chip.pending .count { color: var(--neon-a); }
.stat-chip.shipped  .count { color: var(--neon-g); }
.stat-chip.value    .count { color: var(--neon-c); }

/* Refresh button */
.btn-refresh {
  background: var(--glass);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--neon-c);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  padding: 5px 12px;
  cursor: pointer;
  transition: background .15s, border-color .15s;
  letter-spacing: 0.5px;
}

.btn-refresh:hover {
  background: rgba(34,211,238,0.12);
  border-color: var(--neon-c);
}

/* ============================================================
   Tab Navigation
   ============================================================ */
.tab-nav {
  display: flex;
  gap: 4px;
  margin-bottom: 20px;
  border-bottom: 1px solid var(--border);
  padding-bottom: 0;
  flex-wrap: wrap;
}

.tab-btn {
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  color: var(--ink-dim);
  font-family: 'Orbitron', sans-serif;
  font-size: 10px;
  letter-spacing: 1.2px;
  padding: 8px 16px 10px;
  cursor: pointer;
  transition: color .15s, border-color .15s;
  position: relative;
  display: flex;
  align-items: center;
  gap: 7px;
}

.tab-btn .badge {
  background: rgba(168,85,247,0.2);
  border-radius: 10px;
  padding: 1px 6px;
  font-size: 9px;
  font-family: 'JetBrains Mono', monospace;
  color: var(--neon-p);
  min-width: 18px;
  text-align: center;
}

.tab-btn:hover { color: var(--ink); }

.tab-btn.active {
  color: var(--neon-c);
  border-bottom-color: var(--neon-c);
}

.tab-btn.active .badge {
  background: rgba(34,211,238,0.2);
  color: var(--neon-c);
}

/* ============================================================
   Cards Layout
   ============================================================ */
#cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 16px;
  min-height: 120px;
}

/* ============================================================
   Approval Card
   ============================================================ */
.approval-card {
  background: var(--glass);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 0;
  position: relative;
  overflow: hidden;
  transition: transform .18s, border-color .18s, box-shadow .18s;
  backdrop-filter: blur(14px);
  transform-style: preserve-3d;
  will-change: transform;
  animation: cardIn .35s ease forwards;
  opacity: 0;
}

@keyframes cardIn {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}

.approval-card:hover {
  border-color: var(--border-hi);
  transform: translateY(-3px) rotateX(1deg);
  box-shadow: var(--shadow-neon);
}

/* Left accent bar */
.card-accent {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  border-radius: var(--radius) 0 0 var(--radius);
}

.card-body { padding: 16px 16px 14px 20px; }

/* Card header */
.card-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 8px;
}

.card-icon-title {
  display: flex;
  align-items: flex-start;
  gap: 10px;
}

.card-icon {
  font-size: 1.4rem;
  line-height: 1;
  margin-top: 2px;
  flex-shrink: 0;
}

.card-title {
  font-family: 'Orbitron', sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.8px;
  color: var(--ink);
  word-break: break-word;
  line-height: 1.4;
}

.card-desc {
  font-size: 11.5px;
  color: var(--ink-dim);
  margin-top: 3px;
  line-height: 1.5;
  word-break: break-word;
}

/* Badges row */
.card-badges {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin: 8px 0;
}

.badge-pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: 20px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 9.5px;
  letter-spacing: 0.5px;
  border: 1px solid;
  white-space: nowrap;
}

.badge-pill.type-trade    { color: #22d3ee; border-color: rgba(34,211,238,0.35); background: rgba(34,211,238,0.08); }
.badge-pill.type-grant    { color: #a855f7; border-color: rgba(168,85,247,0.35); background: rgba(168,85,247,0.08); }
.badge-pill.type-job      { color: #34d399; border-color: rgba(52,211,153,0.35); background: rgba(52,211,153,0.08); }
.badge-pill.type-email    { color: #f59e0b; border-color: rgba(245,158,11,0.35); background: rgba(245,158,11,0.08); }
.badge-pill.type-linkedin { color: #0ea5e9; border-color: rgba(14,165,233,0.35); background: rgba(14,165,233,0.08); }

.badge-pill.priority-P0 { color: #f87171; border-color: rgba(248,113,113,0.4); background: rgba(248,113,113,0.10); }
.badge-pill.priority-P1 { color: #f59e0b; border-color: rgba(245,158,11,0.35); background: rgba(245,158,11,0.08); }
.badge-pill.priority-P2 { color: var(--ink-dim); border-color: rgba(107,122,170,0.3); background: transparent; }

/* Confidence bar */
.card-confidence {
  margin: 10px 0 12px;
}

.conf-label {
  display: flex;
  justify-content: space-between;
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  color: var(--ink-dim);
  margin-bottom: 4px;
  letter-spacing: 0.5px;
}

.conf-bar {
  height: 4px;
  border-radius: 2px;
  background: rgba(34,211,238,0.1);
  overflow: hidden;
}

.conf-fill {
  height: 100%;
  border-radius: 2px;
  transition: width 0.6s ease;
}

/* Action buttons */
.card-actions {
  display: flex;
  gap: 8px;
  margin-top: 4px;
}

.btn-ship {
  flex: 1;
  padding: 8px 12px;
  border-radius: 8px;
  border: 1px solid var(--neon-g);
  background: rgba(52,211,153,0.12);
  color: var(--neon-g);
  font-family: 'Orbitron', sans-serif;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1px;
  cursor: pointer;
  transition: background .15s, box-shadow .15s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.btn-ship:hover {
  background: rgba(52,211,153,0.22);
  box-shadow: 0 0 18px rgba(52,211,153,0.35);
}

.btn-delay {
  padding: 8px 10px;
  border-radius: 8px;
  border: 1px solid rgba(245,158,11,0.35);
  background: rgba(245,158,11,0.07);
  color: var(--neon-a);
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  cursor: pointer;
  transition: background .15s;
  display: flex;
  align-items: center;
  justify-content: center;
}

.btn-delay:hover { background: rgba(245,158,11,0.14); }

.btn-skip {
  padding: 8px 10px;
  border-radius: 8px;
  border: 1px solid rgba(107,122,170,0.3);
  background: transparent;
  color: var(--ink-dim);
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  cursor: pointer;
  transition: background .15s;
  display: flex;
  align-items: center;
  justify-content: center;
}

.btn-skip:hover { background: rgba(107,122,170,0.12); }

/* Value badge overlay (top right of card) */
.card-value {
  position: absolute;
  top: 10px;
  right: 12px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--neon-c);
  opacity: 0.7;
}

/* ============================================================
   Empty state
   ============================================================ */
.empty-state {
  grid-column: 1 / -1;
  text-align: center;
  padding: 60px 20px;
  color: var(--ink-dim);
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  border: 1px dashed var(--border);
  border-radius: var(--radius);
}

.empty-state .es-icon { font-size: 2.5rem; margin-bottom: 12px; }

/* Loading shimmer */
.card-shimmer {
  background: linear-gradient(90deg,
    rgba(34,211,238,0.05) 0%,
    rgba(34,211,238,0.12) 50%,
    rgba(34,211,238,0.05) 100%);
  background-size: 200% 100%;
  animation: shimmer 1.4s infinite;
  border-radius: var(--radius);
  height: 160px;
  border: 1px solid var(--border);
}

@keyframes shimmer { to { background-position: -200% 0; } }

/* ============================================================
   Approval Modal
   ============================================================ */
.modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 1000;
  background: rgba(3,6,14,0.85);
  backdrop-filter: blur(12px);
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s;
}

.modal-overlay.open {
  opacity: 1;
  pointer-events: all;
}

.modal-box {
  background: var(--glass-hi);
  border: 1px solid var(--border-hi);
  border-radius: 18px;
  width: min(520px, 95vw);
  padding: 28px;
  box-shadow: 0 0 60px rgba(34,211,238,0.20), 0 24px 80px rgba(0,0,0,0.6);
  position: relative;
  animation: modalIn .25s ease forwards;
}

@keyframes modalIn {
  from { transform: scale(0.94) translateY(8px); opacity: 0; }
  to   { transform: scale(1) translateY(0);       opacity: 1; }
}

.modal-badge {
  position: absolute;
  top: -1px;
  left: 50%;
  transform: translateX(-50%);
  background: linear-gradient(90deg, var(--neon-g), var(--neon-c));
  color: #040c1f;
  font-family: 'Orbitron', sans-serif;
  font-size: 9px;
  font-weight: 900;
  letter-spacing: 2px;
  padding: 3px 14px;
  border-radius: 0 0 8px 8px;
}

.modal-title {
  font-family: 'Orbitron', sans-serif;
  font-size: 1rem;
  font-weight: 900;
  letter-spacing: 1.5px;
  text-align: center;
  margin: 16px 0 6px;
  color: var(--ink);
}

.modal-sub {
  text-align: center;
  color: var(--ink-dim);
  font-size: 12px;
  margin-bottom: 20px;
  line-height: 1.5;
}

.modal-detail {
  background: rgba(7,11,28,0.6);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px;
  margin-bottom: 20px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  line-height: 1.7;
}

.modal-detail .key { color: var(--ink-dim); }
.modal-detail .val { color: var(--ink); font-weight: 600; }

.modal-next-action {
  background: rgba(34,211,238,0.07);
  border: 1px solid rgba(34,211,238,0.25);
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 11px;
  color: var(--neon-c);
  margin-bottom: 20px;
  line-height: 1.5;
}

.modal-actions {
  display: flex;
  gap: 10px;
}

.btn-confirm-ship {
  flex: 1;
  padding: 12px;
  border-radius: 10px;
  border: 1px solid var(--neon-g);
  background: rgba(52,211,153,0.15);
  color: var(--neon-g);
  font-family: 'Orbitron', sans-serif;
  font-size: 11px;
  font-weight: 900;
  letter-spacing: 1.5px;
  cursor: pointer;
  transition: background .15s, box-shadow .15s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.btn-confirm-ship:hover {
  background: rgba(52,211,153,0.28);
  box-shadow: 0 0 24px rgba(52,211,153,0.45);
}

.btn-confirm-ship:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.btn-cancel-modal {
  padding: 12px 20px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--glass);
  color: var(--ink-dim);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  cursor: pointer;
  transition: background .15s;
}

.btn-cancel-modal:hover { background: var(--glass-hi); color: var(--ink); }

/* ============================================================
   Toast notifications
   ============================================================ */
#toast-container {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 2000;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.toast {
  background: var(--glass-hi);
  border: 1px solid;
  border-radius: 10px;
  padding: 12px 18px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  min-width: 280px;
  max-width: 440px;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  backdrop-filter: blur(12px);
  animation: toastIn .25s ease forwards;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
}

@keyframes toastIn {
  from { opacity: 0; transform: translateX(20px); }
  to   { opacity: 1; transform: translateX(0); }
}

.toast.success { border-color: rgba(52,211,153,0.5); }
.toast.error   { border-color: rgba(239,68,68,0.5); }
.toast.info    { border-color: rgba(34,211,238,0.4); }

.toast-icon    { font-size: 1rem; flex-shrink: 0; margin-top: 1px; }
.toast-msg     { flex: 1; line-height: 1.5; color: var(--ink); }
.toast-action  { color: var(--neon-c); font-size: 10px; display: block; margin-top: 3px; }

/* ============================================================
   Activity Log
   ============================================================ */
.activity-section {
  margin-top: 36px;
  border-top: 1px solid var(--border);
  padding-top: 20px;
}

.activity-title {
  font-family: 'Orbitron', sans-serif;
  font-size: 10px;
  letter-spacing: 2px;
  color: var(--ink-dim);
  margin-bottom: 12px;
}

#activity-log {
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-height: 220px;
  overflow-y: auto;
}

#activity-log::-webkit-scrollbar { width: 4px; }
#activity-log::-webkit-scrollbar-track { background: transparent; }
#activity-log::-webkit-scrollbar-thumb { background: rgba(34,211,238,0.2); border-radius: 2px; }

.log-entry {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 12px;
  background: var(--glass);
  border-radius: 8px;
  border: 1px solid transparent;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10.5px;
  animation: cardIn .3s ease forwards;
  opacity: 0;
}

.log-entry.approve { border-color: rgba(52,211,153,0.2); }
.log-entry.skip    { border-color: rgba(107,122,170,0.2); }
.log-entry.delay   { border-color: rgba(245,158,11,0.2); }

.log-action {
  font-weight: 700;
  font-size: 9px;
  letter-spacing: 1px;
  min-width: 60px;
}

.log-action.approve { color: var(--neon-g); }
.log-action.skip    { color: var(--ink-dim); }
.log-action.delay   { color: var(--neon-a); }

.log-item-id { color: var(--ink); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.log-ts      { color: var(--ink-dim); font-size: 9.5px; flex-shrink: 0; }

/* ============================================================
   Responsive
   ============================================================ */
@media (max-width: 700px) {
  .hub-stage    { padding: 0 12px 48px; }
  .globe-label  { display: none; }
  .globe-panel  { height: 240px; }
  #globe-canvas { width: 240px; height: 240px; }
  #cards-grid   { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<!-- lumencore.js injects: bg-canvas, holographic grid, scanlines, top bar -->

<main class="hub-stage" id="hub-stage">

  <!-- === Globe Panel ======================================== -->
  <section class="globe-panel" id="globe-section">
    <canvas id="globe-canvas"></canvas>
    <div class="globe-label" id="globe-label">
      <!-- populated by JS -->
    </div>
  </section>

  <!-- === Page Heading ======================================== -->
  <header class="hub-heading">
    <div>
      <div class="hub-title">AGENT APPROVAL HUB</div>
      <div class="hub-sub">AUTONOMOUS AGENTS · HUMAN-IN-THE-LOOP APPROVAL · YOU SHIP</div>
    </div>
    <div class="hub-meta">
      <div class="stat-chip pending">
        <span>PENDING</span>
        <span class="count" id="count-pending">—</span>
      </div>
      <div class="stat-chip shipped">
        <span>SHIPPED</span>
        <span class="count" id="count-shipped">—</span>
      </div>
      <div class="stat-chip value">
        <span>VALUE QUEUED</span>
        <span class="count" id="value-queued">—</span>
      </div>
      <button class="btn-refresh" id="btn-refresh" onclick="refreshAll()">↻ REFRESH</button>
    </div>
  </header>

  <!-- === Tab Navigation ===================================== -->
  <nav class="tab-nav" id="tab-nav" role="tablist">
    <button class="tab-btn active" data-tab="all"       onclick="switchTab('all',this)">ALL <span class="badge" id="tab-badge-all">0</span></button>
    <button class="tab-btn"        data-tab="trade"     onclick="switchTab('trade',this)">⚡ TRADES <span class="badge" id="tab-badge-trade">0</span></button>
    <button class="tab-btn"        data-tab="grant"     onclick="switchTab('grant',this)">🏛 GRANTS <span class="badge" id="tab-badge-grant">0</span></button>
    <button class="tab-btn"        data-tab="job"       onclick="switchTab('job',this)">💼 JOBS <span class="badge" id="tab-badge-job">0</span></button>
    <button class="tab-btn"        data-tab="outreach"  onclick="switchTab('outreach',this)">📡 OUTREACH <span class="badge" id="tab-badge-outreach">0</span></button>
  </nav>

  <!-- === Cards Grid ========================================== -->
  <div id="cards-grid" role="main">
    <div class="card-shimmer" style="animation-delay:0s"></div>
    <div class="card-shimmer" style="animation-delay:.1s"></div>
    <div class="card-shimmer" style="animation-delay:.2s"></div>
  </div>

  <!-- === Activity Log ======================================== -->
  <section class="activity-section">
    <div class="activity-title">RECENT AGENT DECISIONS</div>
    <div id="activity-log">
      <div style="color:var(--ink-dim);font-family:'JetBrains Mono',monospace;font-size:11px;padding:8px 0;">Loading activity log…</div>
    </div>
  </section>

</main>

<!-- === Confirmation Modal ===================================== -->
<div class="modal-overlay" id="ship-modal" role="dialog" aria-modal="true">
  <div class="modal-box">
    <div class="modal-badge">SHIP CONFIRMATION</div>
    <div class="modal-title" id="modal-title">Confirm Agent Action</div>
    <div class="modal-sub" id="modal-sub">Review the details below before approving ship</div>
    <div class="modal-detail" id="modal-detail"></div>
    <div class="modal-next-action" id="modal-next-action" style="display:none"></div>
    <div class="modal-actions">
      <button class="btn-confirm-ship" id="btn-confirm-ship" onclick="executeApprove()">
        <span>🚀</span><span>CONFIRM SHIP</span>
      </button>
      <button class="btn-cancel-modal" onclick="closeModal()">CANCEL</button>
    </div>
  </div>
</div>

<!-- === Toast Container ======================================== -->
<div id="toast-container" aria-live="polite"></div>

<!-- === Alpha Globe JS ========================================= -->
<script src="js/alpha_globe_3d.js"></script>

<script>
// ============================================================
// Constants & State
// ============================================================
var API_BASE = (typeof window.LUMA_API_BASE === 'string' && window.LUMA_API_BASE)
  ? window.LUMA_API_BASE.replace(/\/$/, '')
  : '';

var AGENT_QUEUE_URL   = API_BASE + '/api/agents/queue';
var AGENT_APPROVE_URL = API_BASE + '/api/agents/approve';
var AGENT_LOG_URL     = API_BASE + '/api/agents/log';
var ALPHA_MAP_URL     = API_BASE + '/out/ops/kraken_multi_tf_alpha_map_latest.json';

var LOCAL_FALLBACKS = {
  queue:    '../out/ops/agent_approval_queue_fallback.json',
  log:      '../out/ops/agent_approval_log_fallback.json',
};

var TYPE_META = {
  trade_ticket:    { label: 'TRADE',    icon: '⚡', cssType: 'type-trade',    neon: '#22d3ee' },
  grant_submission:{ label: 'GRANT',    icon: '🏛', cssType: 'type-grant',    neon: '#a855f7' },
  job_application: { label: 'JOB',      icon: '💼', cssType: 'type-job',      neon: '#34d399' },
  email_dispatch:  { label: 'EMAIL',    icon: '📧', cssType: 'type-email',    neon: '#f59e0b' },
  linkedin_post:   { label: 'LINKEDIN', icon: '🔗', cssType: 'type-linkedin', neon: '#0ea5e9' },
};

var TAB_TYPE_MAP = {
  all:      null,
  trade:    'trade_ticket',
  grant:    'grant_submission',
  job:      'job_application',
  outreach: null,  // email + linkedin
};

var _allItems     = [];
var _activeTab    = 'all';
var _pendingModal = null;
var _refreshTimer = null;

// ============================================================
// Globe
// ============================================================
var _globe = null;

function initGlobe() {
  var canvas = document.getElementById('globe-canvas');
  if (!canvas) return;
  setTimeout(function () {
    _globe = new AlphaGlobe3D(canvas, { radius: 4.8, rotateSpeed: 0.0022 });
    _globe.loadFromUrl(ALPHA_MAP_URL);
    _globe.on('ready', function (info) {
      populateGlobeLabel(info);
    });
    _globe.on('select', function (d) {
      showToast('info', '🌍 ' + d.pair + ' selected', 'Alpha: ' + ((d.alpha_score || 0) * 100).toFixed(1) + '% · ' + (d.alpha_tier || 'neutral').toUpperCase());
    });
  }, 900);
}

function populateGlobeLabel(info) {
  var el = document.getElementById('globe-label');
  if (!el) return;
  el.innerHTML = [
    '<div class="globe-stat-chip"><span>PAIRS ANALYZED</span><span>' + (info.count || 0) + '</span></div>',
    '<div class="globe-stat-chip"><span>GLOBE MODE</span><span>LIVE ALPHA</span></div>',
    '<div class="globe-stat-chip" style="font-size:9px;color:var(--ink-dim)">DRAG TO ROTATE · SCROLL ZOOM</div>',
  ].join('');
}

// ============================================================
// Data Loading
// ============================================================
function fetchJSON(url) {
  return fetch(url, { cache: 'no-cache' }).then(function (r) {
    if (!r.ok) throw new Error(r.status);
    return r.json();
  });
}

function loadQueue() {
  return fetchJSON(AGENT_QUEUE_URL)
    .catch(function () { return fetchJSON(LOCAL_FALLBACKS.queue); })
    .catch(function () { return { items: [], total_pending: 0, total_value_usd: 0 }; });
}

function loadLog() {
  return fetchJSON(AGENT_LOG_URL)
    .catch(function () { return { entries: [] }; });
}

function refreshAll() {
  var btn = document.getElementById('btn-refresh');
  if (btn) { btn.textContent = '↻ …'; btn.disabled = true; }

  Promise.all([loadQueue(), loadLog()]).then(function (results) {
    var queueData = results[0];
    var logData   = results[1];

    _allItems = queueData.items || [];
    renderStats(queueData);
    renderTabBadges(_allItems);
    renderCards(_allItems, _activeTab);
    renderLog(logData.entries || []);

    if (btn) { btn.textContent = '↻ REFRESH'; btn.disabled = false; }
  });
}

// ============================================================
// Stats
// ============================================================
function renderStats(data) {
  setEl('count-pending', data.total_pending || 0);
  setEl('value-queued',  '$' + fmtNum(data.total_value_usd || 0));
}

function updateShippedCount(delta) {
  var el = document.getElementById('count-shipped');
  if (!el) return;
  var cur = parseInt(el.textContent) || 0;
  el.textContent = cur + delta;
}

// ============================================================
// Tab Badges
// ============================================================
function renderTabBadges(items) {
  var counts = {
    trade:    0, grant: 0, job: 0, email: 0, linkedin: 0, all: items.length
  };
  items.forEach(function (item) {
    if (item.agent_type === 'trade_ticket')    counts.trade++;
    if (item.agent_type === 'grant_submission') counts.grant++;
    if (item.agent_type === 'job_application')  counts.job++;
    if (item.agent_type === 'email_dispatch')   counts.email++;
    if (item.agent_type === 'linkedin_post')    counts.linkedin++;
  });
  setEl('tab-badge-all',      items.length);
  setEl('tab-badge-trade',    counts.trade);
  setEl('tab-badge-grant',    counts.grant);
  setEl('tab-badge-job',      counts.job);
  setEl('tab-badge-outreach', counts.email + counts.linkedin);
}

// ============================================================
// Tab switch
// ============================================================
function switchTab(tabId, btn) {
  _activeTab = tabId;
  document.querySelectorAll('.tab-btn').forEach(function (b) { b.classList.remove('active'); });
  if (btn) btn.classList.add('active');
  renderCards(_allItems, tabId);
}

// ============================================================
// Card Rendering
// ============================================================
function filterItems(items, tab) {
  if (tab === 'all') return items;
  var typeKey = TAB_TYPE_MAP[tab];
  if (typeKey) return items.filter(function (i) { return i.agent_type === typeKey; });
  // outreach = email + linkedin
  if (tab === 'outreach') return items.filter(function (i) {
    return i.agent_type === 'email_dispatch' || i.agent_type === 'linkedin_post';
  });
  return items;
}

function renderCards(items, tab) {
  var grid    = document.getElementById('cards-grid');
  var visible = filterItems(items, tab);

  if (visible.length === 0) {
    grid.innerHTML = [
      '<div class="empty-state">',
      '<div class="es-icon">✅</div>',
      '<b>All clear — no pending approvals in this lane</b><br/>',
      '<span style="font-size:11px">Agents are working. Next actions will surface here automatically.</span>',
      '</div>',
    ].join('');
    return;
  }

  grid.innerHTML = visible.map(function (item, idx) {
    return buildCardHTML(item, idx);
  }).join('');
}

function buildCardHTML(item, idx) {
  var meta   = TYPE_META[item.agent_type] || { label: item.agent_type, icon: '🤖', cssType: '', neon: '#7d8bb5' };
  var conf   = Math.min(1, Math.max(0, item.confidence || 0));
  var confPct = (conf * 100).toFixed(0);
  var confColor = conf >= 0.75 ? '#34d399' : conf >= 0.45 ? '#f59e0b' : '#f87171';
  var priorityClass = 'priority-' + (item.priority || 'P2');
  var valueStr = item.value_usd > 0 ? '$' + fmtNum(item.value_usd) : '';
  var deadlineStr = item.deadline ? ('<span class="badge-pill" style="color:#f87171;border-color:rgba(248,113,113,0.3);background:rgba(248,113,113,0.07)">⏰ ' + safeText(item.deadline).slice(0, 10) + '</span>') : '';
  var channelStr = item.channel ? ('<span class="badge-pill type-' + cssChannel(item.channel) + '">' + safeText(item.channel).toUpperCase() + '</span>') : '';

  var keywords = (item.keywords || []).slice(0, 3).map(function (k) {
    return '<span class="badge-pill" style="color:var(--ink-dim);border-color:rgba(107,122,170,0.2)">' + safeText(k) + '</span>';
  }).join('');

  return [
    '<div class="approval-card" id="card-' + safeId(item.id) + '" style="animation-delay:' + (idx * 0.04) + 's">',
    '  <div class="card-accent" style="background:' + meta.neon + '"></div>',
    valueStr ? '  <div class="card-value">' + valueStr + '</div>' : '',
    '  <div class="card-body">',
    '    <div class="card-header">',
    '      <div class="card-icon-title">',
    '        <div class="card-icon">' + meta.icon + '</div>',
    '        <div>',
    '          <div class="card-title">' + safeText(item.title) + '</div>',
    '          <div class="card-desc">' + safeText(item.description || '') + '</div>',
    '        </div>',
    '      </div>',
    '    </div>',
    '    <div class="card-badges">',
    '      <span class="badge-pill ' + meta.cssType + '">' + meta.label + '</span>',
    '      <span class="badge-pill ' + priorityClass + '">' + (item.priority || 'P2') + '</span>',
    channelStr,
    deadlineStr,
    keywords,
    '    </div>',
    '    <div class="card-confidence">',
    '      <div class="conf-label"><span>CONFIDENCE</span><span style="color:' + confColor + '">' + confPct + '%</span></div>',
    '      <div class="conf-bar"><div class="conf-fill" style="width:' + confPct + '%;background:' + confColor + '"></div></div>',
    '    </div>',
    '    <div class="card-actions">',
    '      <button class="btn-ship" onclick="openModal(' + JSON.stringify(item.id) + ')">',
    '        <span>🚀</span><span>APPROVE & SHIP</span>',
    '      </button>',
    '      <button class="btn-delay" title="Delay — resurface next cycle" onclick="quickAction(' + JSON.stringify(item.id) + ',' + JSON.stringify(item.agent_type) + ',\'delay\')">⏱</button>',
    '      <button class="btn-skip"  title="Skip this item" onclick="quickAction(' + JSON.stringify(item.id) + ',' + JSON.stringify(item.agent_type) + ',\'skip\')">✕</button>',
    '    </div>',
    '  </div>',
    '</div>',
  ].join('');
}

function cssChannel(ch) {
  if (!ch) return '';
  if (ch.indexOf('linkedin') !== -1) return 'linkedin';
  if (ch.indexOf('trade') !== -1 || ch.indexOf('kraken') !== -1) return 'trade';
  if (ch.indexOf('grant') !== -1) return 'grant';
  if (ch.indexOf('email') !== -1) return 'email';
  return 'job';
}

// ============================================================
// Modal
// ============================================================
function openModal(itemId) {
  var item = _allItems.find(function (i) { return i.id === itemId; });
  if (!item) return;
  _pendingModal = item;

  var meta = TYPE_META[item.agent_type] || { icon: '🤖', label: item.agent_type };
  setEl('modal-title', meta.icon + ' ' + safeText(item.title));
  setEl('modal-sub',   'You are about to approve and ship this agent action.');

  var details = [
    '<span class="key">TYPE:       </span><span class="val">' + (meta.label || item.agent_type) + '</span><br/>',
    '<span class="key">ID:         </span><span class="val">' + safeText(item.id) + '</span><br/>',
    '<span class="key">PRIORITY:   </span><span class="val">' + (item.priority || '—') + '</span><br/>',
    '<span class="key">CONFIDENCE: </span><span class="val">' + ((item.confidence || 0) * 100).toFixed(0) + '%</span><br/>',
    item.value_usd > 0 ? '<span class="key">VALUE:      </span><span class="val">$' + fmtNum(item.value_usd) + '</span><br/>' : '',
    item.deadline ? '<span class="key">DEADLINE:   </span><span class="val">' + safeText(item.deadline) + '</span><br/>' : '',
    item.channel  ? '<span class="key">CHANNEL:    </span><span class="val">' + safeText(item.channel)  + '</span><br/>' : '',
  ].join('');
  setEl('modal-detail', details);

  var nextEl = document.getElementById('modal-next-action');
  if (nextEl) {
    nextEl.style.display = 'none';
    nextEl.textContent = '';
  }

  document.getElementById('ship-modal').classList.add('open');
  document.getElementById('btn-confirm-ship').disabled = false;
}

function closeModal() {
  document.getElementById('ship-modal').classList.remove('open');
  _pendingModal = null;
}

// Close modal on overlay click
document.getElementById('ship-modal').addEventListener('click', function (e) {
  if (e.target === this) closeModal();
});

// ============================================================
// Execute Approval
// ============================================================
function executeApprove() {
  if (!_pendingModal) return;
  var item = _pendingModal;
  var confirmBtn = document.getElementById('btn-confirm-ship');
  if (confirmBtn) { confirmBtn.disabled = true; confirmBtn.innerHTML = '<span>⏳</span><span>SHIPPING…</span>'; }

  fetch(AGENT_APPROVE_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ item_id: item.id, item_type: item.agent_type, action: 'approve', notes: '' }),
  })
    .then(function (r) { return r.json(); })
    .then(function (result) { handleApproveResult(item, result); })
    .catch(function (err) {
      // Still record locally if API offline
      handleApproveResult(item, { success: true, message: 'Queued locally (API offline)', action: 'approve', next_action: 'Run autonomy loop when gateway is reachable' });
    });
}

function handleApproveResult(item, result) {
  closeModal();
  var success = result.success !== false;

  if (success) {
    showToast('success', '✅ ' + safeText(item.title) + ' approved!', result.next_action || result.message || '');
    removeCardFromGrid(item.id);
    updateShippedCount(1);
    addLogEntry({ action: 'approve', item_id: item.id, timestamp_utc: new Date().toISOString() });
    _allItems = _allItems.filter(function (i) { return i.id !== item.id; });
    renderTabBadges(_allItems);
  } else {
    showToast('error', '❌ Failed: ' + safeText(item.id), result.message || 'Unknown error');
    var confirmBtn = document.getElementById('btn-confirm-ship');
    if (confirmBtn) { confirmBtn.disabled = false; confirmBtn.innerHTML = '<span>🚀</span><span>CONFIRM SHIP</span>'; }
  }

  // Show next action hint in modal if provided
  if (result.next_action) {
    var nextEl = document.getElementById('modal-next-action');
    if (nextEl) {
      nextEl.style.display = 'block';
      nextEl.textContent = '→ ' + result.next_action;
    }
  }

  if (success && result.redirect_endpoint) {
    showToast('info', '🔀 Route to ' + result.redirect_endpoint, 'Complete final approval in the Kraken execution dashboard');
  }
}

function quickAction(itemId, itemType, action) {
  fetch(AGENT_APPROVE_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ item_id: itemId, item_type: itemType, action: action, notes: '' }),
  })
    .then(function (r) { return r.json(); })
    .then(function () {
      var icon = action === 'skip' ? '⊘' : '⏱';
      showToast('info', icon + ' ' + action.toUpperCase() + ': ' + itemId, '');
      removeCardFromGrid(itemId);
      _allItems = _allItems.filter(function (i) { return i.id !== itemId; });
      renderTabBadges(_allItems);
      addLogEntry({ action: action, item_id: itemId, timestamp_utc: new Date().toISOString() });
    })
    .catch(function () {
      showToast('info', '⊘ ' + action + ': ' + itemId, 'Recorded locally');
      removeCardFromGrid(itemId);
    });
}

function removeCardFromGrid(itemId) {
  var card = document.getElementById('card-' + safeId(itemId));
  if (!card) return;
  card.style.transition = 'opacity .3s, transform .3s';
  card.style.opacity = '0';
  card.style.transform = 'scale(0.93) translateY(-8px)';
  setTimeout(function () { if (card.parentNode) card.parentNode.removeChild(card); }, 350);
}

// ============================================================
// Activity Log
// ============================================================
function renderLog(entries) {
  var el = document.getElementById('activity-log');
  if (!el) return;
  if (!entries || entries.length === 0) {
    el.innerHTML = '<div style="color:var(--ink-dim);font-family:\'JetBrains Mono\',monospace;font-size:11px;padding:8px 0;">No decisions yet — first approval will appear here.</div>';
    return;
  }
  el.innerHTML = entries.slice(0, 30).map(function (e, idx) {
    var action = (e.action || 'approve').toLowerCase();
    var ts = e.timestamp_utc ? e.timestamp_utc.replace('T', ' ').slice(0, 19) + 'Z' : '';
    return [
      '<div class="log-entry ' + action + '" style="animation-delay:' + (idx * 0.03) + 's">',
      '  <span class="log-action ' + action + '">' + action.toUpperCase() + '</span>',
      '  <span class="log-item-id">' + safeText(e.item_type || '') + ' · ' + safeText(e.item_id || '') + '</span>',
      '  <span class="log-ts">' + ts + '</span>',
      '</div>',
    ].join('');
  }).join('');
}

function addLogEntry(entry) {
  var el = document.getElementById('activity-log');
  if (!el) return;
  var action = (entry.action || 'approve').toLowerCase();
  var ts = new Date().toISOString().replace('T', ' ').slice(0, 19) + 'Z';
  var div = document.createElement('div');
  div.className = 'log-entry ' + action;
  div.style.opacity = '0';
  div.style.animationDelay = '0s';
  div.innerHTML = [
    '<span class="log-action ' + action + '">' + action.toUpperCase() + '</span>',
    '<span class="log-item-id">' + safeText(entry.item_id || '') + '</span>',
    '<span class="log-ts">' + ts + '</span>',
  ].join('');
  el.insertBefore(div, el.firstChild);
}

// ============================================================
// Toast notifications
// ============================================================
function showToast(type, msg, detail) {
  var container = document.getElementById('toast-container');
  if (!container) return;
  var icons = { success: '✅', error: '❌', info: 'ℹ️' };
  var div = document.createElement('div');
  div.className = 'toast ' + type;
  div.innerHTML = [
    '<span class="toast-icon">' + (icons[type] || 'ℹ️') + '</span>',
    '<div class="toast-msg">',
    safeText(msg),
    detail ? '<span class="toast-action">' + safeText(detail) + '</span>' : '',
    '</div>',
  ].join('');
  container.appendChild(div);
  setTimeout(function () {
    div.style.transition = 'opacity .4s, transform .4s';
    div.style.opacity    = '0';
    div.style.transform  = 'translateX(20px)';
    setTimeout(function () { if (div.parentNode) div.parentNode.removeChild(div); }, 420);
  }, 5200);
}

// ============================================================
// Helpers
// ============================================================
function setEl(id, val) {
  var el = document.getElementById(id);
  if (el) el.textContent = String(val);
}

function safeText(s) {
  return String(s || '').replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function safeId(s) {
  return String(s || '').replace(/[^a-zA-Z0-9_-]/g, '_');
}

function fmtNum(n) {
  var v = Number(n) || 0;
  if (v >= 1e6) return (v / 1e6).toFixed(1) + 'M';
  if (v >= 1e3) return (v / 1e3).toFixed(1) + 'K';
  return v.toFixed(2);
}

// ============================================================
// Init
// ============================================================
document.addEventListener('DOMContentLoaded', function () {
  refreshAll();
  initGlobe();

  // Auto-refresh every 45 seconds
  _refreshTimer = setInterval(refreshAll, 45000);

  // Keyboard shortcut: Escape closes modal
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeModal();
  });
});
</script>
</body>
</html>
