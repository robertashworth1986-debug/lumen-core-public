<svg xmlns="http://www.w3.org/2000/svg" width="540" height="160" viewBox="0 0 540 160">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ffe7"/>
      <stop offset="100%" style="stop-color:#7928ca"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="540" height="160" rx="12" fill="url(#bg)" stroke="#30363d" stroke-width="1"/>

  <!-- Top accent bar -->
  <rect width="540" height="3" rx="0" fill="url(#accent)"/>

  <!-- Pulsing status dot -->
  <circle cx="22" cy="28" r="5" fill="#00ffe7" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.3;0.9" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="34" y="33" font-family="monospace" font-size="12" fill="#8b949e">LumaTrader™ — LIVE EXECUTOR</text>

  <!-- Divider -->
  <line x1="16" y1="45" x2="524" y2="45" stroke="#30363d" stroke-width="1"/>

  <!-- Equity -->
  <text x="20" y="75" font-family="monospace" font-size="11" fill="#8b949e">EQUITY</text>
  <text x="20" y="100" font-family="ui-monospace,monospace" font-size="28" font-weight="bold" fill="#00ffe7">$—.——</text>
  <text x="20" y="118" font-family="monospace" font-size="10" fill="#484f58">Initializing · first run pending</text>

  <!-- Positions -->
  <text x="220" y="75" font-family="monospace" font-size="11" fill="#8b949e">POSITIONS</text>
  <text x="220" y="100" font-family="ui-monospace,monospace" font-size="28" font-weight="bold" fill="#e6edf3">—</text>

  <!-- Heat -->
  <text x="340" y="75" font-family="monospace" font-size="11" fill="#8b949e">PORT. HEAT</text>
  <text x="340" y="100" font-family="ui-monospace,monospace" font-size="28" font-weight="bold" fill="#e6edf3">—%</text>

  <!-- Mode -->
  <rect x="400" y="82" width="120" height="28" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="460" y="100" font-family="monospace" font-size="11" fill="#8b949e" text-anchor="middle">Awaiting sync</text>

  <!-- Footer -->
  <line x1="16" y1="135" x2="524" y2="135" stroke="#30363d" stroke-width="1"/>
  <text x="20" y="151" font-family="monospace" font-size="9" fill="#484f58">Auto-updated every 20 min · lumen-core.ai</text>
  <text x="524" y="151" font-family="monospace" font-size="9" fill="#484f58" text-anchor="end">github.com/robertashworth1986-debug</text>
</svg>