<svg width="600" height="200" viewBox="0 0 600 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ffe7;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#7928ca;stop-opacity:0.8" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="200" rx="12" fill="url(#bg)" />
  <rect width="600" height="3" rx="1.5" fill="url(#accent)" />

  <!-- Status dot (animated) -->
  <circle cx="28" cy="32" r="6" fill="#8b949e" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Title -->
  <text x="46" y="37" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff">LumaTrader™ — Live Execution</text>
  <text x="46" y="55" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#8b949e">unknown</text>

  <!-- Divider -->
  <line x1="20" y1="70" x2="580" y2="70" stroke="#21262d" stroke-width="1"/>

  <!-- Equity (main metric) -->
  <text x="30" y="110" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#8b949e">LIVE EQUITY</text>
  <text x="30" y="142" font-family="'Segoe UI', system-ui, sans-serif" font-size="36" font-weight="800" fill="#00ffe7" filter="url(#glow)">—</text>

  <!-- Stats grid -->
  <text x="300" y="95" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#8b949e">OPEN POSITIONS</text>
  <text x="300" y="115" font-family="'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff">—</text>

  <text x="420" y="95" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#8b949e">PORTFOLIO HEAT</text>
  <text x="420" y="115" font-family="'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="700" fill="#8b949e">—</text>

  <text x="300" y="148" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#8b949e">TOTAL EXECUTIONS</text>
  <text x="300" y="168" font-family="'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="700" fill="#7ee787">—</text>

  <text x="420" y="148" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#8b949e">EXCHANGE</text>
  <text x="420" y="168" font-family="'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Kraken</text>

  <!-- Footer -->
  <line x1="20" y1="178" x2="580" y2="178" stroke="#21262d" stroke-width="1"/>
  <text x="30" y="193" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#484f58">Updated: 2026-07-12 04:41 UTC · lumen-core.ai · Hash-chained proof at /evidence/</text>
</svg>
