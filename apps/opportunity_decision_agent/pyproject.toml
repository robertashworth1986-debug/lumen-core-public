[build-system]
requires = ["setuptools>=80,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "lumencore-opportunity-decision-agent"
version = "0.1.0"
description = "Public-safe, HumanUnlock-gated opportunity decision briefs for LumenCore."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "openai-agents==0.22.0",
  "pydantic==2.13.4",
]

[project.scripts]
lumencore-opportunity-decision = "lumencore_opportunity_agent.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lumencore_opportunity_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
