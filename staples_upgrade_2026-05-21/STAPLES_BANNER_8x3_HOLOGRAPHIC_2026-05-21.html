<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>LumenCore Striking Banner</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Exo+2:wght@400;600;700&display=swap');
:root{--bg:#09111b;--bg2:#0f1d2a;--n1:#00E6C3;--n2:#32B8FF;--n3:#FF6A2A;--ink:#F3F8FF;}
html,body{margin:0} body{font-family:'Exo 2',sans-serif;color:var(--ink);background:#fff;}
.banner{width:96in;height:36in;position:relative;overflow:hidden;background:radial-gradient(circle at 20% 20%,rgba(0,230,195,.24),transparent 42%),radial-gradient(circle at 80% 25%,rgba(50,184,255,.25),transparent 45%),linear-gradient(120deg,var(--bg),var(--bg2));}
.geo{position:absolute;inset:0;background-image:repeating-linear-gradient(30deg,rgba(255,255,255,.04) 0 2px, transparent 2px 36px),repeating-linear-gradient(-30deg,rgba(255,255,255,.03) 0 2px, transparent 2px 36px);opacity:.7}
.core{position:absolute;left:4in;top:5in;right:23in;z-index:3}
.kicker{display:inline-block;font-size:1.3in;letter-spacing:.16in;text-transform:uppercase;padding:.24in .4in;border-radius:.6in;background:linear-gradient(90deg,var(--n1),var(--n2));color:#05201f;font-weight:800}
h1{font-family:'Orbitron',sans-serif;font-size:3.7in;line-height:1.03;margin:.8in 0 .5in;letter-spacing:.08in}
.sub{font-size:1.2in;line-height:1.45;max-width:60in;color:#d7e8f6}
.ribbon{position:absolute;left:4in;bottom:4in;font-size:1in;padding:.28in .55in;border:2px solid rgba(255,255,255,.4);border-radius:.35in;background:rgba(0,0,0,.18)}
.qrpanel{position:absolute;right:4.2in;top:5.4in;width:16in;padding:1in;border-radius:1in;background:rgba(255,255,255,.1);backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.32);z-index:4}
.qrpanel h3{margin:0 0 .5in;font-size:1.1in;letter-spacing:.08in;text-transform:uppercase;color:#adfff0}
.qrgrid{display:grid;grid-template-columns:1fr 1fr;gap:.5in}
.item{background:#fff;border-radius:.45in;padding:.35in;text-align:center;color:#111}
.item img{width:100%;border-radius:.2in}
.item div{font-size:.55in;font-weight:700;margin-top:.2in}
</style></head><body><section class="banner"><div class="geo"></div><div class="core"><span class="kicker">Live AI Infrastructure</span><h1>LUMENCORE</h1><p class="sub">Geometric, holographic, high-definition command layer for real-time intelligence, execution control, and institutional proof.</p></div><div class="ribbon">SaaS + Licensing + Mission Control Deployment</div><aside class="qrpanel"><h3>Scan In</h3><div class="qrgrid"><div class="item"><img src="qr/qr_investor.svg"><div>Investor</div></div><div class="item"><img src="qr/qr_partner.svg"><div>Partner</div></div><div class="item"><img src="qr/qr_customer.svg"><div>Customer</div></div><div class="item"><img src="qr/qr_health.svg"><div>Health</div></div></div></aside></section></body></html>
