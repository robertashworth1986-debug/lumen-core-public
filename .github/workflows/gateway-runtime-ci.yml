name: Gateway bounded runtime controls

on:
  pull_request:
    paths:
      - 'code/luma_experience_gateway*.py'
      - 'code/operator_api_access.py'
      - 'code/ops/VERIFY_GATEWAY_MINIMAL_RUNTIME.py'
      - 'requirements-gateway-minimal*'
      - 'tests/test_gateway_*'
      - '.github/workflows/gateway-runtime-ci.yml'
  push:
    branches: [main]
    paths:
      - 'code/luma_experience_gateway*.py'
      - 'code/operator_api_access.py'
      - 'code/ops/VERIFY_GATEWAY_MINIMAL_RUNTIME.py'
      - 'requirements-gateway-minimal*'
      - 'tests/test_gateway_*'
      - '.github/workflows/gateway-runtime-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-lock:
    name: Native gateway lock / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.9'
      - name: Install hash-locked test tools
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-windows-paper-runner-py311.lock
      - name: Exercise actual POSIX or Windows lock implementation
        run: python -m pytest -q -rs tests/test_gateway_lifetime_lock.py --junitxml=out/gateway-runtime/native-lock.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: gateway-native-lock-${{ matrix.os }}-${{ github.sha }}
          path: out/gateway-runtime/native-lock.xml
          if-no-files-found: error

  minimal-serving:
    name: Minimal reviewer HTTP profile (HOLD)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.9'
      - name: Create clean isolated minimal serving environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/gateway-minimal"
          "$RUNNER_TEMP/gateway-minimal/bin/python" -m pip install --require-hashes --only-binary=:all: -r requirements-gateway-minimal-ubuntu-py311.lock
          "$RUNNER_TEMP/gateway-minimal/bin/python" -m pip check
      - name: Verify exact dependencies and loopback-only HTTP start and stop
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gateway-minimal/bin/python" code/ops/VERIFY_GATEWAY_MINIMAL_RUNTIME.py --smoke --output out/gateway-runtime/minimal-profile.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: gateway-minimal-profile-${{ github.sha }}
          path: out/gateway-runtime/minimal-profile.json
          if-no-files-found: error
