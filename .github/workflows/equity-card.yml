name: 📊 Generate Live Equity Card

on:
  # Survival mode: preserve the last committed card and permit deliberate manual refreshes only.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  survival-mode-notice:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Preserve existing public artifact
        run: |
          echo "Scheduled equity-card polling is paused in survival mode."
          echo "The last committed assets/equity_card.svg and data/equity_card_state.json remain preserved."
          echo "Restore a reviewed generator only when live execution is funded and public claims remain appropriate."
