name: Repository security assurance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/dependabot.yml'
      - '.github/workflows/codeql.yml'
      - '.github/workflows/dependency-review.yml'
      - '.github/workflows/repository-security-assurance.yml'
      - '.npmrc'
      - 'SECURITY.md'
      - 'code/ops/RUN_STACK_MODERNIZATION_SWEEP.ps1'
      - 'code/ops/VERIFY_REPOSITORY_SECURITY_ASSURANCE.py'
      - 'code/ops/VERIFY_PUBLIC_REPO_CREDENTIAL_HYGIENE.py'
      - 'config/repository_security_assurance_v1.json'
      - 'config/public_credential_remediation_status_v1.json'
      - 'docs/REPOSITORY_SECURITY_ASSURANCE.md'
      - 'dashboard/package.json'
      - 'dashboard/package-lock.json'
      - 'dashboard/.npmrc'
      - 'tests/test_repository_security_assurance.py'
      - 'tests/test_public_repo_credential_hygiene.py'
      - 'README.md'
      - 'EVIDENCE_INDEX.md'
      - 'docs/REVIEWER_START_HERE.md'
  push:
    branches: [main]
    paths:
      - '.github/dependabot.yml'
      - '.github/workflows/codeql.yml'
      - '.github/workflows/dependency-review.yml'
      - '.github/workflows/repository-security-assurance.yml'
      - '.npmrc'
      - 'SECURITY.md'
      - 'code/ops/RUN_STACK_MODERNIZATION_SWEEP.ps1'
      - 'code/ops/VERIFY_REPOSITORY_SECURITY_ASSURANCE.py'
      - 'code/ops/VERIFY_PUBLIC_REPO_CREDENTIAL_HYGIENE.py'
      - 'config/repository_security_assurance_v1.json'
      - 'config/public_credential_remediation_status_v1.json'
      - 'docs/REPOSITORY_SECURITY_ASSURANCE.md'
      - 'dashboard/package.json'
      - 'dashboard/package-lock.json'
      - 'dashboard/.npmrc'
      - 'tests/test_repository_security_assurance.py'
      - 'tests/test_public_repo_credential_hygiene.py'
      - 'README.md'
      - 'EVIDENCE_INDEX.md'
      - 'docs/REVIEWER_START_HERE.md'

permissions:
  contents: read

concurrency:
  group: repository-security-assurance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Set up exact dashboard Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Resolve and exercise the strict dashboard dependency graph
        working-directory: dashboard
        run: |
          set -euo pipefail
          npm ci --strict-peer-deps --legacy-peer-deps=false --force=false --ignore-scripts --no-audit --no-fund
          npm ls --all
          npm audit --omit=dev --audit-level=moderate
          node --input-type=module <<'NODE'
          const three = await import("three");
          const anime = await import("animejs");
          const postprocessing = await import("postprocessing");
          const adapter = await import("animejs/adapters/three");
          if (three.REVISION !== "185") throw new Error("unexpected Three.js revision");
          if (typeof anime.animate !== "function") throw new Error("Anime.js animate export missing");
          if (typeof postprocessing.EffectComposer !== "function") throw new Error("postprocessing export missing");
          if (typeof adapter.threeAdapter !== "object") throw new Error("Anime.js Three adapter missing");
          if (typeof adapter.commitChanges !== "function") throw new Error("Anime.js adapter commit hook missing");
          console.log(JSON.stringify({
            animejs: "4.5.0",
            three_revision: three.REVISION,
            anime_three_adapter: true,
            postprocessing: true,
          }));
          NODE

      - name: Compile verifier and adversarial tests
        run: |
          python -m py_compile code/ops/VERIFY_REPOSITORY_SECURITY_ASSURANCE.py
          python -m py_compile code/ops/VERIFY_PUBLIC_REPO_CREDENTIAL_HYGIENE.py
          python -m py_compile tests/test_repository_security_assurance.py
          python -m py_compile tests/test_public_repo_credential_hygiene.py

      - name: Verify bounded security controls
        run: |
          mkdir -p out/repository-security-assurance
          python code/ops/VERIFY_REPOSITORY_SECURITY_ASSURANCE.py \
            --json-out out/repository-security-assurance/receipt.json

      - name: Verify targeted credential history remains fail-closed
        run: python code/ops/VERIFY_PUBLIC_REPO_CREDENTIAL_HYGIENE.py --check

      - name: Run adversarial security-assurance tests
        run: python -m unittest discover -s tests -p 'test_repository_security_assurance.py' -v

      - name: Upload bounded security-assurance receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repository-security-assurance-${{ github.sha }}
          path: out/repository-security-assurance/receipt.json
          if-no-files-found: error
          retention-days: 30

      - name: Reject whitespace errors
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          git cat-file -e "${BASE_SHA}^{commit}"
          git diff --check "${BASE_SHA}...HEAD"
