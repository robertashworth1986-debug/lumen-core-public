name: Energy Stage 4 Delayed Feedback Router

on:
  push:
    branches: ["exp/energy-stage4-delayed-router-20260905"]
    paths:
      - "experiments/energy_multisource/stage4/**"
      - ".github/workflows/energy-stage4-delayed-router.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: energy-stage4-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - name: Checkout frozen candidate code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Install pinned numerical dependency
        run: python -m pip install --disable-pip-version-check numpy==2.3.5
      - name: Integrity tests before data acquisition
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/energy-stage4
          python -m py_compile experiments/energy_multisource/stage4/*.py
          python -m unittest discover -s experiments/energy_multisource/stage4 -p 'test_stage4.py' -v 2>&1 | tee out/energy-stage4/TESTS.txt
          python -m unittest discover -s experiments/energy_multisource/stage3 -p 'test_stage3.py' -v 2>&1 | tee out/energy-stage4/INHERITED_TESTS.txt
      - name: Acquire predeclared 2023 and 2025 observations
        run: python experiments/energy_multisource/stage4/acquire_stage4.py --out out/energy-stage4/sources
      - name: Run locked candidate comparisons and stress diagnostics
        run: python experiments/energy_multisource/stage4/run_stage4.py --sources out/energy-stage4/sources --out out/energy-stage4/results
      - name: Validate and bind execution evidence
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import datetime,hashlib,json,os,pathlib,platform
          root=pathlib.Path('out/energy-stage4'); root.mkdir(parents=True,exist_ok=True)
          summary=root/'results/summary.json'
          status='FAILED_NO_COMPLETE_RESULT'
          scored=0
          if summary.exists():
              s=json.loads(summary.read_text()); status=s['research_status']; scored=s['scored_comparisons']
          records=[]
          for p in sorted(root.rglob('*')):
              if p.is_file() and p.name!='RUN_RECEIPT.json':
                  records.append({'path':str(p.relative_to(root)),'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'bytes':p.stat().st_size})
          obj={'run_id':os.environ['GITHUB_RUN_ID'],'commit':os.environ['GITHUB_SHA'],'utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'python':platform.python_version(),'research_status':status,'comparisons_scored':scored,'files':records,'claim_boundary':'Offline internal research only; no independent validation, control or production authorization.'}
          (root/'RUN_RECEIPT.json').write_text(json.dumps(obj,indent=2)+'\n')
          PY
      - name: Preserve successful results and failure receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: energy-stage4-${{ github.sha }}
          path: out/energy-stage4/
          if-no-files-found: error
          retention-days: 30
