name: 🔄 Live Metrics Sync

on:
  schedule:
    # Survival mode: one preservation snapshot per UTC day.
    - cron: '29 12 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: read-only-live-metrics-sync
  cancel-in-progress: true

jobs:
  sync-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch daily metrics snapshot
        id: fetch
        shell: bash
        env:
          METRICS_ARTIFACT_DIR: ${{ runner.temp }}/lumencore-live-metrics
        run: |
          set -euo pipefail
          install -d -m 700 "$METRICS_ARTIFACT_DIR"

          fetch_object_or_null() {
            local url=$1
            local body
            if body=$(curl --fail --silent --show-error --location --max-redirs 5 --max-time 10 "$url" 2>/dev/null); then
              if jq -e 'type == "object"' >/dev/null 2>&1 <<<"$body"; then
                jq -cS . <<<"$body"
                return
              fi
            fi
            echo 'null'
          }

          gateway_health=$(fetch_object_or_null "https://lumen-core.ai/health")
          public_status=$(fetch_object_or_null "https://lumen-core.ai/api/public/status")

          site_code=$(curl --silent --show-error --location --max-redirs 5 --max-time 10 \
            --output /dev/null --write-out "%{http_code}" "https://lumen-core.ai/" 2>/dev/null) || site_code="000"
          [[ "$site_code" =~ ^[0-9]{3}$ ]] || site_code="000"

          snapshot_ts=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          jq -n \
            --arg snapshot_utc "$snapshot_ts" \
            --arg site_status "$site_code" \
            --argjson gateway_health "$gateway_health" \
            --argjson public_status "$public_status" \
            '{snapshot_utc:$snapshot_utc,site_status:$site_status,gateway_health:$gateway_health,public_status:$public_status}' \
            > "$METRICS_ARTIFACT_DIR/live_snapshot.json"

          status=$((10#$site_code))
          available_objects=$(jq '[.gateway_health, .public_status] | map(select(. != null)) | length' "$METRICS_ARTIFACT_DIR/live_snapshot.json")
          state=outage
          status_msg=unreachable
          status_color=red
          if [[ "$status" -ge 200 && "$status" -lt 300 ]]; then
            state=degraded
            status_msg="online · ${available_objects}/2 public gateway contracts"
            status_color=yellow
            if [[ "$available_objects" -eq 2 ]]; then
              state=operational
              status_color=brightgreen
            fi
          fi

          jq -n --arg message "$status_msg" --arg color "$status_color" \
            '{schemaVersion:1,label:"lumen-core.ai",message:$message,color:$color,cacheSeconds:3600}' \
            > "$METRICS_ARTIFACT_DIR/site_health_badge.json"

          jq empty "$METRICS_ARTIFACT_DIR/live_snapshot.json" "$METRICS_ARTIFACT_DIR/site_health_badge.json"
          echo "snapshot_ts=$snapshot_ts" >> "$GITHUB_OUTPUT"
          echo "site_code=$site_code" >> "$GITHUB_OUTPUT"
          echo "available_objects=$available_objects" >> "$GITHUB_OUTPUT"
          echo "state=$state" >> "$GITHUB_OUTPUT"

      - name: Publish explicit metrics verdict
        if: always()
        shell: bash
        env:
          METRICS_ARTIFACT_DIR: ${{ runner.temp }}/lumencore-live-metrics
        run: |
          set -euo pipefail
          if [[ -s "$METRICS_ARTIFACT_DIR/live_snapshot.json" ]]; then
            {
              echo "## Live metrics verdict: ${{ steps.fetch.outputs.state }}"
              echo "- Site HTTP status: \`${{ steps.fetch.outputs.site_code }}\`"
              echo "- Public gateway contracts available: \`${{ steps.fetch.outputs.available_objects }}/2\`"
              echo "- Snapshot UTC: \`${{ steps.fetch.outputs.snapshot_ts }}\`"
              echo "- Evidence: retained workflow artifact only; no repository commit or deployment occurred"
              echo ""
              echo "> A completed metrics capture is not evidence of a healthy deployment. The explicit verdict above controls."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Live metrics verdict: unknown"
              echo "- No valid metrics receipt was produced."
              echo "- No repository commit or deployment occurred."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload bounded metrics receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-metrics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/lumencore-live-metrics/live_snapshot.json
            ${{ runner.temp }}/lumencore-live-metrics/site_health_badge.json
          if-no-files-found: error
          retention-days: 14

      - name: Fail closed on non-operational verdict
        if: steps.fetch.outputs.state != 'operational'
        run: |
          echo "::error::lumen-core.ai metrics verdict is ${{ steps.fetch.outputs.state }} — HTTP ${{ steps.fetch.outputs.site_code }}, ${{ steps.fetch.outputs.available_objects }}/2 public gateway contracts available"
          exit 1
