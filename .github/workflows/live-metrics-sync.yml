name: 🔄 Live Metrics Sync

on:
  schedule:
    # Survival mode: one preservation snapshot per UTC day.
    - cron: '29 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scheduled-repository-writer
  cancel-in-progress: false

jobs:
  sync-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch daily metrics snapshot
        id: fetch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data

          fetch_object_or_null() {
            local url=$1
            local body
            if body=$(curl --fail --silent --show-error --location --max-redirs 5 --max-time 10 "$url" 2>/dev/null); then
              if jq -e 'type == "object"' >/dev/null 2>&1 <<<"$body"; then
                jq -cS . <<<"$body"
                return
              fi
            fi
            echo 'null'
          }

          live_status=$(fetch_object_or_null "https://lumen-core.ai/api/live_status.json")
          federal_brief=$(fetch_object_or_null "https://lumen-core.ai/api/federal_brief.json")
          evidence_summary=$(fetch_object_or_null "https://lumen-core.ai/api/evidence_summary.json")
          executor_heartbeat=$(fetch_object_or_null "https://lumen-core.ai/api/executor_heartbeat.json")

          site_code=$(curl --silent --show-error --location --max-redirs 5 --max-time 10 \
            --output /dev/null --write-out "%{http_code}" "https://lumen-core.ai/" 2>/dev/null) || site_code="000"
          [[ "$site_code" =~ ^[0-9]{3}$ ]] || site_code="000"

          snapshot_ts=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          jq -n \
            --arg snapshot_utc "$snapshot_ts" \
            --arg site_status "$site_code" \
            --argjson live_status "$live_status" \
            --argjson federal_brief "$federal_brief" \
            --argjson evidence_summary "$evidence_summary" \
            --argjson executor_heartbeat "$executor_heartbeat" \
            '{snapshot_utc:$snapshot_utc,site_status:$site_status,live_status:$live_status,federal_brief:$federal_brief,evidence_summary:$evidence_summary,executor_heartbeat:$executor_heartbeat}' \
            > data/live_snapshot.json

          status=$((10#$site_code))
          status_msg=unreachable
          status_color=red
          if [[ "$status" -ge 200 && "$status" -lt 300 ]]; then
            status_msg=online
            status_color=brightgreen
          fi

          jq -n --arg message "$status_msg" --arg color "$status_color" \
            '{schemaVersion:1,label:"lumen-core.ai",message:$message,color:$color,cacheSeconds:3600}' \
            > data/site_health_badge.json

          jq empty data/live_snapshot.json data/site_health_badge.json
          echo "snapshot_ts=$snapshot_ts" >> "$GITHUB_OUTPUT"

      - name: Commit daily metrics snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "lumencore-bot"
          git config user.email "bot@lumen-core.ai"
          git add data/live_snapshot.json data/site_health_badge.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(metrics): daily survival snapshot @ ${{ steps.fetch.outputs.snapshot_ts }}"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
