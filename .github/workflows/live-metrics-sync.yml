name: 🔄 Live Metrics Sync

on:
  schedule:
    # Survival mode: one preservation snapshot per UTC day.
    - cron: '29 12 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: read-only-live-metrics-sync
  cancel-in-progress: true

jobs:
  sync-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch daily metrics snapshot
        id: fetch
        shell: bash
        env:
          METRICS_ARTIFACT_DIR: ${{ runner.temp }}/lumencore-live-metrics
        run: |
          set -euo pipefail
          install -d -m 700 "$METRICS_ARTIFACT_DIR"

          python3 code/ops/capture_public_metrics.py --output-dir "$METRICS_ARTIFACT_DIR"

      - name: Publish explicit metrics verdict
        if: always()
        shell: bash
        env:
          METRICS_ARTIFACT_DIR: ${{ runner.temp }}/lumencore-live-metrics
        run: |
          set -euo pipefail
          if [[ -s "$METRICS_ARTIFACT_DIR/metrics_summary.md" ]]; then
            cat "$METRICS_ARTIFACT_DIR/metrics_summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Live metrics verdict: unknown"
              echo "- No valid metrics receipt was produced."
              echo "> A completed metrics capture is not evidence of a healthy deployment."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload bounded metrics receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-metrics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/lumencore-live-metrics/live_snapshot.json
            ${{ runner.temp }}/lumencore-live-metrics/site_health_badge.json
            ${{ runner.temp }}/lumencore-live-metrics/metrics_summary.md
          if-no-files-found: error
          retention-days: 14

      - name: Fail closed on non-operational verdict
        if: steps.fetch.outputs.state != 'operational'
        run: |
          echo "::error::lumen-core.ai metrics verdict is ${{ steps.fetch.outputs.state }} — HTTP ${{ steps.fetch.outputs.site_status }}, ${{ steps.fetch.outputs.available_objects }}/4 validated feeds available; minimal public gateway ${{ steps.fetch.outputs.public_gateway_state }}; see per-feed dispositions in artifact"
          exit 1
