name: EIA Prospective Hourly Router

on:
  push:
    paths:
      - ".github/workflows/eia-prospective-hourly-router.yml"
      - "requirements-reviewer-ubuntu-py311.lock"
      - "config/eia_grid_prospective_hourly_router_protocol_v1.json"
      - "code/eia_grid_prospective_hourly_router.py"
      - "code/ops/AUDIT_EIA_PROSPECTIVE_SOURCE_TIMING.py"
      - "code/ops/BUILD_EIA_GRID_HOURLY_REPRODUCTION_PACKET.py"
      - "code/ops/BUILD_EIA_HOURLY_RUNTIME_PROJECTION.py"
      - "code/ops/FREEZE_EIA_HOURLY_ROUTER_DESIGN.py"
      - "code/ops/RUN_EIA_GRID_HOURLY_OPERATOR_PORTABILITY_CHECK.py"
      - "code/ops/VERIFY_EIA_GRID_HOURLY_REPRODUCTION_PACKET.py"
      - "config/eia_grid_hourly_external_evaluator_protocol_template_v1.json"
      - "config/eia_grid_hourly_independent_reproduction_receipt_template*.json"
      - "evidence/external_validation/eia_grid_hourly_router_design_benchmark_20260714.json"
      - "evidence/external_validation/eia_grid_hourly_router_design_freeze_20260714.json"
      - "evidence/external_validation/eia_grid_hourly_independent_reproduction_handoff_*.json"
      - "evidence/external_validation/eia_grid_prospective_hourly_runtime_projection_*.json"
      - "evidence/external_validation/eia_prospective_source_timing_audit_20260714.json"
      - "evidence/reproducibility/eia_grid_hourly_operator_portability_receipt_*.json"
      - "docs/EIA_GRID_HOURLY_INDEPENDENT_REPRODUCTION_HANDOFF_*.md"
      - "tests/test_eia_hourly_runtime_projection.py"
      - "tests/test_eia_grid_hourly_independent_reproduction_packet.py"
      - "tests/test_eia_grid_hourly_operator_portability.py"
      - "tests/test_eia_grid_prospective_hourly_router.py"
      - "tests/test_eia_prospective_source_timing_audit.py"
      - "tools/Run-EiaProspectiveHourlyRouterCycle.ps1"
      - "tools/Register-EiaProspectiveHourlyRouterTask.ps1"
  pull_request:
    paths:
      - ".github/workflows/eia-prospective-hourly-router.yml"
      - "requirements-reviewer-ubuntu-py311.lock"
      - "config/eia_grid_prospective_hourly_router_protocol_v1.json"
      - "code/eia_grid_prospective_hourly_router.py"
      - "code/ops/AUDIT_EIA_PROSPECTIVE_SOURCE_TIMING.py"
      - "code/ops/BUILD_EIA_GRID_HOURLY_REPRODUCTION_PACKET.py"
      - "code/ops/BUILD_EIA_HOURLY_RUNTIME_PROJECTION.py"
      - "code/ops/FREEZE_EIA_HOURLY_ROUTER_DESIGN.py"
      - "code/ops/RUN_EIA_GRID_HOURLY_OPERATOR_PORTABILITY_CHECK.py"
      - "code/ops/VERIFY_EIA_GRID_HOURLY_REPRODUCTION_PACKET.py"
      - "config/eia_grid_hourly_external_evaluator_protocol_template_v1.json"
      - "config/eia_grid_hourly_independent_reproduction_receipt_template*.json"
      - "evidence/external_validation/eia_grid_hourly_router_design_benchmark_20260714.json"
      - "evidence/external_validation/eia_grid_hourly_router_design_freeze_20260714.json"
      - "evidence/external_validation/eia_grid_hourly_independent_reproduction_handoff_*.json"
      - "evidence/external_validation/eia_grid_prospective_hourly_runtime_projection_*.json"
      - "evidence/external_validation/eia_prospective_source_timing_audit_20260714.json"
      - "evidence/reproducibility/eia_grid_hourly_operator_portability_receipt_*.json"
      - "docs/EIA_GRID_HOURLY_INDEPENDENT_REPRODUCTION_HANDOFF_*.md"
      - "tests/test_eia_hourly_runtime_projection.py"
      - "tests/test_eia_grid_hourly_independent_reproduction_packet.py"
      - "tests/test_eia_grid_hourly_operator_portability.py"
      - "tests/test_eia_grid_prospective_hourly_router.py"
      - "tests/test_eia_prospective_source_timing_audit.py"
      - "tools/Run-EiaProspectiveHourlyRouterCycle.ps1"
      - "tools/Register-EiaProspectiveHourlyRouterTask.ps1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-hourly-protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up CPython 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: requirements-reviewer-ubuntu-py311.lock

      - name: Install hash-locked reviewer environment
        run: python -m pip install --require-hashes -r requirements-reviewer-ubuntu-py311.lock

      - name: Verify frozen design receipt
        run: python code/ops/FREEZE_EIA_HOURLY_ROUTER_DESIGN.py --check

      - name: Run leakage and chain-integrity tests
        run: >-
          python -m pytest -q
          tests/test_eia_hourly_runtime_projection.py
          tests/test_eia_grid_hourly_independent_reproduction_packet.py
          tests/test_eia_grid_hourly_operator_portability.py
          tests/test_eia_grid_prospective_hourly_router.py
          tests/test_eia_prospective_source_timing_audit.py

      - name: Compile operational modules
        run: >-
          python -m py_compile
          code/eia_grid_prospective_hourly_router.py
          code/ops/AUDIT_EIA_PROSPECTIVE_SOURCE_TIMING.py
          code/ops/BUILD_EIA_GRID_HOURLY_REPRODUCTION_PACKET.py
          code/ops/BUILD_EIA_HOURLY_RUNTIME_PROJECTION.py
          code/ops/FREEZE_EIA_HOURLY_ROUTER_DESIGN.py
          code/ops/RUN_EIA_GRID_HOURLY_OPERATOR_PORTABILITY_CHECK.py
          code/ops/VERIFY_EIA_GRID_HOURLY_REPRODUCTION_PACKET.py
