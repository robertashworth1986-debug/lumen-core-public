name: Paper Ticker Recovery Gate

on:
  pull_request:
    paths:
      - '.github/workflows/paper-ticker-recovery-ci.yml'
      - '.github/workflows/repair-paper-ticker-ledger.yml'
      - '.github/workflows/vps-storage-diagnostic.yml'
      - 'code/deploy/deploy_vps.sh'
      - 'code/ops/REPAIR_PAPER_TICKER_LEDGER_ON_VPS.sh'
      - 'docs/CANONICAL_OPERATING_STATE.md'
      - 'tests/test_paper_ticker_ledger_repair.py'
      - 'tests/test_vps_runtime_diagnostic_workflow.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/paper-ticker-recovery-ci.yml'
      - '.github/workflows/repair-paper-ticker-ledger.yml'
      - '.github/workflows/vps-storage-diagnostic.yml'
      - 'code/deploy/deploy_vps.sh'
      - 'code/ops/REPAIR_PAPER_TICKER_LEDGER_ON_VPS.sh'
      - 'docs/CANONICAL_OPERATING_STATE.md'
      - 'tests/test_paper_ticker_ledger_repair.py'
      - 'tests/test_vps_runtime_diagnostic_workflow.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install bounded test dependencies
        run: python -m pip install pytest==9.1.0 PyYAML==6.0.3
      - name: Validate repair shell syntax
        run: bash -n code/ops/REPAIR_PAPER_TICKER_LEDGER_ON_VPS.sh
      - name: Validate inspect-only and argument boundaries
        shell: bash
        run: |
          set -euo pipefail
          bash code/ops/REPAIR_PAPER_TICKER_LEDGER_ON_VPS.sh --help >/dev/null
          if bash code/ops/REPAIR_PAPER_TICKER_LEDGER_ON_VPS.sh --unknown >/dev/null 2>&1; then
            echo 'unknown argument unexpectedly succeeded' >&2
            exit 1
          fi
      - name: Run focused recovery and diagnostic controls
        run: >
          python -m pytest -q
          tests/test_paper_ticker_ledger_repair.py
          tests/test_vps_runtime_diagnostic_workflow.py
