name: Repository trust policy gate

on:
  pull_request:
    paths:
      - 'SECURITY.md'
      - 'CONTRIBUTING.md'
      - 'RESUME_LUMENCORE.md'
      - 'code/build_elite_resume_pdf.py'
      - 'code/email_resume_dispatcher.py'
      - 'code/lumalinkedin_resume_engine_v1.py'
      - 'code/ops/RUN_EMAIL_RESUME_DISPATCHER.ps1'
      - 'tests/test_repository_trust_policy.py'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'SECURITY.md'
      - 'CONTRIBUTING.md'
      - 'RESUME_LUMENCORE.md'
      - 'code/build_elite_resume_pdf.py'
      - 'code/email_resume_dispatcher.py'
      - 'code/lumalinkedin_resume_engine_v1.py'
      - 'code/ops/RUN_EMAIL_RESUME_DISPATCHER.ps1'
      - 'tests/test_repository_trust_policy.py'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: repository-trust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Verify bounded trust policies
        run: python -m unittest discover -s tests -p 'test_repository_trust_policy.py' -v

      - name: Reject whitespace errors
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          git cat-file -e "${BASE_SHA}^{commit}"
          git diff --check "${BASE_SHA}...HEAD"
