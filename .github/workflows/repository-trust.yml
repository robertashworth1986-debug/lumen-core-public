name: Repository trust policy gate

on:
  pull_request:
    paths:
      - 'SECURITY.md'
      - 'CONTRIBUTING.md'
      - 'RESUME_LUMENCORE.md'
      - 'code/build_elite_resume_pdf.py'
      - 'code/email_resume_dispatcher.py'
      - 'code/lumalinkedin_resume_engine_v1.py'
      - 'code/ops/RUN_EMAIL_RESUME_DISPATCHER.ps1'
      - 'tests/test_repository_trust_policy.py'
      - 'code/ops/VERIFY_CHANGED_WHITESPACE.py'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'SECURITY.md'
      - 'CONTRIBUTING.md'
      - 'RESUME_LUMENCORE.md'
      - 'code/build_elite_resume_pdf.py'
      - 'code/email_resume_dispatcher.py'
      - 'code/lumalinkedin_resume_engine_v1.py'
      - 'code/ops/RUN_EMAIL_RESUME_DISPATCHER.ps1'
      - 'tests/test_repository_trust_policy.py'
      - 'code/ops/VERIFY_CHANGED_WHITESPACE.py'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: repository-trust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Verify bounded trust policies
        run: python -m unittest discover -s tests -p 'test_repository_trust_policy.py' -v

      - name: Reject whitespace errors
        run: python code/ops/VERIFY_CHANGED_WHITESPACE.py
