name: Engine Portfolio Audit Gate

on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: engine-portfolio-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install bounded test dependency
        run: python -m pip install --disable-pip-version-check pytest==9.1.0
      - name: Compile audit builder and tests
        run: >-
          python -m py_compile
          code/ops/BUILD_LUMENCORE_ENGINE_PORTFOLIO_AUDIT.py
          tests/test_lumencore_engine_portfolio_audit.py
      - name: Verify generated audit and adversarial controls
        run: >-
          python -m pytest -q
          tests/test_lumencore_engine_portfolio_audit.py
      - name: Upload sealed portfolio receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-portfolio-audit-${{ github.sha }}
          path: dashboard/data/lumencore_engine_portfolio_audit.json
          if-no-files-found: error
          retention-days: 30
