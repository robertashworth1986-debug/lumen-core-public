name: Engine Portfolio Audit Gate

on:
  pull_request:
    paths:
      - ".github/workflows/engine-portfolio-audit.yml"
      - "code/ops/BUILD_LUMENCORE_ENGINE_PORTFOLIO_AUDIT.py"
      - "config/lumencore_engine_portfolio_v2.json"
      - "config/strategic_transaction_packet_v2.json"
      - "config/evidence_graph_v1.json"
      - "dashboard/data/lumencore_engine_portfolio_audit.json"
      - "docs/LUMENCORE_ENGINE_PORTFOLIO_AUDIT_2026-08-08.md"
      - "EVIDENCE_INDEX.md"
      - "docs/REVIEWER_START_HERE.md"
      - "docs/PR_CONSOLIDATION_MAP_2026-07-22.md"
      - "tests/test_lumencore_engine_portfolio_audit.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/engine-portfolio-audit.yml"
      - "code/ops/BUILD_LUMENCORE_ENGINE_PORTFOLIO_AUDIT.py"
      - "config/lumencore_engine_portfolio_v2.json"
      - "config/strategic_transaction_packet_v2.json"
      - "config/evidence_graph_v1.json"
      - "dashboard/data/lumencore_engine_portfolio_audit.json"
      - "docs/LUMENCORE_ENGINE_PORTFOLIO_AUDIT_2026-08-08.md"
      - "EVIDENCE_INDEX.md"
      - "docs/REVIEWER_START_HERE.md"
      - "docs/PR_CONSOLIDATION_MAP_2026-07-22.md"
      - "tests/test_lumencore_engine_portfolio_audit.py"

permissions:
  contents: read

concurrency:
  group: engine-portfolio-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install bounded test dependency
        run: python -m pip install --disable-pip-version-check pytest==9.1.0
      - name: Compile audit builder and tests
        run: >-
          python -m py_compile
          code/ops/BUILD_LUMENCORE_ENGINE_PORTFOLIO_AUDIT.py
          tests/test_lumencore_engine_portfolio_audit.py
      - name: Verify generated audit and adversarial controls
        run: >-
          python -m pytest -q
          tests/test_lumencore_engine_portfolio_audit.py
      - name: Upload sealed portfolio receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engine-portfolio-audit-${{ github.sha }}
          path: dashboard/data/lumencore_engine_portfolio_audit.json
          if-no-files-found: error
          retention-days: 30
