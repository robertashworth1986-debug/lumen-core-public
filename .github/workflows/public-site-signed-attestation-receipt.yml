name: Public site signed-attestation receipt

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/public-site-signed-attestation-receipt.yml'
      - 'code/deploy/package_public_site_release.py'
      - 'code/ops/VERIFY_PUBLIC_SITE_SIGNED_ATTESTATION_RECEIPT.py'
      - 'docs/PUBLIC_SITE_SIGNED_ATTESTATION_RECEIPT_2026-08-08.md'
      - 'evidence/public-site-supply-chain/5fff567c11bee65b5b1de5415d8b8935cd2dfab0/attestation-receipt.json'
      - 'tests/test_public_site_signed_attestation_receipt.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-site-signed-attestation-receipt.yml'
      - 'code/deploy/package_public_site_release.py'
      - 'code/ops/VERIFY_PUBLIC_SITE_SIGNED_ATTESTATION_RECEIPT.py'
      - 'docs/PUBLIC_SITE_SIGNED_ATTESTATION_RECEIPT_2026-08-08.md'
      - 'evidence/public-site-supply-chain/5fff567c11bee65b5b1de5415d8b8935cd2dfab0/attestation-receipt.json'
      - 'tests/test_public_site_signed_attestation_receipt.py'

permissions:
  contents: read

concurrency:
  group: public-site-signed-attestation-receipt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout complete Git evidence without retained credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Install pinned test runner
        run: python -m pip install --disable-pip-version-check pytest==9.1.0

      - name: Compile verifier and tests
        run: |
          python -m py_compile code/ops/VERIFY_PUBLIC_SITE_SIGNED_ATTESTATION_RECEIPT.py
          python -m py_compile tests/test_public_site_signed_attestation_receipt.py

      - name: Reconstruct signed subject and verify retained receipt
        run: |
          mkdir -p out/public-site-signed-attestation-receipt
          python code/ops/VERIFY_PUBLIC_SITE_SIGNED_ATTESTATION_RECEIPT.py \
            --json-out out/public-site-signed-attestation-receipt/verification.json

      - name: Run adversarial receipt tests
        run: python -m pytest tests/test_public_site_signed_attestation_receipt.py -q

      - name: Upload bounded verification receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-site-signed-attestation-receipt-${{ github.sha }}
          path: out/public-site-signed-attestation-receipt/verification.json
          if-no-files-found: error
          retention-days: 30

      - name: Reject whitespace errors
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null && [ "${BASE_SHA}" != "0000000000000000000000000000000000000000" ]; then
            git diff --check "${BASE_SHA}...HEAD"
          else
            git diff --check HEAD^ HEAD
          fi
