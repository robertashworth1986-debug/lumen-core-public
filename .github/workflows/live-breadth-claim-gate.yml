name: Live Breadth Claim Gate

on:
  pull_request:
    paths:
      - '.github/workflows/live-breadth-claim-gate.yml'
      - 'code/ops/BUILD_PUBLIC_LIVE_BREADTH_PROVENANCE_GATE.py'
      - 'code/ops/BUILD_PUBLIC_SUPPORT_READINESS_PACKET.py'
      - 'code/ops/BUILD_PUBLIC_VISIBILITY_PACKET.py'
      - 'code/ops/build_live_breadth_value_panel.py'
      - 'code/ops/build_public_live_breadth_manifest.py'
      - 'config/public_live_breadth_governance.example.json'
      - 'dashboard/data/live_breadth_provenance_gate.json'
      - 'dashboard/data/public_live_breadth_manifest.json'
      - 'dashboard/data/public_support_readiness_packet.json'
      - 'dashboard/data/public_visibility_packet.json'
      - 'docs/CURRENT_PROOF_PROMOTION_BACKLOG.md'
      - 'docs/EVTIT_LUMENCORE_BUILD_SCOPE.md'
      - 'docs/LIVE_BREADTH_PROVENANCE_GATE_CAPSULE_2026-06-21.md'
      - 'docs/LUMENCORE_CURRENT_PROOF_STATUS_2026-07-09.md'
      - 'docs/NEXT_ACTIONS_BOARD.md'
      - 'docs/PUBLIC_LIVE_BREADTH_MANIFEST_2026-08-08.md'
      - 'docs/PUBLIC_SUPPORT_AND_REVIEWER_READINESS_2026-06-20.md'
      - 'docs/PUBLIC_VISIBILITY_AND_SOURCE_AUTHORITY_2026-06-20.md'
      - 'tests/test_canonical_surface_design.py'
      - 'tests/test_live_breadth_claim_safety.py'
      - 'tests/test_public_live_breadth_manifest.py'
      - 'tests/test_public_live_breadth_provenance_gate.py'
      - 'tests/test_public_support_readiness_packet.py'
      - 'tests/test_public_visibility_packet.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-breadth-claim-gate.yml'
      - 'code/ops/BUILD_PUBLIC_LIVE_BREADTH_PROVENANCE_GATE.py'
      - 'code/ops/BUILD_PUBLIC_SUPPORT_READINESS_PACKET.py'
      - 'code/ops/BUILD_PUBLIC_VISIBILITY_PACKET.py'
      - 'code/ops/build_live_breadth_value_panel.py'
      - 'code/ops/build_public_live_breadth_manifest.py'
      - 'config/public_live_breadth_governance.example.json'
      - 'dashboard/data/live_breadth_provenance_gate.json'
      - 'dashboard/data/public_live_breadth_manifest.json'
      - 'dashboard/data/public_support_readiness_packet.json'
      - 'dashboard/data/public_visibility_packet.json'
      - 'docs/CURRENT_PROOF_PROMOTION_BACKLOG.md'
      - 'docs/EVTIT_LUMENCORE_BUILD_SCOPE.md'
      - 'docs/LIVE_BREADTH_PROVENANCE_GATE_CAPSULE_2026-06-21.md'
      - 'docs/LUMENCORE_CURRENT_PROOF_STATUS_2026-07-09.md'
      - 'docs/NEXT_ACTIONS_BOARD.md'
      - 'docs/PUBLIC_LIVE_BREADTH_MANIFEST_2026-08-08.md'
      - 'docs/PUBLIC_SUPPORT_AND_REVIEWER_READINESS_2026-06-20.md'
      - 'docs/PUBLIC_VISIBILITY_AND_SOURCE_AUTHORITY_2026-06-20.md'
      - 'tests/test_canonical_surface_design.py'
      - 'tests/test_live_breadth_claim_safety.py'
      - 'tests/test_public_live_breadth_manifest.py'
      - 'tests/test_public_live_breadth_provenance_gate.py'
      - 'tests/test_public_support_readiness_packet.py'
      - 'tests/test_public_visibility_packet.py'

permissions:
  contents: read

concurrency:
  group: live-breadth-claim-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  claim-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install bounded test dependency
        run: python -m pip install --disable-pip-version-check pytest==9.1.0
      - name: Verify live-breadth evidence and claim boundaries
        run: >-
          python -m pytest -q
          tests/test_public_live_breadth_provenance_gate.py
          tests/test_public_visibility_packet.py
          tests/test_public_support_readiness_packet.py
          tests/test_live_breadth_claim_safety.py
          tests/test_public_live_breadth_manifest.py
          tests/test_canonical_surface_design.py
