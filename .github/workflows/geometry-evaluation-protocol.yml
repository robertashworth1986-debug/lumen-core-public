name: Geometry Evaluation Protocol Gate

on:
  pull_request:
    paths:
      - "EVIDENCE_INDEX.md"
      - "config/geometry_evaluation_protocol_v1.json"
      - "code/ops/VERIFY_GEOMETRY_EVALUATION_PROTOCOL.py"
      - "docs/GEOMETRY_EVALUATION_PROTOCOL_V1.md"
      - "tests/test_geometry_evaluation_protocol.py"
      - ".github/workflows/geometry-evaluation-protocol.yml"
  push:
    branches: [main]
    paths:
      - "EVIDENCE_INDEX.md"
      - "config/geometry_evaluation_protocol_v1.json"
      - "code/ops/VERIFY_GEOMETRY_EVALUATION_PROTOCOL.py"
      - "docs/GEOMETRY_EVALUATION_PROTOCOL_V1.md"
      - "tests/test_geometry_evaluation_protocol.py"
      - ".github/workflows/geometry-evaluation-protocol.yml"

permissions:
  contents: read

concurrency:
  group: geometry-evaluation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Compile verifier and tests
        run: python -m py_compile code/ops/VERIFY_GEOMETRY_EVALUATION_PROTOCOL.py tests/test_geometry_evaluation_protocol.py
      - name: Verify protocol and public claim boundary
        run: |
          mkdir -p out/geometry-evaluation
          python code/ops/VERIFY_GEOMETRY_EVALUATION_PROTOCOL.py --json \
            | tee out/geometry-evaluation/geometry-evaluation-protocol-verification.json
          python -m json.tool out/geometry-evaluation/geometry-evaluation-protocol-verification.json >/dev/null
      - name: Run adversarial regression tests
        run: python -m unittest discover -s tests -p "test_geometry_evaluation_protocol.py" -v
      - name: Upload verification receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: geometry-evaluation-protocol-${{ github.sha }}
          path: out/geometry-evaluation/geometry-evaluation-protocol-verification.json
          if-no-files-found: error
          retention-days: 30
