name: Outreach Queue Template Coverage

on:
  pull_request:
    paths:
      - "code/ops/AUDIT_OUTREACH_QUEUE_TEMPLATE_COVERAGE.py"
      - "code/ops/BUILD_EMAIL_ACTION_RECONCILIATION.py"
      - "code/ops/BUILD_OUTREACH_FOLLOWUP_ACTION_QUEUE.py"
      - "code/ops/BUILD_OUTREACH_RESPONSE_TEMPLATE_REGISTRY.py"
      - "config/outreach_followup_policies_v1.json"
      - "config/outreach_response_templates_v1.json"
      - "grant_submissions/funding_sprint_20260709/EMAIL_ACTION_RECONCILIATION_2026-07-18.json"
      - "grant_submissions/funding_sprint_20260709/OUTREACH_FOLLOWUP_ACTION_QUEUE_2026-07-18.json"
      - "grant_submissions/funding_sprint_20260709/OUTREACH_FOLLOWUP_SEND_LEDGER_2026-07-18.json"
      - "grant_submissions/funding_sprint_20260709/OUTREACH_RESPONSE_TEMPLATE_REGISTRY_2026-07-18.json"
      - "tests/test_email_action_reconciliation.py"
      - "tests/test_outreach_followup_action_queue.py"
      - "tests/test_outreach_queue_template_coverage.py"
      - "tests/test_outreach_response_template_registry.py"
      - ".github/workflows/outreach-queue-template-coverage.yml"
  push:
    branches: [main]
    paths:
      - "code/ops/AUDIT_OUTREACH_QUEUE_TEMPLATE_COVERAGE.py"
      - "code/ops/BUILD_EMAIL_ACTION_RECONCILIATION.py"
      - "code/ops/BUILD_OUTREACH_FOLLOWUP_ACTION_QUEUE.py"
      - "code/ops/BUILD_OUTREACH_RESPONSE_TEMPLATE_REGISTRY.py"
      - "config/outreach_followup_policies_v1.json"
      - "config/outreach_response_templates_v1.json"
      - "grant_submissions/funding_sprint_20260709/EMAIL_ACTION_RECONCILIATION_2026-07-18.json"
      - "grant_submissions/funding_sprint_20260709/OUTREACH_FOLLOWUP_ACTION_QUEUE_2026-07-18.json"
      - "grant_submissions/funding_sprint_20260709/OUTREACH_FOLLOWUP_SEND_LEDGER_2026-07-18.json"
      - "grant_submissions/funding_sprint_20260709/OUTREACH_RESPONSE_TEMPLATE_REGISTRY_2026-07-18.json"
      - "tests/test_email_action_reconciliation.py"
      - "tests/test_outreach_followup_action_queue.py"
      - "tests/test_outreach_queue_template_coverage.py"
      - "tests/test_outreach_response_template_registry.py"
      - ".github/workflows/outreach-queue-template-coverage.yml"

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: >-
          python -m pip install
          --disable-pip-version-check
          pytest==9.1.0
      - name: Compile queue coverage controls
        run: >-
          python -m py_compile
          code/ops/AUDIT_OUTREACH_QUEUE_TEMPLATE_COVERAGE.py
          code/ops/BUILD_EMAIL_ACTION_RECONCILIATION.py
          code/ops/BUILD_OUTREACH_FOLLOWUP_ACTION_QUEUE.py
          code/ops/BUILD_OUTREACH_RESPONSE_TEMPLATE_REGISTRY.py
          tests/test_email_action_reconciliation.py
          tests/test_outreach_followup_action_queue.py
          tests/test_outreach_queue_template_coverage.py
          tests/test_outreach_response_template_registry.py
      - name: Audit committed queue template coverage
        run: >-
          python
          code/ops/AUDIT_OUTREACH_QUEUE_TEMPLATE_COVERAGE.py
          --check
      - name: Run queue and coverage tests
        run: >-
          python -m pytest
          tests/test_email_action_reconciliation.py
          tests/test_outreach_followup_action_queue.py
          tests/test_outreach_queue_template_coverage.py
          tests/test_outreach_response_template_registry.py
          -q
