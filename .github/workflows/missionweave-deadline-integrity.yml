name: MissionWeave deadline integrity

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".gitattributes"
      - ".gitignore"
      - ".github/workflows/missionweave-deadline-integrity.yml"
      - "code/ops/BUILD_EMAIL_ACTION_RECONCILIATION.py"
      - "code/ops/FINALIZE_MISSIONWEAVE_DSIP_VOLUME2_PRIVATE.py"
      - "code/ops/BUILD_MISSIONWEAVE_DSIP_ACTION_GATE.py"
      - "code/ops/BUILD_MISSIONWEAVE_FOUNDER_FINISH_CARD.py"
      - "code/ops/BUILD_OUTREACH_FOLLOWUP_ACTION_QUEUE.py"
      - "config/outreach_followup_policies_v1.json"
      - "grant_submissions/DLA26BZ03_NV011_MissionWeave/MISSIONWEAVE_DSIP_ACTION_GATE_2026-07-17.json"
      - "grant_submissions/DLA26BZ03_NV011_MissionWeave/MISSIONWEAVE_DSIP_ACTION_GATE_2026-07-17.md"
      - "grant_submissions/DLA26BZ03_NV011_MissionWeave/MISSIONWEAVE_FOUNDER_FINISH_CARD_2026-07-21.json"
      - "grant_submissions/DLA26BZ03_NV011_MissionWeave/MISSIONWEAVE_FOUNDER_FINISH_CARD_2026-07-21.md"
      - "grant_submissions/NASHVILLE_EC_FALL_2026/NASHVILLE_EC_FINANCIAL_AID_SUBMISSION_RECEIPT_2026-07-21.json"
      - "grant_submissions/funding_sprint_20260709/EMAIL_ACTION_RECONCILIATION_2026-07-18.json"
      - "grant_submissions/funding_sprint_20260709/NASHVILLE_VLPA_PATENT_REFERRAL_RECEIPT_2026-07-21.json"
      - "grant_submissions/funding_sprint_20260709/USPTO_PRO_SE_ACCESS_GUIDANCE_RECEIPT_2026-07-21.json"
      - "grant_submissions/funding_sprint_20260709/OUTREACH_FOLLOWUP_ACTION_QUEUE_2026-07-18.json"
      - "grant_submissions/funding_sprint_20260709/OUTREACH_FOLLOWUP_ACTION_QUEUE_2026-07-18.md"
      - "tests/test_email_action_reconciliation.py"
      - "tests/test_missionweave_dsip_action_gate.py"
      - "tests/test_missionweave_founder_finish_card.py"
      - "tests/test_outreach_followup_action_queue.py"
  push:
    paths:
      - ".gitattributes"
      - ".gitignore"
      - ".github/workflows/missionweave-deadline-integrity.yml"
      - "code/ops/BUILD_EMAIL_ACTION_RECONCILIATION.py"
      - "code/ops/FINALIZE_MISSIONWEAVE_DSIP_VOLUME2_PRIVATE.py"
      - "code/ops/BUILD_MISSIONWEAVE_DSIP_ACTION_GATE.py"
      - "code/ops/BUILD_MISSIONWEAVE_FOUNDER_FINISH_CARD.py"
      - "code/ops/BUILD_OUTREACH_FOLLOWUP_ACTION_QUEUE.py"
      - "config/outreach_followup_policies_v1.json"
      - "grant_submissions/DLA26BZ03_NV011_MissionWeave/MISSIONWEAVE_DSIP_ACTION_GATE_2026-07-17.json"
      - "grant_submissions/DLA26BZ03_NV011_MissionWeave/MISSIONWEAVE_DSIP_ACTION_GATE_2026-07-17.md"
      - "grant_submissions/DLA26BZ03_NV011_MissionWeave/MISSIONWEAVE_FOUNDER_FINISH_CARD_2026-07-21.json"
      - "grant_submissions/DLA26BZ03_NV011_MissionWeave/MISSIONWEAVE_FOUNDER_FINISH_CARD_2026-07-21.md"
      - "grant_submissions/NASHVILLE_EC_FALL_2026/NASHVILLE_EC_FINANCIAL_AID_SUBMISSION_RECEIPT_2026-07-21.json"
      - "grant_submissions/funding_sprint_20260709/EMAIL_ACTION_RECONCILIATION_2026-07-18.json"
      - "grant_submissions/funding_sprint_20260709/NASHVILLE_VLPA_PATENT_REFERRAL_RECEIPT_2026-07-21.json"
      - "grant_submissions/funding_sprint_20260709/USPTO_PRO_SE_ACCESS_GUIDANCE_RECEIPT_2026-07-21.json"
      - "grant_submissions/funding_sprint_20260709/OUTREACH_FOLLOWUP_ACTION_QUEUE_2026-07-18.json"
      - "grant_submissions/funding_sprint_20260709/OUTREACH_FOLLOWUP_ACTION_QUEUE_2026-07-18.md"
      - "tests/test_email_action_reconciliation.py"
      - "tests/test_missionweave_dsip_action_gate.py"
      - "tests/test_missionweave_founder_finish_card.py"
      - "tests/test_outreach_followup_action_queue.py"

permissions:
  contents: read

concurrency:
  group: missionweave-deadline-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-public-deadline-controls:
    name: Verify public gate and no-send controls
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONHASHSEED: "0"
      TZ: UTC

    steps:
      - name: Check out the reviewed source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install the pinned Python runtime
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.9"

      - name: Install the bounded test runner
        run: python -m pip install --disable-pip-version-check pytest==9.1.0

      - name: Install the PDF inspection tool
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes poppler-utils

      - name: Compile the deadline control builders
        run: |
          python -m py_compile \
            code/ops/BUILD_EMAIL_ACTION_RECONCILIATION.py \
            code/ops/FINALIZE_MISSIONWEAVE_DSIP_VOLUME2_PRIVATE.py \
            code/ops/BUILD_MISSIONWEAVE_DSIP_ACTION_GATE.py \
            code/ops/BUILD_MISSIONWEAVE_FOUNDER_FINISH_CARD.py \
            code/ops/BUILD_OUTREACH_FOLLOWUP_ACTION_QUEUE.py

      - name: Verify deterministic public receipts and no-send controls
        run: |
          python -m pytest -q \
            tests/test_email_action_reconciliation.py \
            tests/test_missionweave_dsip_action_gate.py \
            tests/test_missionweave_founder_finish_card.py \
            tests/test_outreach_followup_action_queue.py

      - name: Confirm verification did not rewrite tracked evidence
        run: git diff --exit-code
