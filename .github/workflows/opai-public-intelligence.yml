name: OPAI Public Intelligence

on:
  workflow_dispatch:
  schedule:
    - cron: "17 12 * * 1"
  pull_request:
    branches: [main]
    paths:
      - "code/ops/BUILD_OPAI_PUBLIC_INTELLIGENCE.py"
      - "tests/test_opai_public_intelligence.py"
      - "docs/OPAI_PUBLIC_INTELLIGENCE_ENGINE.md"
      - ".github/workflows/opai-public-intelligence.yml"

permissions:
  contents: read

concurrency:
  group: opai-public-intelligence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate bounded collector
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest

      - name: Compile collector
        run: python -m py_compile code/ops/BUILD_OPAI_PUBLIC_INTELLIGENCE.py

      - name: Run focused tests
        run: python -m pytest -q tests/test_opai_public_intelligence.py

  snapshot:
    name: Build public consortium snapshot
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Crawl public allow-listed pages
        run: >-
          python code/ops/BUILD_OPAI_PUBLIC_INTELLIGENCE.py
          --max-pages 40
          --delay-seconds 1.25
          --output out/opai/opai_public_intelligence.json

      - name: Write bounded run summary
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          payload = json.loads(
              Path("out/opai/opai_public_intelligence.json").read_text(encoding="utf-8")
          )
          print("# OPAI Public Intelligence Snapshot")
          print()
          print(f"- Pages: {len(payload['pages'])}")
          print(f"- Organizations: {len(payload['organizations'])}")
          print(f"- Work groups: {len(payload['work_groups'])}")
          print(f"- Events: {len(payload['events'])}")
          print(f"- Models: {len(payload['models'])}")
          print(f"- Datasets: {len(payload['datasets'])}")
          print(f"- Documents: {len(payload['documents'])}")
          print(f"- Errors retained: {len(payload['errors'])}")
          print(f"- Manifest SHA-256: `{payload['manifest_sha256']}`")
          print()
          print(payload["source"]["boundary"])
          PY

      - name: Upload immutable snapshot artifact
        uses: actions/upload-artifact@v7
        with:
          name: opai-public-intelligence-${{ github.run_id }}
          path: out/opai/opai_public_intelligence.json
          if-no-files-found: error
          retention-days: 30
