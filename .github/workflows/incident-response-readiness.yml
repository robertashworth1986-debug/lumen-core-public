name: Incident response and continuity readiness

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/deploy.yml'
      - '.github/workflows/incident-response-readiness.yml'
      - 'code/ops/CLASSIFY_PUBLIC_RELEASE_INCIDENT.py'
      - 'code/ops/VERIFY_INCIDENT_RESPONSE_AND_CONTINUITY.py'
      - 'config/incident_response_and_continuity_v1.json'
      - 'config/institutional_readiness_register_v1.json'
      - 'docs/INCIDENT_RESPONSE_AND_CONTINUITY_PLAN.md'
      - 'docs/INSTITUTIONAL_READINESS_DOSSIER.md'
      - 'tests/test_public_release_incident_classifier.py'
      - 'tests/test_incident_response_and_continuity.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy.yml'
      - '.github/workflows/incident-response-readiness.yml'
      - 'code/ops/CLASSIFY_PUBLIC_RELEASE_INCIDENT.py'
      - 'code/ops/VERIFY_INCIDENT_RESPONSE_AND_CONTINUITY.py'
      - 'config/incident_response_and_continuity_v1.json'
      - 'config/institutional_readiness_register_v1.json'
      - 'docs/INCIDENT_RESPONSE_AND_CONTINUITY_PLAN.md'
      - 'docs/INSTITUTIONAL_READINESS_DOSSIER.md'
      - 'tests/test_public_release_incident_classifier.py'
      - 'tests/test_incident_response_and_continuity.py'

permissions:
  contents: read

concurrency:
  group: incident-response-readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout without retained credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Compile bounded controls and tests
        run: |
          python -m py_compile code/ops/CLASSIFY_PUBLIC_RELEASE_INCIDENT.py
          python -m py_compile code/ops/VERIFY_INCIDENT_RESPONSE_AND_CONTINUITY.py
          python -m py_compile tests/test_public_release_incident_classifier.py
          python -m py_compile tests/test_incident_response_and_continuity.py

      - name: Verify policy binding and deterministic tabletop
        run: |
          mkdir -p out/incident-response-readiness
          python code/ops/VERIFY_INCIDENT_RESPONSE_AND_CONTINUITY.py \
            --verified-utc 2026-08-08T00:00:00Z \
            --json-out out/incident-response-readiness/receipt.json

      - name: Run adversarial incident-classifier tests
        run: |
          python -m unittest discover -s tests -p 'test_public_release_incident_classifier.py' -v
          python -m unittest discover -s tests -p 'test_incident_response_and_continuity.py' -v

      - name: Upload bounded readiness receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: incident-response-readiness-${{ github.sha }}
          path: out/incident-response-readiness/receipt.json
          if-no-files-found: error
          retention-days: 30

      - name: Reject whitespace errors
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          git cat-file -e "${BASE_SHA}^{commit}"
          git diff --check "${BASE_SHA}...HEAD"
