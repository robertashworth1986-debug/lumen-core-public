name: Agent Arena V5 Gate

on:
  push:
    branches: [main]
    paths:
      - "code/agent_arena.py"
      - "config/agent_arena_v5.json"
      - "tests/test_agent_arena.py"
      - "docs/AGENT_ARENA.md"
      - ".github/workflows/agent-arena.yml"
  pull_request:
    paths:
      - "code/agent_arena.py"
      - "config/agent_arena_v5.json"
      - "tests/test_agent_arena.py"
      - "docs/AGENT_ARENA.md"
      - ".github/workflows/agent-arena.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-arena-v5:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Compile
        run: python -m py_compile code/agent_arena.py tests/test_agent_arena.py
      - name: Unit, leakage, adversarial, custody, and tamper tests
        run: python -m unittest -v tests.test_agent_arena
      - name: Generate locked V5 evidence bundle
        run: python code/agent_arena.py run --config config/agent_arena_v5.json --out /tmp/agent-arena-v5
      - name: Verify locked V5 evidence bundle
        run: python code/agent_arena.py verify --out /tmp/agent-arena-v5
      - name: Retain the locked evidence bundle
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-arena-v5-${{ github.sha }}
          path: /tmp/agent-arena-v5
          if-no-files-found: error
