name: Institutional assurance crosswalk

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/institutional-assurance-crosswalk.yml'
      - 'code/ops/VERIFY_INSTITUTIONAL_ASSURANCE_CROSSWALK.py'
      - 'config/institutional_assurance_crosswalk_v1.json'
      - 'docs/INSTITUTIONAL_ASSURANCE_CROSSWALK.md'
      - 'tests/test_institutional_assurance_crosswalk.py'
      - 'README.md'
      - 'EVIDENCE_INDEX.md'
      - 'docs/REVIEWER_START_HERE.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/institutional-assurance-crosswalk.yml'
      - 'code/ops/VERIFY_INSTITUTIONAL_ASSURANCE_CROSSWALK.py'
      - 'config/institutional_assurance_crosswalk_v1.json'
      - 'docs/INSTITUTIONAL_ASSURANCE_CROSSWALK.md'
      - 'tests/test_institutional_assurance_crosswalk.py'
      - 'README.md'
      - 'EVIDENCE_INDEX.md'
      - 'docs/REVIEWER_START_HERE.md'

permissions:
  contents: read

concurrency:
  group: institutional-assurance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout without retained credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Compile assurance verifier and tests
        run: |
          python -m py_compile code/ops/VERIFY_INSTITUTIONAL_ASSURANCE_CROSSWALK.py
          python -m py_compile tests/test_institutional_assurance_crosswalk.py

      - name: Verify current bounded crosswalk
        run: |
          mkdir -p out/institutional-assurance-crosswalk
          python code/ops/VERIFY_INSTITUTIONAL_ASSURANCE_CROSSWALK.py \
            --verified-utc 2026-08-08T00:00:00Z \
            --json-out out/institutional-assurance-crosswalk/receipt.json

      - name: Run adversarial crosswalk tests
        run: python -m unittest discover -s tests -p 'test_institutional_assurance_crosswalk.py' -v

      - name: Upload bounded crosswalk receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: institutional-assurance-crosswalk-${{ github.sha }}
          path: out/institutional-assurance-crosswalk/receipt.json
          if-no-files-found: error
          retention-days: 30

      - name: Reject whitespace errors
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          git cat-file -e "${BASE_SHA}^{commit}"
          git diff --check "${BASE_SHA}...HEAD"
