name: LumaScout Secret Controls

on:
  pull_request:
    paths:
      - 'LamaScout/config/api_registry.yaml'
      - 'LamaScout/src/credential_config.py'
      - 'LamaScout/src/settings.py'
      - 'LamaScout/src/audit.py'
      - 'LamaScout/.env.example'
      - 'LamaScout/.gitignore'
      - 'tests/test_lamascout_secret_controls.py'
      - '.github/workflows/lamascout-secret-controls.yml'
  push:
    branches: [main]
    paths:
      - 'LamaScout/config/api_registry.yaml'
      - 'LamaScout/src/credential_config.py'
      - 'LamaScout/src/settings.py'
      - 'LamaScout/src/audit.py'
      - 'LamaScout/.env.example'
      - 'LamaScout/.gitignore'
      - 'tests/test_lamascout_secret_controls.py'
      - '.github/workflows/lamascout-secret-controls.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-tracked-registry-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Compile and run secret-control tests
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            LamaScout/src/credential_config.py \
            tests/test_lamascout_secret_controls.py
          python - <<'PY'
          import runpy

          namespace = runpy.run_path("tests/test_lamascout_secret_controls.py")
          tests = sorted(
              (name, value)
              for name, value in namespace.items()
              if name.startswith("test_") and callable(value)
          )
          if not tests:
              raise SystemExit("no secret-control tests discovered")
          for name, test in tests:
              test()
              print(f"PASS {name}")
          print(f"PASS_COUNT={len(tests)}")
          PY
