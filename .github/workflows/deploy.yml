name: Deploy bounded LumenCore site to VPS

on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**/*.html'
      - 'assets/**'
      - 'data/*.json'
      - '*.html'
      - 'code/ops/repair_evidence_route.py'
      - 'code/ops/REPAIR_EVIDENCE_ROUTE_ON_VPS.sh'
      - 'code/deploy/nginx/lumatrader.conf'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: lumencore-production-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Mark production deployment pending
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/deploy-status.json
          import json, os
          print(json.dumps({
              "state": "pending",
              "target_url": os.environ["TARGET_URL"],
              "description": "Bounded VPS deployment is running",
              "context": "production/lumencore-vps",
          }))
          PY
          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA" \
            --data-binary @/tmp/deploy-status.json

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.VPS_KNOWN_HOSTS }}

      - name: Preflight VPS and prepare directories
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=no "opc@${{ secrets.VPS_HOST }}" '
            set -euo pipefail
            command -v sudo
            command -v rsync
            command -v python3
            command -v nginx
            command -v systemctl
            sudo -n true
            sudo journalctl --vacuum-size=100M >/dev/null 2>&1 || true
            sudo dnf clean all >/dev/null 2>&1 || true
            sudo yum clean all >/dev/null 2>&1 || true
            sudo find /var/log -type f \( -name "*.gz" -o -name "*.old" -o -name "*.1" -o -name "*.log.*" \) -delete 2>/dev/null || true
            sudo install -d -o opc -g opc -m 755 \
              /opt/lumencore/dashboard \
              /opt/lumencore/dashboard/data \
              /opt/lumencore/data \
              /tmp/lumencore-evidence-route
            touch /tmp/lumencore-evidence-route/.write-test
            rm -f /tmp/lumencore-evidence-route/.write-test
            echo "Active nginx candidates:"
            for candidate in \
              /etc/nginx/sites-enabled/lumatrader \
              /etc/nginx/sites-available/lumatrader \
              /etc/nginx/conf.d/lumatrader.conf; do
              if [ -e "$candidate" ] || [ -L "$candidate" ]; then
                printf "  %s -> %s\n" "$candidate" "$(readlink -f "$candidate" 2>/dev/null || printf unknown)"
              fi
            done
            df -h /opt/lumencore
          '

      - name: Sync dashboard assets
        shell: bash
        run: |
          set -euo pipefail
          rsync -rlvz --delete --inplace --size-only --no-perms --omit-dir-times \
            --rsync-path="sudo -n rsync" \
            --exclude='*.py' \
            --exclude='*.ps1' \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='data/' \
            --exclude='assets/vendor/three.min.js' \
            -e "ssh -o StrictHostKeyChecking=no" \
            dashboard/ \
            "opc@${{ secrets.VPS_HOST }}:/opt/lumencore/dashboard/"

      - name: Sync data snapshots
        shell: bash
        run: |
          set -euo pipefail
          rsync -rlvz --inplace --size-only --no-perms --omit-dir-times \
            --rsync-path="sudo -n rsync" \
            -e "ssh -o StrictHostKeyChecking=no" \
            data/ \
            "opc@${{ secrets.VPS_HOST }}:/opt/lumencore/data/"

          rsync -rlvz --delete --inplace --size-only --no-perms --omit-dir-times \
            --rsync-path="sudo -n rsync" \
            -e "ssh -o StrictHostKeyChecking=no" \
            data/ \
            "opc@${{ secrets.VPS_HOST }}:/opt/lumencore/dashboard/data/"

      - name: Upload bounded repair tools
        shell: bash
        run: |
          set -euo pipefail
          rsync -rlvz --inplace --no-perms --omit-dir-times \
            -e "ssh -o StrictHostKeyChecking=no" \
            code/ops/repair_evidence_route.py \
            code/ops/REPAIR_EVIDENCE_ROUTE_ON_VPS.sh \
            "opc@${{ secrets.VPS_HOST }}:/tmp/lumencore-evidence-route/"

      - name: Apply bounded evidence route repair
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=no "opc@${{ secrets.VPS_HOST }}" \
            "sudo -n bash /tmp/lumencore-evidence-route/REPAIR_EVIDENCE_ROUTE_ON_VPS.sh --apply"

      - name: Smoke test canonical production surfaces
        shell: bash
        run: |
          set -euo pipefail
          tmp_root="$(mktemp)"
          tmp_evidence="$(mktemp)"
          tmp_data="$(mktemp)"
          trap 'rm -f "$tmp_root" "$tmp_evidence" "$tmp_data"' EXIT

          status() {
            local url="$1"
            local output="$2"
            curl -sS --max-time 15 -o "$output" -w '%{http_code}' "$url" || true
          }

          ROOT="$(status "https://lumen-core.ai/?deploy=${GITHUB_SHA}" "$tmp_root")"
          EVIDENCE="$(status "https://lumen-core.ai/evidence/?deploy=${GITHUB_SHA}" "$tmp_evidence")"
          DATA="$(status "https://lumen-core.ai/data/site_health.json?deploy=${GITHUB_SHA}" "$tmp_data")"

          echo "Root: ${ROOT:-000} | Evidence: ${EVIDENCE:-000} | Site health data: ${DATA:-000}"

          [[ "$ROOT" == "200" ]]
          [[ "$EVIDENCE" == "200" ]]
          [[ "$DATA" == "200" ]]
          grep -Fq 'One proof path. One bounded decision.' "$tmp_root"
          grep -Fq 'name="lumencore-surface" content="proof-to-pilot-evidence-v1"' "$tmp_evidence"
          python3 -m json.tool "$tmp_data" >/dev/null

          echo "Production root, bounded evidence page, and health JSON are live."

      - name: Publish production deployment receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          case "$JOB_STATUS" in
            success)
              STATE=success
              DESCRIPTION="Bounded VPS deployment passed all smoke tests"
              ;;
            cancelled)
              STATE=error
              DESCRIPTION="Bounded VPS deployment was cancelled"
              ;;
            *)
              STATE=failure
              DESCRIPTION="Bounded VPS deployment failed or rolled back"
              ;;
          esac
          export STATE DESCRIPTION
          python3 - <<'PY' > /tmp/deploy-status.json
          import json, os
          print(json.dumps({
              "state": os.environ["STATE"],
              "target_url": os.environ["TARGET_URL"],
              "description": os.environ["DESCRIPTION"],
              "context": "production/lumencore-vps",
          }))
          PY
          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA" \
            --data-binary @/tmp/deploy-status.json
