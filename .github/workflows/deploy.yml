name: Deploy bounded LumenCore site to VPS

on:
  workflow_dispatch:
    inputs:
      human_unlock:
        description: Type DEPLOY_BOUNDED_LUMENCORE_TO_PRODUCTION
        required: true
        type: string
      deploy_site:
        description: Sync dashboard and data content
        required: false
        type: boolean
        default: false
      deploy_gateway:
        description: Install the bounded gateway dependency
        required: false
        type: boolean
        default: false
      deploy_evidence:
        description: Apply the bounded evidence route repair
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  statuses: write

concurrency:
  group: lumencore-production-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Mark production deployment pending
        if: inputs.human_unlock == 'DEPLOY_BOUNDED_LUMENCORE_TO_PRODUCTION'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/deploy-status.json
          import json, os
          print(json.dumps({
              "state": "pending",
              "target_url": os.environ["TARGET_URL"],
              "description": "Bounded VPS deployment is running",
              "context": "production/lumencore-vps",
          }))
          PY
          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA" \
            --data-binary @/tmp/deploy-status.json

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Classify bounded deployment scope
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          MANUAL_SITE: ${{ inputs.deploy_site }}
          MANUAL_GATEWAY: ${{ inputs.deploy_gateway }}
          MANUAL_EVIDENCE: ${{ inputs.deploy_evidence }}
        run: |
          set -euo pipefail
          receipt=/tmp/lumencore-deployment-scope.json

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            args=(--mode manual)
            [[ "${MANUAL_SITE,,}" == "true" ]] && args+=(--manual-scope site)
            [[ "${MANUAL_GATEWAY,,}" == "true" ]] && args+=(--manual-scope gateway)
            [[ "${MANUAL_EVIDENCE,,}" == "true" ]] && args+=(--manual-scope evidence)
          else
            changed=/tmp/lumencore-deployment-changed-paths.txt
            if [[ "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]] \
              && [[ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
              if ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
                git fetch --no-tags --depth=1 origin "$BEFORE_SHA"
              fi
              git diff --name-only --diff-filter=ACDMRT "$BEFORE_SHA" "$CURRENT_SHA" \
                | LC_ALL=C sort -u > "$changed"
            else
              git show --format= --name-only "$CURRENT_SHA" \
                | LC_ALL=C sort -u > "$changed"
            fi
            args=(--mode push --changed-path-file "$changed")
          fi

          python3 code/ops/classify_bounded_deployment_scope.py \
            "${args[@]}" \
            --output "$receipt" \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload deployment scope receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-scope-${{ github.run_id }}
          path: /tmp/lumencore-deployment-scope.json
          if-no-files-found: warn
          retention-days: 30

      - name: Require exact production HumanUnlock
        if: steps.scope.outputs.mutation_requested == 'true'
        shell: bash
        env:
          HUMAN_UNLOCK: ${{ inputs.human_unlock }}
        run: |
          set -euo pipefail
          [[ "$HUMAN_UNLOCK" == "DEPLOY_BOUNDED_LUMENCORE_TO_PRODUCTION" ]]

      - name: Verify gateway runtime dependency closure
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            code/booth_public_contract.py \
            code/luma_experience_gateway.py \
            code/luma_experience_gateway_legacy.py
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "code")
          from booth_public_contract import public_booth_projection

          projected = public_booth_projection({
              "indexing": {"files_indexed": 7, "private_path": "/private/path"},
              "catalog": {"engine_count": 4, "unknown": {"secret": "synthetic"}},
          })
          assert projected["schema"] == "lumencore.public_booth_contract.v2"
          assert projected["supported_maturity_level"] == 3
          assert projected["live_execution_authority"] is False
          assert projected["profit_claim_allowed"] is False
          assert projected["indexing"]["files_indexed"] == 7
          assert "private_path" not in projected["indexing"]
          assert "unknown" not in projected["catalog"]
          assert "live_execution" not in projected
          PY

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.VPS_KNOWN_HOSTS }}

      - name: Verify SSH connectivity
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "opc@${{ secrets.VPS_HOST }}" \
            'printf "SSH_OK\n"'

      - name: Verify passwordless sudo
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "opc@${{ secrets.VPS_HOST }}" \
            'sudo -n true && printf "SUDO_OK\n"'

      - name: Ensure remote transfer dependencies
        if: steps.scope.outputs.mutation_requested == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "opc@${{ secrets.VPS_HOST }}" '
            set -eu
            missing=""
            for command_name in rsync python3 curl; do
              if ! command -v "$command_name" >/dev/null 2>&1; then
                missing="$missing $command_name"
              fi
            done
            if [ -n "$missing" ]; then
              if command -v dnf >/dev/null 2>&1; then
                sudo -n dnf install -y $missing
              elif command -v yum >/dev/null 2>&1; then
                sudo -n yum install -y $missing
              elif command -v apt-get >/dev/null 2>&1; then
                sudo -n apt-get update -qq
                sudo -n apt-get install -y $missing
              else
                echo "ERROR: no supported package manager for:$missing" >&2
                exit 1
              fi
            fi
            command -v rsync
            command -v python3
            command -v curl
          '

      - name: Verify active Nginx edge
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "opc@${{ secrets.VPS_HOST }}" '
            set -eu
            sudo -n nginx -t
            sudo -n systemctl is-active --quiet nginx
            echo "Active nginx candidates:"
            found=0
            for candidate in \
              /etc/nginx/sites-enabled/lumatrader \
              /etc/nginx/sites-available/lumatrader \
              /etc/nginx/conf.d/lumatrader.conf; do
              if [ -e "$candidate" ] || [ -L "$candidate" ]; then
                found=$((found + 1))
                printf "  %s -> %s\n" "$candidate" "$(readlink -f "$candidate" 2>/dev/null || printf unknown)"
              fi
            done
            if [ "$found" -eq 0 ]; then
              echo "ERROR: no lumatrader nginx candidate was found" >&2
              exit 1
            fi
          '

      - name: Capture VPS storage and identity
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "opc@${{ secrets.VPS_HOST }}" '
            set -eu
            printf "Remote identity: "
            id
            printf "Filesystem capacity:\n"
            df -hP / /opt
            printf "Filesystem inodes:\n"
            df -iP / /opt
          ' | tee /tmp/lumencore-vps-preflight.txt

      - name: Verify VPS disk capacity
        if: steps.scope.outputs.mutation_requested == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "opc@${{ secrets.VPS_HOST }}" '
            set -eu
            set -- $(df -Pk /opt | tail -n 1)
            available_kb="$4"
            if [ "$available_kb" -lt 131072 ]; then
              sudo -n journalctl --vacuum-size=50M >/dev/null 2>&1 || true
              sudo -n dnf clean all >/dev/null 2>&1 || true
              sudo -n yum clean all >/dev/null 2>&1 || true
              sudo -n apt-get clean >/dev/null 2>&1 || true
              set -- $(df -Pk /opt | tail -n 1)
              available_kb="$4"
            fi
            printf "AVAILABLE_KB=%s\n" "$available_kb"
            if [ "$available_kb" -lt 131072 ]; then
              echo "ERROR: fewer than 128 MiB remain on the VPS filesystem" >&2
              exit 1
            fi
          '

      - name: Verify VPS inode capacity
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "opc@${{ secrets.VPS_HOST }}" '
            set -eu
            set -- $(df -Pi /opt | tail -n 1)
            available_inodes="$4"
            printf "AVAILABLE_INODES=%s\n" "$available_inodes"
            if [ "$available_inodes" -lt 2048 ]; then
              echo "ERROR: fewer than 2048 inodes remain on the VPS filesystem" >&2
              exit 1
            fi
          '

      - name: Prepare site content directories
        if: steps.scope.outputs.site_changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "opc@${{ secrets.VPS_HOST }}" '
            set -eu
            sudo -n install -d -m 755 \
              /opt/lumencore \
              /opt/lumencore/dashboard \
              /opt/lumencore/dashboard/data \
              /opt/lumencore/data
            for directory in \
              /opt/lumencore \
              /opt/lumencore/dashboard \
              /opt/lumencore/dashboard/data \
              /opt/lumencore/data; do
              sudo -n test -d "$directory"
            done
            printf "CONTENT_DIRECTORIES_OK\n"
          '

      - name: Prepare gateway code directory
        if: steps.scope.outputs.gateway_changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "opc@${{ secrets.VPS_HOST }}" '
            set -eu
            sudo -n install -d -m 755 /opt/lumencore /opt/lumencore/code
            sudo -n test -d /opt/lumencore/code
            printf "GATEWAY_CODE_DIRECTORY_OK\n"
          '

      - name: Prepare writable repair staging directory
        if: steps.scope.outputs.evidence_changed == 'true' || steps.scope.outputs.gateway_changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "opc@${{ secrets.VPS_HOST }}" '
            set -eu
            remote_uid="$(id -u)"
            remote_gid="$(id -g)"
            sudo -n rm -rf /tmp/lumencore-evidence-route
            sudo -n install -d -m 700 /tmp/lumencore-evidence-route
            sudo -n chown "$remote_uid:$remote_gid" /tmp/lumencore-evidence-route
            test -w /tmp/lumencore-evidence-route
            probe="/tmp/lumencore-evidence-route/.lumencore-write-test.$$"
            : > "$probe"
            rm -f "$probe"
            printf "REPAIR_STAGING_OK uid=%s gid=%s\n" "$remote_uid" "$remote_gid"
          '

      - name: Prepare writable gateway dependency staging directory
        if: steps.scope.outputs.gateway_changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "opc@${{ secrets.VPS_HOST }}" '
            set -eu
            remote_uid="$(id -u)"
            remote_gid="$(id -g)"
            sudo -n rm -rf /tmp/lumencore-gateway-runtime
            sudo -n install -d -m 700 /tmp/lumencore-gateway-runtime
            sudo -n chown "$remote_uid:$remote_gid" /tmp/lumencore-gateway-runtime
            test -w /tmp/lumencore-gateway-runtime
            printf "GATEWAY_STAGING_OK uid=%s gid=%s\n" "$remote_uid" "$remote_gid"
          '

      - name: Upload VPS preflight diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vps-preflight-${{ github.run_id }}
          path: /tmp/lumencore-vps-preflight.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Sync dashboard assets
        if: steps.scope.outputs.site_changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rsync -rlvz --delete --inplace --checksum --no-perms --omit-dir-times \
            --rsync-path="sudo -n rsync" \
            --exclude='*.py' \
            --exclude='*.ps1' \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='data/' \
            --exclude='assets/vendor/three.min.js' \
            -e "ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15" \
            dashboard/ \
            "opc@${{ secrets.VPS_HOST }}:/opt/lumencore/dashboard/"

      - name: Sync data snapshots
        if: steps.scope.outputs.site_changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rsync -rlvz --inplace --checksum --no-perms --omit-dir-times \
            --rsync-path="sudo -n rsync" \
            -e "ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15" \
            data/ \
            "opc@${{ secrets.VPS_HOST }}:/opt/lumencore/data/"

          rsync -rlvz --delete --inplace --checksum --no-perms --omit-dir-times \
            --rsync-path="sudo -n rsync" \
            -e "ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15" \
            data/ \
            "opc@${{ secrets.VPS_HOST }}:/opt/lumencore/dashboard/data/"

      - name: Upload bounded repair tools
        if: steps.scope.outputs.evidence_changed == 'true' || steps.scope.outputs.gateway_changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rsync -rlvz --inplace --no-perms --omit-dir-times \
            -e "ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15" \
            code/ops/repair_public_edge.py \
            code/ops/REPAIR_PUBLIC_EDGE_ON_VPS.sh \
            code/ops/repair_evidence_route.py \
            code/ops/REPAIR_EVIDENCE_ROUTE_ON_VPS.sh \
            "opc@${{ secrets.VPS_HOST }}:/tmp/lumencore-evidence-route/"

      - name: Upload bounded gateway dependency repair
        if: steps.scope.outputs.gateway_changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rsync -rlvz --inplace --no-perms --omit-dir-times \
            -e "ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15" \
            code/booth_public_contract.py \
            code/luma_experience_gateway.py \
            code/luma_experience_gateway_legacy.py \
            code/ops/REPAIR_GATEWAY_PUBLIC_CONTRACT_ON_VPS.sh \
            "opc@${{ secrets.VPS_HOST }}:/tmp/lumencore-gateway-runtime/"

      - name: Apply public edge guard
        if: steps.scope.outputs.evidence_changed == 'true' || steps.scope.outputs.gateway_changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "opc@${{ secrets.VPS_HOST }}" \
            "sudo -n bash /tmp/lumencore-evidence-route/REPAIR_PUBLIC_EDGE_ON_VPS.sh --apply"

      - name: Apply bounded evidence route repair
        if: steps.scope.outputs.evidence_changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "opc@${{ secrets.VPS_HOST }}" \
            "sudo -n bash /tmp/lumencore-evidence-route/REPAIR_EVIDENCE_ROUTE_ON_VPS.sh --apply"

      - name: Apply bounded gateway dependency repair
        if: steps.scope.outputs.gateway_changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          CONTRACT_SHA="$(sha256sum code/booth_public_contract.py | awk '{print $1}')"
          FACADE_SHA="$(sha256sum code/luma_experience_gateway.py | awk '{print $1}')"
          LEGACY_SHA="$(sha256sum code/luma_experience_gateway_legacy.py | awk '{print $1}')"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "opc@${{ secrets.VPS_HOST }}" \
            "sudo -n env \
              LUMENCORE_PUBLIC_CONTRACT_SOURCE=/tmp/lumencore-gateway-runtime/booth_public_contract.py \
              LUMENCORE_GATEWAY_FACADE_SOURCE=/tmp/lumencore-gateway-runtime/luma_experience_gateway.py \
              LUMENCORE_GATEWAY_LEGACY_SOURCE=/tmp/lumencore-gateway-runtime/luma_experience_gateway_legacy.py \
              LUMENCORE_EXPECTED_PUBLIC_CONTRACT_SHA256=${CONTRACT_SHA} \
              LUMENCORE_EXPECTED_GATEWAY_FACADE_SHA256=${FACADE_SHA} \
              LUMENCORE_EXPECTED_GATEWAY_LEGACY_SHA256=${LEGACY_SHA} \
              bash /tmp/lumencore-gateway-runtime/REPAIR_GATEWAY_PUBLIC_CONTRACT_ON_VPS.sh --apply"

      - name: Smoke test canonical production surfaces
        shell: bash
        run: |
          set -euo pipefail
          tmp_root="$(mktemp)"
          tmp_evidence="$(mktemp)"
          tmp_health="$(mktemp)"
          tmp_booth="$(mktemp)"
          tmp_asset="$(mktemp)"
          tmp_private="$(mktemp)"
          trap 'rm -f "$tmp_root" "$tmp_evidence" "$tmp_health" "$tmp_booth" "$tmp_asset" "$tmp_private"' EXIT

          status() {
            local url="$1"
            local output="$2"
            curl -sS --max-time 15 -o "$output" -w '%{http_code}' "$url" || true
          }

          ROOT="$(status "https://lumen-core.ai/?deploy=${GITHUB_SHA}" "$tmp_root")"
          EVIDENCE="$(status "https://lumen-core.ai/evidence/?deploy=${GITHUB_SHA}" "$tmp_evidence")"
          HEALTH="$(status "https://lumen-core.ai/health?deploy=${GITHUB_SHA}" "$tmp_health")"
          BOOTH="$(status "https://lumen-core.ai/api/master/booth-brief?deploy=${GITHUB_SHA}" "$tmp_booth")"
          ASSET="$(status "https://lumen-core.ai/assets/lumencore.css?deploy=${GITHUB_SHA}" "$tmp_asset")"
          PRIVATE="$(status "https://lumen-core.ai/quant_lab.html?deploy=${GITHUB_SHA}" "$tmp_private")"

          echo "Root: ${ROOT:-000} | Evidence: ${EVIDENCE:-000} | Gateway health: ${HEALTH:-000} | Booth: ${BOOTH:-000} | Asset: ${ASSET:-000} | Private route: ${PRIVATE:-000}"

          [[ "$ROOT" == "200" ]]
          [[ "$EVIDENCE" == "200" ]]
          [[ "$HEALTH" == "200" ]]
          [[ "$BOOTH" == "200" ]]
          [[ "$ASSET" == "200" ]]
          [[ "$PRIVATE" == "404" ]]
          grep -Fq 'One proof path. One bounded decision.' "$tmp_root"
          grep -Fq 'name="lumencore-surface" content="proof-to-pilot-evidence-v1"' "$tmp_evidence"
          python3 - "$tmp_health" "$tmp_booth" <<'PY'
          import json
          import sys
          from pathlib import Path

          health = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          booth = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          assert health["schema"] == "lumencore.public_gateway_health.v1"
          assert isinstance(health["all_healthy"], bool)
          assert booth["schema"] == "lumencore.public_booth_contract.v2"
          assert booth["supported_maturity_level"] == 3
          assert booth["public_claim_allowed"] is False
          assert booth["live_execution_authority"] is False
          PY

          echo "Production manifest, bounded evidence, health, booth contract, and private-route denial passed."

      - name: Publish production deployment receipt
        if: always() && inputs.human_unlock == 'DEPLOY_BOUNDED_LUMENCORE_TO_PRODUCTION'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
          DEPLOY_SCOPE: ${{ steps.scope.outputs.scope_summary }}
        run: |
          set -euo pipefail
          SCOPE="${DEPLOY_SCOPE:-unknown}"
          case "$JOB_STATUS" in
            success)
              STATE=success
              DESCRIPTION="Bounded VPS ${SCOPE} run passed all smoke tests"
              ;;
            cancelled)
              STATE=error
              DESCRIPTION="Bounded VPS ${SCOPE} run was cancelled"
              ;;
            *)
              STATE=failure
              DESCRIPTION="Bounded VPS ${SCOPE} run failed or rolled back"
              ;;
          esac
          export STATE DESCRIPTION
          python3 - <<'PY' > /tmp/deploy-status.json
          import json, os
          print(json.dumps({
              "state": os.environ["STATE"],
              "target_url": os.environ["TARGET_URL"],
              "description": os.environ["DESCRIPTION"],
              "context": "production/lumencore-vps",
          }))
          PY
          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA" \
            --data-binary @/tmp/deploy-status.json
