name: 🚀 Deploy Dashboard to VPS

on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**/*.html'
      - 'assets/**'
      - 'data/*.json'
      - '*.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.VPS_KNOWN_HOSTS }}

      - name: Sync dashboard assets to VPS
        run: |
          ssh -o StrictHostKeyChecking=no opc@${{ secrets.VPS_HOST }} \
            "if command -v sudo >/dev/null 2>&1; then SUDO=sudo; else SUDO=; fi; \
             if [ -d /opt/lumencore/dashboard ]; then \
               \$SUDO rm -rf /opt/lumencore/dashboard/node_modules \
                      /opt/lumencore/dashboard/.git \
                      /opt/lumencore/dashboard/.pytest_cache \
                      /opt/lumencore/dashboard/.mypy_cache \
                      /opt/lumencore/dashboard/.ruff_cache; \
               \$SUDO find /opt/lumencore/dashboard -type d -name '__pycache__' -prune -exec rm -rf {} +; \
               \$SUDO find /opt/lumencore/dashboard -type f \( -name '*.pyc' -o -name '*.tmp' -o -name '*.bak' -o -name '*.log' \) -delete; \
             fi; \
             \$SUDO install -d -o opc -g opc -m 755 /opt/lumencore/dashboard /opt/lumencore/data; \
             df -h /opt/lumencore; \
             echo 'Largest remote directories:'; \
             du -xhd1 /opt/lumencore /opt /var /home /tmp 2>/dev/null | sort -h | tail -50; \
             touch /opt/lumencore/data/.deploy_write_test && rm -f /opt/lumencore/data/.deploy_write_test"

          # Sync HTML dashboards + data JSON to VPS web roots
          # The VPS has limited free space, so avoid temp-copy rewrites of large
          # preseeded vendor bundles while still shipping dashboard changes.
          rsync -rlvz --delete --inplace --size-only --no-perms --omit-dir-times \
            --exclude='*.py' \
            --exclude='*.ps1' \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='assets/vendor/three.min.js' \
            -e "ssh -o StrictHostKeyChecking=no" \
            dashboard/ \
            opc@${{ secrets.VPS_HOST }}:/opt/lumencore/dashboard/

          # Sync data snapshots
          rsync -rlvz --inplace --size-only --no-perms --omit-dir-times \
            -e "ssh -o StrictHostKeyChecking=no" \
            data/ \
            opc@${{ secrets.VPS_HOST }}:/opt/lumencore/data/

          echo "Dashboard deploy complete."

      - name: Smoke test production endpoints
        run: |
          sleep 5  # let nginx settle
          PORTAL=$(curl -sf --max-time 10 -o /dev/null -w "%{http_code}" https://lumen-core.ai/ || echo "000")
          DASH=$(curl -sf --max-time 10 -o /dev/null -w "%{http_code}" https://lumen-core.ai/kraken_execution_dashboard.html || echo "000")
          echo "Portal: $PORTAL | Kraken Dashboard: $DASH"
          if [ "$PORTAL" != "200" ] || [ "$DASH" != "200" ]; then
            echo "::error::Post-deploy smoke test failed — check VPS nginx"
            exit 1
          fi
          echo "✅ All production endpoints responding after deploy."
