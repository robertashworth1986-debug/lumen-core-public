name: Deploy bounded LumenCore site to VPS

on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**/*.html'
      - 'assets/**'
      - 'data/*.json'
      - '*.html'
      - 'code/ops/repair_evidence_route.py'
      - 'code/ops/REPAIR_EVIDENCE_ROUTE_ON_VPS.sh'
      - 'code/deploy/nginx/lumatrader.conf'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lumencore-production-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.VPS_KNOWN_HOSTS }}

      - name: Sync bounded public assets and repair evidence route
        shell: bash
        run: |
          set -euo pipefail
          REMOTE="opc@${{ secrets.VPS_HOST }}"
          SSH=(ssh -o StrictHostKeyChecking=no "$REMOTE")
          RSYNC_SSH="ssh -o StrictHostKeyChecking=no"

          "${SSH[@]}" \
            "if command -v sudo >/dev/null 2>&1; then SUDO=sudo; else SUDO=; fi; \
             \$SUDO journalctl --vacuum-size=100M >/dev/null 2>&1 || true; \
             \$SUDO dnf clean all >/dev/null 2>&1 || true; \
             \$SUDO yum clean all >/dev/null 2>&1 || true; \
             \$SUDO find /var/log -type f \( -name '*.gz' -o -name '*.old' -o -name '*.1' -o -name '*.log.*' \) -delete 2>/dev/null || true; \
             if [ -d /opt/lumencore/dashboard ]; then \
               \$SUDO rm -rf /opt/lumencore/dashboard/node_modules \
                      /opt/lumencore/dashboard/.git \
                      /opt/lumencore/dashboard/.pytest_cache \
                      /opt/lumencore/dashboard/.mypy_cache \
                      /opt/lumencore/dashboard/.ruff_cache; \
               \$SUDO find /opt/lumencore/dashboard -type d -name '__pycache__' -prune -exec rm -rf {} +; \
               \$SUDO find /opt/lumencore/dashboard -type f \( -name '*.pyc' -o -name '*.tmp' -o -name '*.bak' -o -name '*.log' \) -delete; \
             fi; \
             \$SUDO install -d -o opc -g opc -m 755 \
               /opt/lumencore/dashboard \
               /opt/lumencore/dashboard/data \
               /opt/lumencore/data \
               /tmp/lumencore-evidence-route; \
             touch /opt/lumencore/data/.deploy_write_test && rm -f /opt/lumencore/data/.deploy_write_test; \
             df -h /opt/lumencore"

          rsync -rlvz --delete --inplace --size-only --no-perms --omit-dir-times \
            --exclude='*.py' \
            --exclude='*.ps1' \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='data/' \
            --exclude='assets/vendor/three.min.js' \
            -e "$RSYNC_SSH" \
            dashboard/ \
            "$REMOTE:/opt/lumencore/dashboard/"

          rsync -rlvz --inplace --size-only --no-perms --omit-dir-times \
            -e "$RSYNC_SSH" \
            data/ \
            "$REMOTE:/opt/lumencore/data/"

          rsync -rlvz --delete --inplace --size-only --no-perms --omit-dir-times \
            -e "$RSYNC_SSH" \
            data/ \
            "$REMOTE:/opt/lumencore/dashboard/data/"

          rsync -rlvz --inplace --no-perms --omit-dir-times \
            -e "$RSYNC_SSH" \
            code/ops/repair_evidence_route.py \
            code/ops/REPAIR_EVIDENCE_ROUTE_ON_VPS.sh \
            "$REMOTE:/tmp/lumencore-evidence-route/"

          "${SSH[@]}" \
            "sudo bash /tmp/lumencore-evidence-route/REPAIR_EVIDENCE_ROUTE_ON_VPS.sh --apply"

      - name: Smoke test canonical production surfaces
        shell: bash
        run: |
          set -euo pipefail
          tmp_root="$(mktemp)"
          tmp_evidence="$(mktemp)"
          tmp_data="$(mktemp)"
          trap 'rm -f "$tmp_root" "$tmp_evidence" "$tmp_data"' EXIT

          status() {
            local url="$1"
            local output="$2"
            curl -sS --max-time 15 -o "$output" -w '%{http_code}' "$url" || true
          }

          ROOT="$(status "https://lumen-core.ai/?deploy=${GITHUB_SHA}" "$tmp_root")"
          EVIDENCE="$(status "https://lumen-core.ai/evidence/?deploy=${GITHUB_SHA}" "$tmp_evidence")"
          DATA="$(status "https://lumen-core.ai/data/site_health.json?deploy=${GITHUB_SHA}" "$tmp_data")"

          echo "Root: ${ROOT:-000} | Evidence: ${EVIDENCE:-000} | Site health data: ${DATA:-000}"

          [[ "$ROOT" == "200" ]]
          [[ "$EVIDENCE" == "200" ]]
          [[ "$DATA" == "200" ]]
          grep -Fq 'One proof path. One bounded decision.' "$tmp_root"
          grep -Fq 'name="lumencore-surface" content="proof-to-pilot-evidence-v1"' "$tmp_evidence"
          python3 -m json.tool "$tmp_data" >/dev/null

          echo "Production root, bounded evidence page, and health JSON are live."
