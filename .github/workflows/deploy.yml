name: Audit exact public-site snapshot

on:
  push:
    branches: [main]
    paths:
      - "dashboard/operator_home.html"
      - "dashboard/opportunity_sprint.html"
      - "dashboard/proof_to_pilot.html"
      - "dashboard/visual_library.html"
      - "dashboard/external_review.html"
      - "dashboard/reviewer_docket.json"
      - "dashboard/mission_control.html"
      - "dashboard/quant_lab.html"
      - "dashboard/grants.html"
      - "dashboard/kraken_execution_dashboard.html"
      - "dashboard/forecast.html"
      - "dashboard/anomalies.html"
      - "dashboard/explain.html"
      - "dashboard/lab.html"
      - "dashboard/evidence/index_bounded.html"
      - "dashboard/robots.txt"
      - "dashboard/sitemap.xml"
      - "dashboard/site.webmanifest"
      - "dashboard/manifest.json"
      - "dashboard/assets/lumaarc_arc_seal_v1.png"
      - "dashboard/assets/lumencore.css"
      - "dashboard/assets/lumencore.js"
      - "dashboard/assets/luma_command_fabric.css"
      - "dashboard/assets/luma_command_fabric.js"
      - "dashboard/assets/luma_institutional_surface.css"
      - "dashboard/assets/luma_institutional_surface.js"
      - "dashboard/assets/visuals/**"
      - "dashboard/assets/vendor/three.min.js"
      - "dashboard/js/alpha_globe_3d.js"
      - "dashboard/js/cinematic_telemetry_layer.js"
      - "dashboard/js/luma_design_system.js"
      - "dashboard/js/luma_path_resolver.js"
      - "dashboard/assets/prooflock/**"
      - "dashboard/build_week/prooflock_console/**"
      - "code/deploy/package_public_site_release.py"
      - "code/ops/CLASSIFY_PUBLIC_RELEASE_INCIDENT.py"
      - "code/ops/VERIFY_PUBLIC_SITE_LIVE_RELEASE.py"
      - "config/incident_response_and_continuity_v1.json"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/deploy-public-site-release.yml"
  schedule:
    - cron: "23 11 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lumencore-public-site-live-audit
  cancel-in-progress: true

jobs:
  exact-live-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the exact audited commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Package immutable public-site bytes
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 /tmp/public-site-live-audit
          python3 code/deploy/package_public_site_release.py \
            --source-commit "$GITHUB_SHA" \
            --archive /tmp/public-site-live-audit/public-site-release.tar \
            --manifest /tmp/public-site-live-audit/public-site-release-manifest.json \
            | tee /tmp/public-site-live-audit/package-receipt.json

      - name: Verify every live byte against the immutable manifest
        shell: bash
        run: |
          set -uo pipefail
          set +e
          python3 code/ops/VERIFY_PUBLIC_SITE_LIVE_RELEASE.py \
            --manifest /tmp/public-site-live-audit/public-site-release-manifest.json \
            --source-commit "$GITHUB_SHA" \
            --base-url https://lumen-core.ai \
            --output /tmp/public-site-live-audit/live-verification.json
          audit_rc=$?

          classifier_rc=0
          if [[ -s /tmp/public-site-live-audit/live-verification.json ]]; then
            python3 code/ops/CLASSIFY_PUBLIC_RELEASE_INCIDENT.py \
              --policy config/incident_response_and_continuity_v1.json \
              --manifest /tmp/public-site-live-audit/public-site-release-manifest.json \
              --live-verification /tmp/public-site-live-audit/live-verification.json \
              --output /tmp/public-site-live-audit/incident-classification.json
            classifier_rc=$?
          else
            echo "Live verifier produced no receipt; classification fails closed." >&2
            classifier_rc=1
          fi

          if (( classifier_rc != 0 )); then
            exit "$classifier_rc"
          fi
          exit "$audit_rc"

      - name: Upload immutable package and live-audit receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-site-live-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/public-site-live-audit/package-receipt.json
            /tmp/public-site-live-audit/public-site-release-manifest.json
            /tmp/public-site-live-audit/public-site-release.tar
            /tmp/public-site-live-audit/live-verification.json
            /tmp/public-site-live-audit/incident-classification.json
          if-no-files-found: warn
          retention-days: 30

# This workflow is intentionally read-only. It classifies drift but does not
# repair or close an incident. Production mutation is allowed only through
# deploy-public-site-release.yml with the exact human approval gate.
