name: Order Safety Promotion Gate

on:
  pull_request:
    paths:
      - "code/**"
      - "config/order_submission_path_policy.json"
      - "tests/test_order_safety*.py"
      - ".github/workflows/order-safety-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  order-safety-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install runtime test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          requests
          fastapi==0.138.2
          httpx==0.28.1

      - name: Compile safety surfaces
        run: |
          python -m py_compile \
            code/execution/order_safety_gate.py \
            code/kraken_execution.py \
            code/execution/live_executor.py \
            code/luma_experience_gateway.py \
            code/operator_api_access.py \
            code/auto_ticket_producer.py \
            code/kraken_swing_hunter.py \
            code/micro_position_kraken_bot.py \
            code/execution/execution_orchestrator.py \
            code/execution/alpaca_paper_executor.py \
            code/ops/LIQUIDATE_ALL_TO_USD.py \
            code/ops/AUDIT_ORDER_SUBMISSION_PATHS.py \
            code/FULL_TRUTH_ORCHESTRATOR.py \
            code/REBUILD_FULL_ADAPTIVE_LIVE_STACK.py \
            code/beast_mode.py \
            code/lightning.py \
            code/go_live_paper_trader.py \
            code/ops/_copilot_watch.py

      - name: Run focused fail-closed tests
        run: |
          python tests/test_order_safety_gate.py
          python tests/test_order_safety_facades.py
          python tests/test_operator_api_access.py
          python tests/test_standalone_no_orders_facades.py
          python tests/test_order_safety_promotion_lane.py
          python tests/test_order_safety_alpaca_paper_boundary.py

      - name: Audit all direct submission paths
        run: |
          python code/ops/AUDIT_ORDER_SUBMISSION_PATHS.py \
            --repo-root . \
            --output out/ops/order_submission_path_audit_latest.json

      - name: Upload immutable audit artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: order-safety-path-audit-${{ github.sha }}
          path: out/ops/order_submission_path_audit_latest.json
          if-no-files-found: warn
          retention-days: 30
