name: Institutional readiness gate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: institutional-readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.9'

      - name: Compile bounded verifier and tests
        run: |
          python -m py_compile code/ops/VERIFY_INSTITUTIONAL_READINESS.py
          python -m py_compile tests/test_institutional_readiness.py

      - name: Verify readiness register and emit receipt
        run: |
          mkdir -p out/institutional-readiness
          python code/ops/VERIFY_INSTITUTIONAL_READINESS.py \
            --verified-utc 2026-08-08T00:00:00Z \
            --json-out out/institutional-readiness/receipt.json

      - name: Run adversarial readiness tests
        run: python -m unittest discover -s tests -p 'test_institutional_readiness.py' -v

      - name: Upload bounded readiness receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: institutional-readiness-${{ github.sha }}
          path: out/institutional-readiness/receipt.json
          if-no-files-found: error
          retention-days: 30

      - name: Reject whitespace errors
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          git cat-file -e "${BASE_SHA}^{commit}"
          git diff --check "${BASE_SHA}...HEAD"

  windows-process-ownership:
    name: Windows process ownership (native fixtures)
    runs-on: windows-2025
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONHASHSEED: '0'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - name: Checkout reviewed source without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Windows Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.9'

      - name: Create isolated hash-locked ownership test environment
        run: |
          $ErrorActionPreference = 'Stop'
          $testVenv = Join-Path $env:RUNNER_TEMP 'lumencore-ownership-venv'
          python -m venv $testVenv
          if ($LASTEXITCODE -ne 0) { throw 'Test venv creation failed' }
          $testPython = Join-Path $testVenv 'Scripts/python.exe'
          & $testPython -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: --requirement requirements-windows-ownership-py311.lock
          if ($LASTEXITCODE -ne 0) { throw 'Hash-locked test installation failed' }
          & $testPython -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Test dependency consistency failed' }
          "OWNERSHIP_TEST_PYTHON=$testPython" >> $env:GITHUB_ENV

      - name: Exercise base Python and venv process identities on Windows
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:OWNERSHIP_TEST_PYTHON -c "import os,sys; assert os.name == 'nt'; assert sys.version_info[:3] == (3,11,9); assert sys.prefix != sys.base_prefix; print(sys.version)"
          if ($LASTEXITCODE -ne 0) { throw 'Native test environment precondition failed' }
          & powershell.exe -NoProfile -NonInteractive -Command 'if ($PSVersionTable.PSVersion.Major -ne 5) { throw "Windows PowerShell 5 is required" }; $PSVersionTable.PSVersion.ToString()'
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell precondition failed' }
          New-Item -ItemType Directory -Force out/institutional-readiness | Out-Null
          & $env:OWNERSHIP_TEST_PYTHON -m pytest -q -rs tests/test_supervisor_process_ownership.py tests/test_stack_runtime_manager_ownership.py --junitxml="out/institutional-readiness/windows-ownership-$env:GITHUB_SHA.xml"
          if ($LASTEXITCODE -ne 0) { throw 'Native process ownership tests failed' }
          [xml]$receipt = Get-Content -Raw "out/institutional-readiness/windows-ownership-$env:GITHUB_SHA.xml"
          $suite = $receipt.testsuites.testsuite
          if ([int]$suite.tests -lt 1 -or [int]$suite.skipped -ne 0 -or [int]$suite.failures -ne 0 -or [int]$suite.errors -ne 0) { throw 'Native ownership checks were empty, skipped, or failed' }

      - name: Verify fixtures did not mutate reviewed source
        run: |
          $changes = @(git status --porcelain --untracked-files=all)
          if ($LASTEXITCODE -ne 0 -or $changes.Count -ne 0) { throw 'Native tests changed reviewed source' }

      - name: Upload commit-bound Windows ownership receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-process-ownership-${{ github.sha }}
          path: out/institutional-readiness/windows-ownership-${{ github.sha }}.xml
          if-no-files-found: warn
          retention-days: 30

  full-repository-suite:
    name: Full repository suite (bounded first-party)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: '0'
      TZ: UTC
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - name: Checkout exact reviewed source without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up authoritative Python runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.9'

      - name: Install hash-locked institutional test closure
        run: |
          python code/ops/VERIFY_INSTITUTIONAL_DEPENDENCY_LOCK.py
          python -m pip install \
            --disable-pip-version-check \
            --require-hashes \
            --only-binary=:all: \
            --requirement requirements-institutional-ubuntu-py311.lock
          python -m pip check

      - name: Run complete repository test collection
        run: |
          mkdir -p out/institutional-readiness
          python -m pytest \
            -q \
            -rs \
            --durations=20 \
            --junitxml="out/institutional-readiness/full-suite-${GITHUB_SHA}.xml"

      - name: Verify tests did not mutate reviewed source
        run: test -z "$(git status --porcelain --untracked-files=all)"

      - name: Upload commit-bound JUnit receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: institutional-full-suite-${{ github.sha }}
          path: out/institutional-readiness/full-suite-${{ github.sha }}.xml
          if-no-files-found: warn
          retention-days: 30
