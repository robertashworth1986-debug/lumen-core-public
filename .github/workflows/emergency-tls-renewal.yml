name: Restore LumenCore TLS certificate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lumencore-production-site
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://lumen-core.ai/

    steps:
      - name: Install SSH key
        uses: shimataro/ssh-key-action@87a8f067114a8ce263df83e9ed5c849953548bc3 # v2.8.1
        with:
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.VPS_KNOWN_HOSTS }}

      - name: Renew the installed certificates and reload nginx
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes "opc@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo -n true
          command -v openssl >/dev/null
          sudo -n nginx -t
          export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/snap/bin
          CERTBOT_BIN="$(command -v certbot || true)"
          if [[ -z "$CERTBOT_BIN" && -x /opt/certbot/bin/certbot ]]; then
            CERTBOT_BIN=/opt/certbot/bin/certbot
          fi
          if [[ -z "$CERTBOT_BIN" ]]; then
            echo 'certbot not found in the approved executable locations' >&2
            for candidate in \
              /usr/bin/certbot /usr/local/bin/certbot /snap/bin/certbot \
              /opt/certbot/bin/certbot /root/.local/bin/certbot; do
              sudo -n test -e "$candidate" && sudo -n ls -l "$candidate" || true
            done
            command -v dnf || command -v yum || command -v apt-get || true
            sudo -n systemctl list-timers --all --no-pager \
              | grep -Ei 'certbot|acme|letsencrypt' || true
            exit 1
          fi
          sudo -n "$CERTBOT_BIN" --version
          sudo -n "$CERTBOT_BIN" certificates
          renew_args=(renew --non-interactive)
          certbot_help="$(sudo -n "$CERTBOT_BIN" renew --help all 2>&1 || true)"
          if [[ "$certbot_help" == *--no-random-sleep-on-renew* ]]; then
            renew_args+=(--no-random-sleep-on-renew)
          fi
          sudo -n "$CERTBOT_BIN" "${renew_args[@]}"
          sudo -n nginx -t
          sudo -n systemctl reload nginx
          sudo -n systemctl is-active --quiet nginx
          sleep 2

          certificate=$(mktemp)
          trap 'rm -f -- "$certificate"' EXIT
          timeout 15 openssl s_client \
            -connect 127.0.0.1:443 \
            -servername lumen-core.ai \
            -showcerts </dev/null 2>/dev/null \
            | openssl x509 -outform PEM > "$certificate"
          openssl x509 -in "$certificate" -noout -subject -issuer -dates
          openssl x509 -in "$certificate" -checkend 604800 -noout

          curl --fail --silent --show-error \
            --noproxy lumen-core.ai \
            --resolve lumen-core.ai:443:127.0.0.1 \
            --connect-timeout 5 --max-time 15 \
            https://lumen-core.ai/ >/dev/null
          REMOTE

      - name: Verify public TLS and mixer-critical pages
        shell: bash
        run: |
          set -euo pipefail
          for host in lumen-core.ai www.lumen-core.ai app.lumen-core.ai research.lumen-core.ai; do
            timeout 20 openssl s_client \
              -connect "$host:443" \
              -servername "$host" \
              -verify_hostname "$host" \
              -verify_return_error \
              -brief </dev/null
          done

          home=$(mktemp)
          offer=$(mktemp)
          trap 'rm -f -- "$home" "$offer"' EXIT
          curl --fail --silent --show-error --location \
            --connect-timeout 5 --max-time 20 \
            https://lumen-core.ai/ -o "$home"
          curl --fail --silent --show-error --location \
            --connect-timeout 5 --max-time 20 \
            https://lumen-core.ai/proof_to_pilot.html -o "$offer"
          grep -Fq 'proof-to-pilot-home-v1' "$home"
          grep -Fq 'bounded-validation-offer-v1' "$offer"
