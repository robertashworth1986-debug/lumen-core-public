name: External Replication Docket Gate

on:
  pull_request:
    paths:
      - "config/external_replication_docket_v1.json"
      - "code/ops/validate_external_replication_docket.py"
      - "code/ops/run_public_assurance_suite.py"
      - "code/ops/run_public_assurance_suite_strict.py"
      - "code/ops/validate_external_independence_contract.py"
      - "code/proof_capsule_verifier.py"
      - "examples/proof_capsule/**"
      - "tests/test_external_replication_docket.py"
      - "tests/test_public_assurance_suite.py"
      - "tests/test_public_assurance_suite_strict.py"
      - "dashboard/external_review.html"
      - "docs/EXTERNAL_REPLICATION_DOCKET_V1.md"
      - "docs/PUBLIC_ASSURANCE_QUICKSTART.md"
      - ".github/workflows/external-replication-docket.yml"
  push:
    branches: [main]
    paths:
      - "config/external_replication_docket_v1.json"
      - "code/ops/validate_external_replication_docket.py"
      - "code/ops/run_public_assurance_suite.py"
      - "code/ops/run_public_assurance_suite_strict.py"
      - "code/ops/validate_external_independence_contract.py"
      - "code/proof_capsule_verifier.py"
      - "examples/proof_capsule/**"
      - "tests/test_external_replication_docket.py"
      - "tests/test_public_assurance_suite.py"
      - "tests/test_public_assurance_suite_strict.py"
      - "dashboard/external_review.html"
      - "docs/EXTERNAL_REPLICATION_DOCKET_V1.md"
      - "docs/PUBLIC_ASSURANCE_QUICKSTART.md"
      - ".github/workflows/external-replication-docket.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: external-replication-docket-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      ASSURANCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Compile validators, runner, and tests
        run: |
          python -m py_compile \
            code/ops/validate_external_replication_docket.py \
            code/ops/run_public_assurance_suite.py \
            code/ops/run_public_assurance_suite_strict.py \
            code/ops/validate_external_independence_contract.py \
            tests/test_external_replication_docket.py \
            tests/test_public_assurance_suite.py \
            tests/test_public_assurance_suite_strict.py

      - name: Run replication-docket adversarial tests
        run: |
          python -m unittest discover \
            -s tests \
            -p "test_external_replication_docket.py" \
            -v

      - name: Run aggregate-assurance adversarial tests
        run: |
          python -m unittest discover \
            -s tests \
            -p "test_public_assurance_suite.py" \
            -v

      - name: Run strict independence and custody adversarial tests
        run: |
          python -m unittest discover \
            -s tests \
            -p "test_public_assurance_suite_strict.py" \
            -v

      - name: Validate canonical docket and write receipt
        run: |
          python code/ops/validate_external_replication_docket.py \
            config/external_replication_docket_v1.json \
            > external_replication_docket_receipt.json

      - name: Enforce canonical hold boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          receipt = json.loads(
              Path("external_replication_docket_receipt.json").read_text(encoding="utf-8")
          )
          assert receipt["valid"] is True
          assert receipt["schema"] == "lumencore.external_replication_docket.v1"
          assert receipt["status"] == "template_unassigned"
          assert receipt["evidence_class"] == "template"
          assert receipt["decision"] == "hold"
          assert receipt["preregistration_gates_passed"] == 0
          assert receipt["external_gates_passed"] == 0
          assert receipt["safe_for_external_validation_claim"] is False
          assert len(receipt["payload_sha256"]) == 64
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - name: Run one-command public assurance suite
        run: |
          python code/ops/run_public_assurance_suite.py \
            --root . \
            --commit "$ASSURANCE_COMMIT" \
            --out public_assurance_receipt.json

      - name: Run strict public assurance suite
        run: |
          python code/ops/run_public_assurance_suite_strict.py \
            --root . \
            --commit "$ASSURANCE_COMMIT" \
            --out public_assurance_receipt_strict.json

      - name: Enforce aggregate assurance boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          receipt = json.loads(
              Path("public_assurance_receipt.json").read_text(encoding="utf-8")
          )
          assert receipt["valid"] is True
          assert receipt["schema"] == "lumencore.public_assurance_suite.v1"
          assert receipt["check_count"] == 2
          checks = {item["check_id"]: item for item in receipt["checks"]}
          capsule = checks["proof_capsule_v3"]["public_result"]
          assert capsule["receipt_schema"] == "proof-capsule-receipt-v3"
          assert capsule["verifier_version"] == "3.0"
          assert capsule["capsule_file_custody_complete"] is True
          assert capsule["declared_external_validation_status"] == "not_established"
          assert capsule["external_validator_identity_evaluated"] is False
          assert capsule["external_validator_independence_evaluated"] is False
          assert capsule["external_validation_conclusion_evaluated"] is False
          assert capsule["pilot_decision"] == "external_review"
          assert capsule["release_authorization_evaluated"] is False
          assert capsule["human_unlock_required"] is True
          docket = checks["external_replication_docket_v1"]["public_result"]
          assert docket["status"] == "template_unassigned"
          assert docket["decision"] == "hold"
          assert docket["safe_for_external_validation_claim"] is False
          assert len(receipt["source_files"]) >= 5
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - name: Enforce strict custody and independence boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          receipt = json.loads(
              Path("public_assurance_receipt_strict.json").read_text(encoding="utf-8")
          )
          assert receipt["valid"] is True
          assert receipt["source_pre_post_match"] is True
          assert receipt["strict_runner_version"] == "1.0.0"
          checks = {item["check_id"]: item for item in receipt["checks"]}
          docket = checks["external_replication_docket_v1"]["public_result"]
          assert docket["independence_contract_valid"] is True
          assert docket["safe_for_external_validation_claim"] is False
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - name: Upload bounded assurance receipts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: external-replication-and-public-assurance-${{ github.run_id }}
          path: |
            external_replication_docket_receipt.json
            public_assurance_receipt.json
            public_assurance_receipt_strict.json
          if-no-files-found: error
          retention-days: 30
