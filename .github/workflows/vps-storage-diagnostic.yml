name: Diagnose LumenCore VPS runtime and capacity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vps-storage-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: lumencore-vps-runtime-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Mark runtime diagnostic pending
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/runtime-diagnostic-status.json
          import json, os
          print(json.dumps({
              "state": "pending",
              "target_url": os.environ["TARGET_URL"],
              "description": "Read-only VPS runtime diagnostic is running",
              "context": "diagnostic/lumencore-vps-runtime",
          }))
          PY
          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA" \
            --data-binary @/tmp/runtime-diagnostic-status.json

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.VPS_KNOWN_HOSTS }}

      - name: Capture runtime, gateway, and capacity evidence
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes "opc@${{ secrets.VPS_HOST }}" '
            set -u
            probe() {
              local name="$1"
              local url="$2"
              local rc=0
              local result
              result=$(curl --silent --show-error --location --max-redirs 3 \
                --connect-timeout 5 --max-time 10 --output /dev/null \
                --write-out "code=%{http_code} remote=%{remote_ip} connect_s=%{time_connect} total_s=%{time_total} content_type=%{content_type}" \
                "$url" 2>&1) || rc=$?
              printf "%s rc=%s %s\n" "$name" "$rc" "$result"
            }

            show_unit() {
              local unit="$1"
              echo "--- $unit ---"
              printf "active="
              systemctl is-active "$unit" 2>&1 || true
              printf "enabled="
              systemctl is-enabled "$unit" 2>&1 || true
              systemctl show "$unit" --no-pager \
                --property=LoadState \
                --property=ActiveState \
                --property=SubState \
                --property=Result \
                --property=ExecMainCode \
                --property=ExecMainStatus \
                --property=NRestarts \
                --property=Restart \
                --property=RestartUSec \
                --property=StartLimitBurst \
                --property=StartLimitIntervalUSec \
                --property=ExecMainStartTimestamp \
                --property=StateChangeTimestamp \
                --property=User \
                --property=Group \
                --property=WorkingDirectory \
                --property=ExecStart \
                --property=MainPID \
                --property=FragmentPath \
                2>&1 || true
            }

            show_process_identity() {
              local label="$1"
              local pid="$2"
              local expected_marker="$3"
              local cmdline=""
              echo "--- $label pid=$pid ---"
              if ! [[ "$pid" =~ ^[1-9][0-9]*$ ]]; then
                echo "valid_pid=false"
                return
              fi
              if ! kill -0 "$pid" 2>/dev/null; then
                echo "process_exists=false"
                return
              fi
              echo "process_exists=true"
              ps -p "$pid" -o pid=,ppid=,etimes=,stat=,comm= 2>&1 || true
              if [[ -r "/proc/$pid/cmdline" ]]; then
                cmdline=$(tr "\\000" " " < "/proc/$pid/cmdline" 2>/dev/null || true)
              fi
              if [[ -n "$cmdline" && "$cmdline" == *"$expected_marker"* ]]; then
                echo "expected_identity=true"
              else
                echo "expected_identity=false"
              fi
              if [[ -r "/proc/$pid/exe" ]]; then
                printf "executable="
                readlink "/proc/$pid/exe" 2>&1 || true
              fi
              if [[ -r "/proc/$pid/cwd" ]]; then
                printf "working_directory="
                readlink "/proc/$pid/cwd" 2>&1 || true
              fi
            }

            echo "=== identity ==="
            id
            hostname
            date -u +"%Y-%m-%dT%H:%M:%SZ"

            echo "=== public and loopback endpoint probes (status only; no bodies) ==="
            probe public_root https://lumen-core.ai/
            probe public_nginx_health https://lumen-core.ai/nginx-health
            probe public_gateway_health https://lumen-core.ai/health
            probe public_gateway_snapshot https://lumen-core.ai/api/snapshot
            probe loopback_nginx_health http://127.0.0.1/nginx-health
            probe loopback_gateway_via_nginx http://127.0.0.1/health
            probe loopback_gateway_direct http://127.0.0.1:8787/health

            echo "=== canonical and related service states ==="
            for unit in \
              nginx \
              caddy \
              luma-gateway \
              luma-dashboard-refresh \
              luma-paper-ticker \
              luma-symbol-awareness \
              luma-kraken-history \
              luma-dashboard \
              luma-intel-api \
              luma-node-red \
              luma-nodered-flow-sync \
              lamascout-api \
              lamascout-loop
            do
              show_unit "$unit"
            done

            echo "=== discovered LumenCore service units ==="
            systemctl list-units --all --type=service --no-legend \
              "luma*.service" "lumencore*.service" "lamascout*.service" \
              2>&1 || true

            echo "=== gateway singleton-lock identity ==="
            gateway_main_pid=$(systemctl show luma-gateway --property=MainPID --value 2>/dev/null || true)
            show_process_identity gateway_systemd_main "$gateway_main_pid" "luma_experience_gateway:app"
            gateway_lock=/opt/lumencore/run/luma_experience_gateway.lock
            if [[ -f "$gateway_lock" ]]; then
              echo "lock_exists=true"
              stat --printf="lock_mode=%a lock_owner=%U:%G lock_bytes=%s lock_modified=%y\n" "$gateway_lock" 2>&1 || true
              gateway_lock_pid=$(tr -cd "0-9" < "$gateway_lock" 2>/dev/null | head -c 20 || true)
              echo "lock_pid=$gateway_lock_pid"
              if [[ -n "$gateway_main_pid" && "$gateway_lock_pid" == "$gateway_main_pid" ]]; then
                echo "lock_pid_matches_systemd_main=true"
              else
                echo "lock_pid_matches_systemd_main=false"
              fi
              show_process_identity gateway_lock_owner "$gateway_lock_pid" "luma_experience_gateway:app"
            else
              echo "lock_exists=false"
            fi

            echo "=== gateway executable and source preflight ==="
            for path in \
              /opt/lumencore/.venv/bin/python \
              /opt/lumencore/code/luma_experience_gateway.py \
              /opt/lumencore/code/luma_experience_gateway_legacy.py
            do
              if [[ -e "$path" ]]; then
                stat --printf="path=%n exists=true mode=%a owner=%U:%G bytes=%s modified=%y\n" "$path" 2>&1 || true
                sha256sum "$path" 2>&1 || true
              else
                echo "path=$path exists=false"
              fi
            done
            if [[ -x /opt/lumencore/.venv/bin/python ]]; then
              sudo -n -u lumencore env PYTHONDONTWRITEBYTECODE=1 \
                /opt/lumencore/.venv/bin/python --version 2>&1 || true
              sudo -n -u lumencore env PYTHONDONTWRITEBYTECODE=1 \
                /opt/lumencore/.venv/bin/python -c "import importlib.util; print(\"uvicorn_spec=\" + str(importlib.util.find_spec(\"uvicorn\") is not None)); print(\"fastapi_spec=\" + str(importlib.util.find_spec(\"fastapi\") is not None))" \
                2>&1 || true
            fi

            echo "=== gateway allowlisted failure signatures (redacted) ==="
            gateway_window=$(sudo -n journalctl -u luma-gateway --since "2 minutes ago" --no-pager -o cat 2>&1 || true)
            printf "journal_lines_last_2m=%s\n" "$(printf "%s\n" "$gateway_window" | wc -l)"
            printf "%s\n" "$gateway_window" \
              | grep -E "ModuleNotFoundError|ImportError|Error loading ASGI app|Could not import module|No module named|Traceback|Permission denied|No such file|Address already in use|already running|singleton|SyntaxError|NameError|TypeError|ValueError|FileNotFoundError|Exception|ERROR|Error:" \
              | sed -E \
                  -e "s/(Bearer )[A-Za-z0-9._~+\/=:-]+/\\1[REDACTED]/Ig" \
                  -e "s/(sk-[A-Za-z0-9_-]{4})[A-Za-z0-9_-]+/\\1[REDACTED]/g" \
                  -e "s/((API|ACCESS|AUTH|GITHUB|OPENAI|KRAKEN)_[A-Z0-9_]*(KEY|TOKEN|SECRET|PASSWORD)[A-Z0-9_]*=)[^[:space:]]+/\\1[REDACTED]/Ig" \
              | cut -c1-400 \
              | tail -n 80 \
              || true

            echo "=== expected listeners (address and port only) ==="
            ss -ltnH 2>&1 \
              | grep -E "(:80|:443|:1880|:5016|:5017|:7700|:7701|:8000|:8001|:8787)[[:space:]]" \
              || true

            echo "=== nginx configuration validation ==="
            sudo -n nginx -t 2>&1 || true

            echo "=== nginx gateway route summary (allowlisted directives only) ==="
            sudo -n nginx -T 2>&1 \
              | grep -E "^[[:space:]]*(upstream luma_gateway|server 127\\.0\\.0\\.1:8787;|location = /health|proxy_pass[[:space:]]+http://luma_gateway)" \
              | sed -E "s/^[[:space:]]+/ /" \
              || true

            echo "=== filesystem capacity ==="
            df -hP / /opt /var /home /tmp 2>&1 || true
            echo "=== filesystem inodes ==="
            df -iP / /opt /var /home /tmp 2>&1 || true
            echo "=== journal usage ==="
            sudo -n journalctl --disk-usage 2>&1 || true
            echo "=== largest subtrees by KiB ==="
            sudo -n du -x -k -d2 /var /opt /home/opc /tmp 2>/dev/null \
              | sort -n \
              | tail -n 160 \
              || true
            echo "=== densest subtrees by inode count ==="
            sudo -n du -x --inodes -d2 /var /opt /home/opc /tmp 2>/dev/null \
              | sort -n \
              | tail -n 160 \
              || true
            echo "=== largest regular files under mutable roots ==="
            sudo -n find /var /opt /home/opc /tmp -xdev -type f -printf "%s %p\n" 2>/dev/null \
              | sort -n \
              | tail -n 100 \
              || true
          ' | tee /tmp/lumencore-vps-runtime-diagnostic.txt

      - name: Upload runtime diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumencore-vps-runtime-${{ github.run_id }}
          path: /tmp/lumencore-vps-runtime-diagnostic.txt
          if-no-files-found: error
          retention-days: 7

      - name: Publish runtime diagnostic receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          case "$JOB_STATUS" in
            success)
              STATE=success
              DESCRIPTION="Read-only VPS runtime diagnostic completed"
              ;;
            cancelled)
              STATE=error
              DESCRIPTION="VPS runtime diagnostic was cancelled"
              ;;
            *)
              STATE=failure
              DESCRIPTION="VPS runtime diagnostic failed"
              ;;
          esac
          export STATE DESCRIPTION
          python3 - <<'PY' > /tmp/runtime-diagnostic-status.json
          import json, os
          print(json.dumps({
              "state": os.environ["STATE"],
              "target_url": os.environ["TARGET_URL"],
              "description": os.environ["DESCRIPTION"],
              "context": "diagnostic/lumencore-vps-runtime",
          }))
          PY
          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA" \
            --data-binary @/tmp/runtime-diagnostic-status.json
