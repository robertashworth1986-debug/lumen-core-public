name: Diagnose LumenCore VPS runtime and capacity

on:
  pull_request:
    paths:
      - '.github/workflows/vps-storage-diagnostic.yml'
      - 'tests/test_vps_runtime_diagnostic_workflow.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/vps-storage-diagnostic.yml'
      - 'tests/test_vps_runtime_diagnostic_workflow.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lumencore-vps-runtime-diagnostic
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install bounded test dependency
        run: python -m pip install --disable-pip-version-check pytest==9.1.0
      - name: Verify the read-only diagnostic contract
        run: python -m pytest -q tests/test_vps_runtime_diagnostic_workflow.py

  diagnose:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    needs: validate
    permissions:
      contents: read
      statuses: write

    steps:
      - name: Check out the exact diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Mark runtime diagnostic pending
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/runtime-diagnostic-status.json
          import json, os
          print(json.dumps({
              "state": "pending",
              "target_url": os.environ["TARGET_URL"],
              "description": "Read-only VPS runtime diagnostic is running",
              "context": "diagnostic/lumencore-vps-runtime",
          }))
          PY
          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA" \
            --data-binary @/tmp/runtime-diagnostic-status.json

      - name: Install SSH key
        uses: shimataro/ssh-key-action@87a8f067114a8ce263df83e9ed5c849953548bc3 # v2.8.1
        with:
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.VPS_KNOWN_HOSTS }}

      - name: Capture runtime, gateway, and capacity evidence
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes "opc@${{ secrets.VPS_HOST }}" '
            set -u
            probe() {
              local name="$1"
              local url="$2"
              local rc=0
              local result
              result=$(curl --silent --show-error --location --max-redirs 3 \
                --connect-timeout 5 --max-time 10 --output /dev/null \
                --write-out "code=%{http_code} remote=%{remote_ip} connect_s=%{time_connect} total_s=%{time_total} content_type=%{content_type}" \
                "$url" 2>&1) || rc=$?
              printf "%s rc=%s %s\n" "$name" "$rc" "$result"
            }

            probe_loopback_tls() {
              local name="$1"
              local path="$2"
              local rc=0
              local result
              result=$(curl --silent --show-error --max-redirs 0 \
                --noproxy lumen-core.ai \
                --resolve "lumen-core.ai:443:127.0.0.1" \
                --connect-timeout 5 --max-time 10 --output /dev/null \
                --write-out "code=%{http_code} remote=%{remote_ip} connect_s=%{time_connect} total_s=%{time_total} content_type=%{content_type}" \
                "https://lumen-core.ai$path" 2>&1) || rc=$?
              printf "%s rc=%s %s\n" "$name" "$rc" "$result"
            }

            show_unit() {
              local unit="$1"
              echo "--- $unit ---"
              printf "active="
              systemctl is-active "$unit" 2>&1 || true
              printf "enabled="
              systemctl is-enabled "$unit" 2>&1 || true
              systemctl show "$unit" --no-pager \
                --property=LoadState \
                --property=ActiveState \
                --property=SubState \
                --property=Result \
                --property=ExecMainCode \
                --property=ExecMainStatus \
                --property=NRestarts \
                --property=Restart \
                --property=RestartUSec \
                --property=StartLimitBurst \
                --property=StartLimitIntervalUSec \
                --property=ExecMainStartTimestamp \
                --property=StateChangeTimestamp \
                --property=User \
                --property=Group \
                --property=WorkingDirectory \
                --property=ExecStart \
                --property=MainPID \
                --property=FragmentPath \
                2>&1 || true
            }

            show_process_identity() {
              local label="$1"
              local pid="$2"
              local expected_marker="$3"
              local cmdline=""
              echo "--- $label pid=$pid ---"
              if ! [[ "$pid" =~ ^[1-9][0-9]*$ ]]; then
                echo "valid_pid=false"
                return
              fi
              # An unprivileged kill -0 returns EPERM for a root-owned process,
              # which proves neither absence nor death. /proc is the read-only
              # process-existence boundary for this diagnostic.
              if [[ ! -d "/proc/$pid" ]]; then
                echo "process_exists=false"
                return
              fi
              echo "process_exists=true"
              ps -p "$pid" -o pid=,ppid=,etimes=,stat=,comm= 2>&1 || true
              if [[ -r "/proc/$pid/cmdline" ]]; then
                echo "identity_readable=true"
                cmdline=$(tr "\\000" " " < "/proc/$pid/cmdline" 2>/dev/null || true)
              else
                echo "identity_readable=false"
              fi
              if [[ ! -r "/proc/$pid/cmdline" ]]; then
                echo "expected_identity=unknown"
              elif [[ -n "$cmdline" && "$cmdline" == *"$expected_marker"* ]]; then
                echo "expected_identity=true"
              else
                echo "expected_identity=false"
              fi
              if [[ -r "/proc/$pid/exe" ]]; then
                printf "executable="
                readlink "/proc/$pid/exe" 2>&1 || true
              fi
              if [[ -r "/proc/$pid/cwd" ]]; then
                printf "working_directory="
                readlink "/proc/$pid/cwd" 2>&1 || true
              fi
            }

            show_allowlisted_failure_signatures() {
              local unit="$1"
              local since="$2"
              local max_lines="$3"
              local journal_window=""

              case "$unit" in
                luma-gateway|luma-paper-ticker|luma-symbol-awareness) ;;
                *)
                  echo "refused_unapproved_journal_unit=$unit"
                  return 2
                  ;;
              esac

              echo "--- $unit failures since $since ---"
              journal_window=$(sudo -n journalctl -u "$unit" --since "$since" --no-pager -o cat 2>&1 || true)
              printf "journal_lines_in_window=%s\n" "$(printf "%s\n" "$journal_window" | wc -l)"
              printf "%s\n" "$journal_window" \
                | grep -E "ModuleNotFoundError|ImportError|Error loading ASGI app|Could not import module|No module named|Traceback|Permission denied|PermissionError|No such file|Address already in use|already running|singleton|SyntaxError|NameError|TypeError|ValueError|KeyError|AttributeError|RuntimeError|SystemExit|OSError|FileNotFoundError|ConnectionError|TimeoutError|AssertionError|Exception|ERROR|Error:|Main process exited|Failed with result|Start request repeated too quickly|Failed at step" \
                | sed -E \
                    -e "s/(Bearer )[A-Za-z0-9._~+\/=:-]+/\\1[REDACTED]/Ig" \
                    -e "s/(sk-[A-Za-z0-9_-]{4})[A-Za-z0-9_-]+/\\1[REDACTED]/g" \
                    -e "s/((API|ACCESS|AUTH|GITHUB|OPENAI|KRAKEN)_[A-Z0-9_]*(KEY|TOKEN|SECRET|PASSWORD)[A-Z0-9_]*=)[^[:space:]]+/\\1[REDACTED]/Ig" \
                    -e "s#(https?://)[^/@[:space:]]+@#\\1[REDACTED]@#Ig" \
                    -e "s/([?&](api_?key|access_?token|auth|password|secret)=)[^&[:space:]]+/\\1[REDACTED]/Ig" \
                | cut -c1-400 \
                | tail -n "$max_lines" \
                || true
            }

            show_allowlisted_path_access() {
              local label="$1"
              local path="$2"

              case "$path" in
                /opt/lumencore|/opt/lumencore/out|/opt/lumencore/out/execution|/opt/lumencore/out/execution/multi_exchange_paper_ticker_ledger.jsonl) ;;
                *)
                  echo "refused_unapproved_access_path=$label"
                  return 2
                  ;;
              esac

              echo "--- $label ---"
              if [[ -L "$path" ]]; then
                echo "symlink=true"
              else
                echo "symlink=false"
              fi
              if [[ -e "$path" ]]; then
                stat --printf="exists=true type=%F mode=%a owner=%U group=%G bytes=%s modified=%y\n" "$path" 2>&1 || true
              else
                echo "exists=false"
              fi
              for permission in e r w x; do
                if sudo -n -u lumencore test "-$permission" "$path" 2>/dev/null; then
                  echo "lumencore_test_$permission=true"
                else
                  echo "lumencore_test_$permission=false"
                fi
              done
            }

            echo "=== identity ==="
            id
            hostname
            date -u +"%Y-%m-%dT%H:%M:%SZ"

            echo "=== public and loopback endpoint probes (status only; no bodies) ==="
            probe public_root https://lumen-core.ai/
            probe public_nginx_health https://lumen-core.ai/nginx-health
            probe public_gateway_health https://lumen-core.ai/health
            probe public_gateway_snapshot https://lumen-core.ai/api/snapshot
            probe_loopback_tls loopback_nginx_health /nginx-health
            probe_loopback_tls loopback_gateway_via_nginx /health
            probe loopback_gateway_direct http://127.0.0.1:8787/health

            echo "=== canonical and related service states ==="
            for unit in \
              nginx \
              caddy \
              luma-gateway \
              luma-dashboard-refresh \
              luma-paper-ticker \
              luma-symbol-awareness \
              luma-kraken-history \
              luma-dashboard \
              luma-intel-api \
              luma-node-red \
              luma-nodered-flow-sync \
              lamascout-api \
              lamascout-loop
            do
              show_unit "$unit"
            done

            echo "=== discovered LumenCore service units ==="
            systemctl list-units --all --type=service --no-legend \
              "luma*.service" "lumencore*.service" "lamascout*.service" \
              2>&1 || true

            echo "=== gateway singleton-lock identity ==="
            gateway_main_pid=$(systemctl show luma-gateway --property=MainPID --value 2>/dev/null || true)
            show_process_identity gateway_systemd_main "$gateway_main_pid" "luma_experience_gateway:app"
            gateway_lock=/opt/lumencore/run/luma_experience_gateway.lock
            if [[ -f "$gateway_lock" ]]; then
              echo "lock_exists=true"
              stat --printf="lock_mode=%a lock_owner=%U:%G lock_bytes=%s lock_modified=%y\n" "$gateway_lock" 2>&1 || true
              gateway_lock_pid=$(tr -cd "0-9" < "$gateway_lock" 2>/dev/null | head -c 20 || true)
              echo "lock_pid=$gateway_lock_pid"
              if [[ -n "$gateway_main_pid" && "$gateway_lock_pid" == "$gateway_main_pid" ]]; then
                echo "lock_pid_matches_systemd_main=true"
              else
                echo "lock_pid_matches_systemd_main=false"
              fi
              show_process_identity gateway_lock_owner "$gateway_lock_pid" "luma_experience_gateway:app"
            else
              echo "lock_exists=false"
            fi

            echo "=== gateway executable and source preflight ==="
            for path in \
              /opt/lumencore/.venv/bin/python \
              /opt/lumencore/code/luma_experience_gateway.py \
              /opt/lumencore/code/luma_experience_gateway_legacy.py
            do
              if [[ -e "$path" ]]; then
                stat --printf="path=%n exists=true mode=%a owner=%U:%G bytes=%s modified=%y\n" "$path" 2>&1 || true
                sha256sum "$path" 2>&1 || true
              else
                echo "path=$path exists=false"
              fi
            done
            if [[ -x /opt/lumencore/.venv/bin/python ]]; then
              sudo -n -u lumencore env PYTHONDONTWRITEBYTECODE=1 \
                /opt/lumencore/.venv/bin/python --version 2>&1 || true
              sudo -n -u lumencore env PYTHONDONTWRITEBYTECODE=1 \
                /opt/lumencore/.venv/bin/python -c "import importlib.util; print(\"uvicorn_spec=\" + str(importlib.util.find_spec(\"uvicorn\") is not None)); print(\"fastapi_spec=\" + str(importlib.util.find_spec(\"fastapi\") is not None))" \
                2>&1 || true
            fi

            echo "=== paper ticker output-path access (metadata only) ==="
            show_allowlisted_path_access stack_root /opt/lumencore
            show_allowlisted_path_access output_root /opt/lumencore/out
            show_allowlisted_path_access execution_output /opt/lumencore/out/execution
            show_allowlisted_path_access paper_ticker_ledger /opt/lumencore/out/execution/multi_exchange_paper_ticker_ledger.jsonl

            echo "=== runtime allowlisted failure signatures (redacted) ==="
            show_allowlisted_failure_signatures luma-gateway "2 minutes ago" 80
            show_allowlisted_failure_signatures luma-paper-ticker "5 minutes ago" 80
            show_allowlisted_failure_signatures luma-symbol-awareness "5 minutes ago" 80

            echo "=== expected listeners (address and port only) ==="
            ss -ltnH 2>&1 \
              | grep -E "(:80|:443|:1880|:5016|:5017|:7700|:7701|:8000|:8001|:8787)[[:space:]]" \
              || true

            echo "=== nginx configuration validation ==="
            sudo -n nginx -t 2>&1 || true

            echo "=== nginx gateway route summary (allowlisted directives only) ==="
            sudo -n nginx -T 2>&1 \
              | grep -E "^[[:space:]]*(upstream luma_gateway|server 127\\.0\\.0\\.1:8787;|location = /health|proxy_pass[[:space:]]+http://luma_gateway)" \
              | sed -E "s/^[[:space:]]+/ /" \
              || true

            echo "=== filesystem capacity ==="
            df -hP / /opt /var /home /tmp 2>&1 || true
            echo "=== filesystem inodes ==="
            df -iP / /opt /var /home /tmp 2>&1 || true
            echo "=== journal usage ==="
            sudo -n journalctl --disk-usage 2>&1 || true
            echo "=== largest subtrees by KiB ==="
            sudo -n du -x -k -d2 /var /opt /home/opc /tmp 2>/dev/null \
              | sort -n \
              | tail -n 160 \
              || true
            echo "=== densest subtrees by inode count ==="
            sudo -n du -x --inodes -d2 /var /opt /home/opc /tmp 2>/dev/null \
              | sort -n \
              | tail -n 160 \
              || true
            echo "=== largest regular files under mutable roots ==="
            sudo -n find /var /opt /home/opc /tmp -xdev -type f -printf "%s %p\n" 2>/dev/null \
              | sort -n \
              | tail -n 100 \
              || true
          ' | tee /tmp/lumencore-vps-runtime-diagnostic.txt

      - name: Compare the approved gateway closure with the VPS
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          repair_script=code/ops/REPAIR_GATEWAY_PUBLIC_CONTRACT_ON_VPS.sh
          expected_manifest=/tmp/lumencore-approved-gateway-closure.txt
          mapfile -t files < <(bash "$repair_script" --print-files)
          [[ "${#files[@]}" -eq 20 ]]
          : > "$expected_manifest"
          for relative in "${files[@]}"; do
            [[ "$relative" =~ ^[A-Za-z0-9_./-]+\.py$ ]]
            [[ -f "code/$relative" && ! -L "code/$relative" ]]
            printf '%s  %s\n' "$(sha256sum "code/$relative" | awk '{print $1}')" "$relative" \
              >> "$expected_manifest"
          done
          approved_bundle_sha=$(
            LUMENCORE_GATEWAY_SOURCE_ROOT=code \
              bash "$repair_script" --bundle-sha
          )
          [[ "$approved_bundle_sha" =~ ^[0-9a-f]{64}$ ]]
          [[ "$approved_bundle_sha" == "$(sha256sum "$expected_manifest" | awk '{print $1}')" ]]

          {
            printf '\n=== approved gateway closure comparison ===\n'
            printf 'source_commit=%s\n' "$SOURCE_COMMIT"
            printf 'approved_gateway_bundle_sha256=%s\n' "$approved_bundle_sha"
            printf 'expected_file_count=%s\n' "${#files[@]}"
          } | tee -a /tmp/lumencore-vps-runtime-diagnostic.txt

          {
            cat <<'REMOTE_SCRIPT'
          set -euo pipefail
          target_root=/opt/lumencore/code
          closure_match_count=0
          closure_mismatch_count=0
          closure_missing_count=0
          closure_symbolic_count=0
          closure_unreadable_count=0

          audit_gateway_file() {
            local expected_sha="$1"
            local relative="$2"
            local target="$target_root/$relative"
            local resolved
            local actual_sha
            resolved=$(realpath -m -- "$target")
            [[ "$resolved" == "$target_root/"* ]]
            if [[ -L "$target" ]]; then
              printf 'closure_file status=symbolic expected_sha256=%s path=%s\n' \
                "$expected_sha" "$relative"
              closure_symbolic_count=$((closure_symbolic_count + 1))
            elif [[ ! -f "$target" ]]; then
              printf 'closure_file status=missing expected_sha256=%s path=%s\n' \
                "$expected_sha" "$relative"
              closure_missing_count=$((closure_missing_count + 1))
            elif ! actual_sha=$(sha256sum "$target" 2>/dev/null | awk '{print $1}'); then
              printf 'closure_file status=unreadable expected_sha256=%s path=%s\n' \
                "$expected_sha" "$relative"
              closure_unreadable_count=$((closure_unreadable_count + 1))
            elif [[ "$actual_sha" == "$expected_sha" ]]; then
              printf 'closure_file status=match expected_sha256=%s actual_sha256=%s path=%s\n' \
                "$expected_sha" "$actual_sha" "$relative"
              closure_match_count=$((closure_match_count + 1))
            else
              printf 'closure_file status=mismatch expected_sha256=%s actual_sha256=%s path=%s\n' \
                "$expected_sha" "$actual_sha" "$relative"
              closure_mismatch_count=$((closure_mismatch_count + 1))
            fi
          }
          REMOTE_SCRIPT
            while read -r expected_sha relative; do
              printf 'audit_gateway_file %q %q\n' "$expected_sha" "$relative"
            done < "$expected_manifest"
            cat <<'REMOTE_SCRIPT'
          printf 'closure_match_count=%s\n' "$closure_match_count"
          printf 'closure_mismatch_count=%s\n' "$closure_mismatch_count"
          printf 'closure_missing_count=%s\n' "$closure_missing_count"
          printf 'closure_symbolic_count=%s\n' "$closure_symbolic_count"
          printf 'closure_unreadable_count=%s\n' "$closure_unreadable_count"
          REMOTE_SCRIPT
          } | ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes \
            "opc@$VPS_HOST" 'bash -s' \
            | tee -a /tmp/lumencore-vps-runtime-diagnostic.txt

      - name: Upload runtime diagnostic
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lumencore-vps-runtime-${{ github.run_id }}
          path: /tmp/lumencore-vps-runtime-diagnostic.txt
          if-no-files-found: error
          retention-days: 7

      - name: Publish runtime diagnostic receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          case "$JOB_STATUS" in
            success)
              STATE=success
              DESCRIPTION="Read-only VPS runtime diagnostic completed"
              ;;
            cancelled)
              STATE=error
              DESCRIPTION="VPS runtime diagnostic was cancelled"
              ;;
            *)
              STATE=failure
              DESCRIPTION="VPS runtime diagnostic failed"
              ;;
          esac
          export STATE DESCRIPTION
          python3 - <<'PY' > /tmp/runtime-diagnostic-status.json
          import json, os
          print(json.dumps({
              "state": os.environ["STATE"],
              "target_url": os.environ["TARGET_URL"],
              "description": os.environ["DESCRIPTION"],
              "context": "diagnostic/lumencore-vps-runtime",
          }))
          PY
          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA" \
            --data-binary @/tmp/runtime-diagnostic-status.json
