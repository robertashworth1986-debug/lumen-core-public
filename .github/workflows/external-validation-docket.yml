name: External validation authority docket

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".gitattributes"
      - ".gitignore"
      - ".github/workflows/external-validation-docket.yml"
      - ".github/workflows/reviewer-reproducibility.yml"
      - "code/ops/BUILD_EXTERNAL_VALIDATION_AUTHORITY_DOCKET.py"
      - "code/ops/RUN_REVIEWER_REPRODUCIBILITY_CAPSULE.py"
      - "code/ops/VERIFY_REVIEWER_DEPENDENCY_LOCK.py"
      - "code/ops/VERIFY_EXTERNAL_EVALUATOR_ACCEPTANCE.py"
      - "config/external_validation_authority_docket_v1.json"
      - "config/external_evaluator_acceptance_template_v1.json"
      - "config/eia_grid_prospective_hybrid_router_protocol_v1.json"
      - "config/reviewer_reproducibility_protocol_v1.json"
      - "dashboard/data/reviewer_reproducibility_capsule.json"
      - "docs/EIA_GRID_PROSPECTIVE_HYBRID_ROUTER_2026-07-13.md"
      - "docs/EIA_GRID_PROSPECTIVE_ROUTER_OPERATIONS_2026-07-13.md"
      - "docs/REVIEWER_START_HERE.md"
      - "docs/EXTERNAL_EVALUATOR_ACCEPTANCE_HANDOFF_2026-07-14.md"
      - "docs/EXTERNAL_VALIDATION_AUTHORITY_DOCKET_2026-07-14.md"
      - "docs/FIELD_VALIDATION_BUYER_PILOT_PACKET_2026-06-25.md"
      - "docs/REVIEWER_REPRODUCIBILITY_CAPSULE_2026-07-14.md"
      - "evidence/external_validation/eia_grid_prospective_runtime_projection_20260714.json"
      - "evidence/external_validation/**"
      - "evidence/reproducibility/github_run_29378633693/**"
      - "requirements-reviewer.txt"
      - "requirements-reviewer-ubuntu-py311.lock"
      - "tests/test_external_validation_authority_docket.py"
      - "tests/test_external_evaluator_acceptance.py"
      - "tests/test_github_workflow_governance.py"
      - "tests/test_reviewer_dependency_lock.py"
      - "tests/test_reviewer_reproducibility_capsule.py"
  push:
    paths:
      - ".gitattributes"
      - ".gitignore"
      - ".github/workflows/external-validation-docket.yml"
      - ".github/workflows/reviewer-reproducibility.yml"
      - "code/ops/BUILD_EXTERNAL_VALIDATION_AUTHORITY_DOCKET.py"
      - "code/ops/RUN_REVIEWER_REPRODUCIBILITY_CAPSULE.py"
      - "code/ops/VERIFY_REVIEWER_DEPENDENCY_LOCK.py"
      - "code/ops/VERIFY_EXTERNAL_EVALUATOR_ACCEPTANCE.py"
      - "config/external_validation_authority_docket_v1.json"
      - "config/external_evaluator_acceptance_template_v1.json"
      - "config/eia_grid_prospective_hybrid_router_protocol_v1.json"
      - "config/reviewer_reproducibility_protocol_v1.json"
      - "dashboard/data/reviewer_reproducibility_capsule.json"
      - "docs/EIA_GRID_PROSPECTIVE_HYBRID_ROUTER_2026-07-13.md"
      - "docs/EIA_GRID_PROSPECTIVE_ROUTER_OPERATIONS_2026-07-13.md"
      - "docs/REVIEWER_START_HERE.md"
      - "docs/EXTERNAL_EVALUATOR_ACCEPTANCE_HANDOFF_2026-07-14.md"
      - "docs/EXTERNAL_VALIDATION_AUTHORITY_DOCKET_2026-07-14.md"
      - "docs/FIELD_VALIDATION_BUYER_PILOT_PACKET_2026-06-25.md"
      - "docs/REVIEWER_REPRODUCIBILITY_CAPSULE_2026-07-14.md"
      - "evidence/external_validation/eia_grid_prospective_runtime_projection_20260714.json"
      - "evidence/external_validation/**"
      - "evidence/reproducibility/github_run_29378633693/**"
      - "requirements-reviewer.txt"
      - "requirements-reviewer-ubuntu-py311.lock"
      - "tests/test_external_validation_authority_docket.py"
      - "tests/test_external_evaluator_acceptance.py"
      - "tests/test_github_workflow_governance.py"
      - "tests/test_reviewer_dependency_lock.py"
      - "tests/test_reviewer_reproducibility_capsule.py"

permissions:
  contents: read

concurrency:
  group: external-validation-docket-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-docket:
    name: Verify archived receipt and authority gates
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONHASHSEED: "0"
      TZ: UTC

    steps:
      - name: Check out the reviewed source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install the pinned Python runtime
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.9"

      - name: Install the docket test runner
        run: python -m pip install --disable-pip-version-check pytest==9.1.0

      - name: Verify the archived clean-runner bundle and authority gates
        run: |
          python code/ops/VERIFY_EXTERNAL_EVALUATOR_ACCEPTANCE.py --expect-template
          python code/ops/BUILD_EXTERNAL_VALIDATION_AUTHORITY_DOCKET.py --check-only
          python -m pytest -q tests/test_external_evaluator_acceptance.py tests/test_external_validation_authority_docket.py tests/test_github_workflow_governance.py
