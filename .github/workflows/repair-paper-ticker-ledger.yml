name: Repair exact paper-ticker ledger ownership on VPS

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Full main-branch commit SHA selected for paper-ticker recovery
        required: true
        type: string
      approval:
        description: Explicit production paper-ticker recovery gate
        required: true
        type: choice
        default: HOLD
        options:
          - HOLD
          - REPAIR_PAPER_TICKER_LEDGER_OWNERSHIP

permissions:
  contents: read

concurrency:
  group: lumencore-production-paper-ticker
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      source_commit: ${{ steps.gate.outputs.source_commit }}
    steps:
      - name: Fail closed unless this exact workflow commit is approved
        id: gate
        shell: bash
        env:
          APPROVAL: ${{ inputs.approval }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          WORKFLOW_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$EVENT_NAME" == "workflow_dispatch" ]]
          [[ "$APPROVAL" == "REPAIR_PAPER_TICKER_LEDGER_OWNERSHIP" ]]
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_COMMIT" == "$WORKFLOW_COMMIT" ]]
          printf 'source_commit=%s\n' "$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"

  repair:
    needs: authorize
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
    env:
      RELEASE_COMMIT: ${{ needs.authorize.outputs.source_commit }}
      REMOTE_STAGE: /tmp/lumencore-paper-ticker-repair-${{ github.run_id }}-${{ github.run_attempt }}
      EXPECTED_LEDGER_SHA: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
      EXPECTED_LEDGER_OWNER: opc
      EXPECTED_LEDGER_GROUP: opc
      EXPECTED_LEDGER_MODE: '644'

    steps:
      - name: Checkout the approved commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.authorize.outputs.source_commit }}

      - name: Require the approved commit to be current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          [[ "$(git rev-parse HEAD)" == "$RELEASE_COMMIT" ]]
          [[ "$(git rev-parse origin/main)" == "$RELEASE_COMMIT" ]]

      - name: Package the exact repair script
        id: package
        shell: bash
        run: |
          set -euo pipefail
          package_root=/tmp/paper-ticker-repair
          install -d -m 0700 "$package_root"
          source_script=code/ops/REPAIR_PAPER_TICKER_LEDGER_ON_VPS.sh
          [[ -f "$source_script" && ! -L "$source_script" ]]
          install -m 0755 "$source_script" "$package_root/REPAIR_PAPER_TICKER_LEDGER_ON_VPS.sh"
          script_sha=$(sha256sum "$package_root/REPAIR_PAPER_TICKER_LEDGER_ON_VPS.sh" | awk '{print $1}')
          [[ "$script_sha" =~ ^[0-9a-f]{64}$ ]]
          {
            printf 'source_commit=%s\n' "$RELEASE_COMMIT"
            printf 'repair_script_sha256=%s\n' "$script_sha"
            printf 'expected_ledger_sha256=%s\n' "$EXPECTED_LEDGER_SHA"
            printf 'expected_ledger_metadata=%s:%s:%s\n' \
              "$EXPECTED_LEDGER_OWNER" "$EXPECTED_LEDGER_GROUP" "$EXPECTED_LEDGER_MODE"
          } > "$package_root/paper-ticker-repair-manifest.txt"
          printf 'script_sha=%s\n' "$script_sha" >> "$GITHUB_OUTPUT"

      - name: Stage private HumanUnlock without printing it
        shell: bash
        env:
          HUMAN_UNLOCK: ${{ secrets.LUMA_HUMAN_UNLOCK_TOKEN }}
        run: |
          set -euo pipefail
          [[ ${#HUMAN_UNLOCK} -ge 32 ]]
          install -m 0600 /dev/null /tmp/paper-ticker-repair/human-unlock
          printf '%s' "$HUMAN_UNLOCK" > /tmp/paper-ticker-repair/human-unlock
          unset HUMAN_UNLOCK

      - name: Install SSH key
        uses: shimataro/ssh-key-action@87a8f067114a8ce263df83e9ed5c849953548bc3 # v2.8.1
        with:
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.VPS_KNOWN_HOSTS }}

      - name: Verify bounded remote prerequisites
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes "opc@$VPS_HOST" '
            set -eu
            sudo -n true
            sudo -n test -f /opt/lumencore/out/execution/multi_exchange_paper_ticker_ledger.jsonl
            sudo -n systemctl cat luma-paper-ticker >/dev/null
            for command_name in systemctl journalctl stat sha256sum realpath install mktemp; do
              command -v "$command_name" >/dev/null
            done
          '

      - name: Upload bounded paper-ticker repair package
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          [[ "$REMOTE_STAGE" =~ ^/tmp/lumencore-paper-ticker-repair-[0-9]+-[0-9]+$ ]]
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "opc@$VPS_HOST" \
            "test ! -e '$REMOTE_STAGE' && install -d -m 0700 '$REMOTE_STAGE'"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes \
            /tmp/paper-ticker-repair/REPAIR_PAPER_TICKER_LEDGER_ON_VPS.sh \
            /tmp/paper-ticker-repair/paper-ticker-repair-manifest.txt \
            /tmp/paper-ticker-repair/human-unlock \
            "opc@$VPS_HOST:$REMOTE_STAGE/"

      - name: Apply exact ledger repair with rollback
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          SCRIPT_SHA: ${{ steps.package.outputs.script_sha }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "opc@$VPS_HOST" \
            "set -eu
             [[ '$REMOTE_STAGE' =~ ^/tmp/lumencore-paper-ticker-repair-[0-9]+-[0-9]+$ ]]
             sudo -n env \
               LUMENCORE_HUMAN_UNLOCK_FILE='$REMOTE_STAGE/human-unlock' \
               LUMENCORE_PAPER_REPAIR_SOURCE_COMMIT='$RELEASE_COMMIT' \
               LUMENCORE_EXPECTED_PAPER_REPAIR_SCRIPT_SHA256='$SCRIPT_SHA' \
               LUMENCORE_EXPECTED_PAPER_LEDGER_SHA256='$EXPECTED_LEDGER_SHA' \
               LUMENCORE_EXPECTED_PAPER_LEDGER_OWNER='$EXPECTED_LEDGER_OWNER' \
               LUMENCORE_EXPECTED_PAPER_LEDGER_GROUP='$EXPECTED_LEDGER_GROUP' \
               LUMENCORE_EXPECTED_PAPER_LEDGER_MODE='$EXPECTED_LEDGER_MODE' \
               bash '$REMOTE_STAGE/REPAIR_PAPER_TICKER_LEDGER_ON_VPS.sh' --apply" \
            | tee /tmp/paper-ticker-repair/paper-ticker-repair-receipt.txt

      - name: Verify exact post-repair contract
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "opc@$VPS_HOST" '
            set -eu
            [[ "$(systemctl is-active luma-paper-ticker)" == "active" ]]
            [[ "$(stat -c "%U:%G:%a:%h" /opt/lumencore/out/execution/multi_exchange_paper_ticker_ledger.jsonl)" == "lumencore:lumencore:640:1" ]]
            sudo -n -u lumencore test -w /opt/lumencore/out/execution/multi_exchange_paper_ticker_ledger.jsonl
          ' > /tmp/paper-ticker-repair/post-repair-verification.txt

      - name: Remove local private unlock staging
        if: always()
        shell: bash
        run: rm -f -- /tmp/paper-ticker-repair/human-unlock

      - name: Remove remote repair staging
        if: always()
        continue-on-error: true
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          [[ "$REMOTE_STAGE" =~ ^/tmp/lumencore-paper-ticker-repair-[0-9]+-[0-9]+$ ]]
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "opc@$VPS_HOST" \
            "resolved=\$(realpath -m -- '$REMOTE_STAGE'); \
             [[ \"\$resolved\" =~ ^/tmp/lumencore-paper-ticker-repair-[0-9]+-[0-9]+$ ]]; \
             rm -rf -- \"\$resolved\""

      - name: Upload bounded repair receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paper-ticker-repair-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/paper-ticker-repair/paper-ticker-repair-manifest.txt
            /tmp/paper-ticker-repair/paper-ticker-repair-receipt.txt
            /tmp/paper-ticker-repair/post-repair-verification.txt
          if-no-files-found: warn
          retention-days: 30
