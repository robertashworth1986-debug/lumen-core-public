name: Evidence route repair CI

on:
  pull_request:
    paths:
      - '.github/workflows/evidence-route-repair-ci.yml'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/deploy-public-site-release.yml'
      - 'code/ops/repair_evidence_route.py'
      - 'code/ops/REPAIR_EVIDENCE_ROUTE_ON_VPS.sh'
      - 'code/ops/repair_public_security_headers.py'
      - 'code/ops/REPAIR_PUBLIC_SECURITY_HEADERS_ON_VPS.sh'
      - 'code/deploy/nginx/lumatrader.conf'
      - '.github/workflows/repair-public-security-headers.yml'
      - 'dashboard/evidence/index_bounded.html'
      - 'docs/EVIDENCE_ROUTE_RECOVERY.md'
      - 'tests/test_repair_evidence_route.py'
      - 'tests/test_public_security_headers.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/evidence-route-repair-ci.yml'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/deploy-public-site-release.yml'
      - 'code/ops/repair_evidence_route.py'
      - 'code/ops/REPAIR_EVIDENCE_ROUTE_ON_VPS.sh'
      - 'code/ops/repair_public_security_headers.py'
      - 'code/ops/REPAIR_PUBLIC_SECURITY_HEADERS_ON_VPS.sh'
      - 'code/deploy/nginx/lumatrader.conf'
      - '.github/workflows/repair-public-security-headers.yml'
      - 'dashboard/evidence/index_bounded.html'
      - 'docs/EVIDENCE_ROUTE_RECOVERY.md'
      - 'tests/test_repair_evidence_route.py'
      - 'tests/test_public_security_headers.py'

permissions:
  contents: read

jobs:
  bounded-route-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compile repair utility and tests
        run: |
          set -euo pipefail
          python3 -m py_compile \
            code/ops/repair_evidence_route.py \
            code/ops/repair_public_security_headers.py \
            tests/test_repair_evidence_route.py \
            tests/test_public_security_headers.py

      - name: Validate wrapper syntax
        run: |
          set -euo pipefail
          bash -n code/ops/REPAIR_EVIDENCE_ROUTE_ON_VPS.sh
          bash -n code/ops/REPAIR_PUBLIC_SECURITY_HEADERS_ON_VPS.sh

      - name: Run focused unit tests
        run: |
          set -euo pipefail
          python3 -m unittest discover \
            -s tests \
            -p 'test_repair_evidence_route.py' \
            -v
          python3 -m unittest discover \
            -s tests \
            -p 'test_public_security_headers.py' \
            -v

      - name: Verify canonical public-page contract
        run: |
          set -euo pipefail
          PAGE=dashboard/evidence/index_bounded.html
          test -s "$PAGE"
          grep -Fq 'name="lumencore-surface" content="proof-to-pilot-evidence-v1"' "$PAGE"
          grep -Fq 'One proof path. One bounded decision.' "$PAGE"
          grep -Fq 'internal simulation, replay, benchmark, and hash records are not external validation' "$PAGE"
          ! grep -Fq 'Open Quant Lab' "$PAGE"
          ! grep -Fq 'Open Approval Hub' "$PAGE"
          ! grep -Fq 'Undeniable Evidence' "$PAGE"

      - name: Verify production deployment remains fail closed
        run: |
          set -euo pipefail
          grep -Fq -- '--apply' code/ops/REPAIR_EVIDENCE_ROUTE_ON_VPS.sh
          grep -Fq 'nginx -t' code/ops/REPAIR_EVIDENCE_ROUTE_ON_VPS.sh
          grep -Fq 'Rolling back nginx configuration' code/ops/REPAIR_EVIDENCE_ROUTE_ON_VPS.sh
          grep -Fq 'proof-to-pilot-evidence-v1' code/ops/REPAIR_EVIDENCE_ROUTE_ON_VPS.sh
          grep -Fq 'concurrency:' .github/workflows/deploy.yml
          grep -Fq 'VERIFY_PUBLIC_SITE_LIVE_RELEASE.py' .github/workflows/deploy.yml
          grep -Fq 'deploy-public-site-release.yml' .github/workflows/deploy.yml
          ! grep -Fq 'VPS_SSH_PRIVATE_KEY' .github/workflows/deploy.yml
          ! grep -Fq 'REPAIR_EVIDENCE_ROUTE_ON_VPS.sh --apply' .github/workflows/deploy.yml
          ! grep -Fq 'rsync' .github/workflows/deploy.yml
          grep -Fq 'workflow_dispatch:' .github/workflows/deploy-public-site-release.yml
          grep -Fq 'DEPLOY_PUBLIC_SITE_EXACT_SNAPSHOT' .github/workflows/deploy-public-site-release.yml
          grep -Fq 'APPLY_PUBLIC_SITE_RELEASE_ON_VPS.sh' .github/workflows/deploy-public-site-release.yml
          grep -Fq 'workflow_dispatch:' .github/workflows/repair-public-security-headers.yml
          grep -Fq 'APPLY_PUBLIC_SECURITY_HEADERS' .github/workflows/repair-public-security-headers.yml
          grep -Fq 'nginx -t' code/ops/REPAIR_PUBLIC_SECURITY_HEADERS_ON_VPS.sh
          grep -Fq 'Rolling back Nginx configuration' code/ops/REPAIR_PUBLIC_SECURITY_HEADERS_ON_VPS.sh
          ! grep -Fq 'push:' .github/workflows/repair-public-security-headers.yml
