name: Evidence Graph Gate

on:
  pull_request:
    paths:
      - "README.md"
      - "EVIDENCE_INDEX.md"
      - "config/evidence_graph_v1.json"
      - "code/ops/VERIFY_EVIDENCE_GRAPH.py"
      - "tests/test_evidence_graph.py"
      - "docs/MACHINE_EVIDENCE_GRAPH.md"
      - "docs/PR_CONSOLIDATION_MAP_2026-07-22.md"
      - ".github/workflows/evidence-graph.yml"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "EVIDENCE_INDEX.md"
      - "config/evidence_graph_v1.json"
      - "code/ops/VERIFY_EVIDENCE_GRAPH.py"
      - "tests/test_evidence_graph.py"
      - "docs/MACHINE_EVIDENCE_GRAPH.md"
      - "docs/PR_CONSOLIDATION_MAP_2026-07-22.md"
      - ".github/workflows/evidence-graph.yml"

permissions:
  contents: read

concurrency:
  group: evidence-graph-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Compile verifier and tests
        run: python -m py_compile code/ops/VERIFY_EVIDENCE_GRAPH.py tests/test_evidence_graph.py
      - name: Verify graph and reviewer navigation contract
        run: |
          mkdir -p out/evidence-graph
          python code/ops/VERIFY_EVIDENCE_GRAPH.py --json \
            | tee out/evidence-graph/evidence-graph-verification.json
          python -m json.tool out/evidence-graph/evidence-graph-verification.json >/dev/null
      - name: Run adversarial regression tests
        run: python -m unittest discover -s tests -p "test_evidence_graph.py" -v
      - name: Upload verification receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-graph-verification-${{ github.sha }}
          path: out/evidence-graph/evidence-graph-verification.json
          if-no-files-found: error
          retention-days: 30
