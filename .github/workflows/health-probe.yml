name: 🔍 Site Health Probe

on:
  schedule:
    # Survival mode: one preservation snapshot per UTC day.
    - cron: '17 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scheduled-repository-writer
  cancel-in-progress: false

jobs:
  health-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Probe production endpoints
        id: probe
        shell: bash
        env:
          CURL_TIMEOUT_SECONDS: '10'
        run: |
          set -euo pipefail
          mkdir -p data

          timestamp=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          check_endpoint() {
            local name=$1
            local url=$2
            local code
            code=$(curl --silent --show-error --location --max-redirs 5 \
              --max-time "$CURL_TIMEOUT_SECONDS" --output /dev/null \
              --write-out "%{http_code}" "$url" 2>/dev/null) || code="000"
            [[ "$code" =~ ^[0-9]{3}$ ]] || code="000"
            local status=$((10#$code))
            local ok=false
            if [[ "$status" -ge 200 && "$status" -lt 300 ]]; then ok=true; fi
            jq -n --arg name "$name" --arg url "$url" --arg text "$code" \
              --argjson status "$status" --argjson ok "$ok" \
              '{key:$name,value:{url:$url,status:$status,status_text:$text,ok:$ok}}'
          }

          endpoints=$(printf '%s\n' \
            "$(check_endpoint portal https://lumen-core.ai/)" \
            "$(check_endpoint evidence https://lumen-core.ai/evidence/)" \
            "$(check_endpoint kraken_dashboard https://lumen-core.ai/kraken_execution_dashboard.html)" \
            "$(check_endpoint mission_control https://lumen-core.ai/mission_control.html)" \
            "$(check_endpoint approval_hub https://lumen-core.ai/agent_approval_hub.html)" \
            "$(check_endpoint forecast https://lumen-core.ai/forecast.html)" \
            | jq -s 'from_entries')

          healthy=$(jq '[.[] | select(.ok == true)] | length' <<<"$endpoints")
          total=$(jq 'length' <<<"$endpoints")
          overall=outage
          color=red
          if [[ "$healthy" -eq "$total" ]]; then
            overall=operational
            color=brightgreen
          elif [[ "$healthy" -gt 3 ]]; then
            overall=degraded
            color=yellow
          fi

          jq -n --arg checked_utc "$timestamp" --arg overall "$overall" \
            --argjson healthy_count "$healthy" --argjson total_count "$total" \
            --argjson endpoints "$endpoints" \
            '{checked_utc:$checked_utc,overall:$overall,healthy_count:$healthy_count,total_count:$total_count,endpoints:$endpoints}' \
            > data/site_health.json

          jq -n --arg message "$overall ($healthy/$total)" --arg color "$color" \
            '{schemaVersion:1,label:"status",message:$message,color:$color,cacheSeconds:3600}' \
            > data/uptime_badge.json

          jq empty data/site_health.json data/uptime_badge.json
          echo "overall=$overall" >> "$GITHUB_OUTPUT"
          echo "healthy=$healthy" >> "$GITHUB_OUTPUT"
          echo "timestamp=$timestamp" >> "$GITHUB_OUTPUT"

      - name: Commit daily health snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "lumencore-bot"
          git config user.email "bot@lumen-core.ai"
          git add data/site_health.json data/uptime_badge.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(health): daily survival snapshot — ${{ steps.probe.outputs.overall }} — ${{ steps.probe.outputs.healthy }}/6 @ ${{ steps.probe.outputs.timestamp }}"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Warn on outage
        if: steps.probe.outputs.overall == 'outage'
        run: echo "::warning::lumen-core.ai is reporting an outage — ${{ steps.probe.outputs.healthy }}/6 endpoints healthy"
