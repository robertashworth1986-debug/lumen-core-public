name: 🔍 Site Health Probe

on:
  schedule:
    # Every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Probe all production endpoints
        id: probe
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          check_endpoint() {
            local name=$1
            local url=$2
            local code=$(curl -sf --max-time 10 -o /dev/null -w "%{http_code}" "$url" 2>/dev/null || echo "000")
            local ok=$([ "$code" = "200" ] && echo "true" || echo "false")
            echo "  \"$name\": { \"url\": \"$url\", \"status\": $code, \"ok\": $ok }"
          }

          PORTAL=$(check_endpoint "portal" "https://lumen-core.ai/")
          EVIDENCE=$(check_endpoint "evidence" "https://lumen-core.ai/evidence/")
          KRAKEN_DB=$(check_endpoint "kraken_dashboard" "https://lumen-core.ai/kraken_execution_dashboard.html")
          MISSION=$(check_endpoint "mission_control" "https://lumen-core.ai/mission_control.html")
          APPROVAL=$(check_endpoint "approval_hub" "https://lumen-core.ai/agent_approval_hub.html")
          FORECAST=$(check_endpoint "forecast" "https://lumen-core.ai/forecast.html")

          # Count healthy endpoints
          ALL_UP=6
          HEALTHY=$(echo "$PORTAL $EVIDENCE $KRAKEN_DB $MISSION $APPROVAL $FORECAST" | grep -o '"ok": true' | wc -l)

          if [ "$HEALTHY" -eq "$ALL_UP" ]; then
            OVERALL="operational"
            COLOR="brightgreen"
          elif [ "$HEALTHY" -gt 3 ]; then
            OVERALL="degraded"
            COLOR="yellow"
          else
            OVERALL="outage"
            COLOR="red"
          fi

          mkdir -p out/ci/site-health

          REVIEWER_RELEASE="blocked"
          if python code/ops/CHECK_PUBLIC_REVIEWER_RELEASE.py \
            --output out/ci/site-health/reviewer_release_canary.json; then
            REVIEWER_RELEASE="pass"
          else
            OVERALL="outage"
            COLOR="red"
          fi

          cat > out/ci/site-health/site_health.json << EOF
          {
            "checked_utc": "${TIMESTAMP}",
            "overall": "${OVERALL}",
            "healthy_count": ${HEALTHY},
            "total_count": ${ALL_UP},
            "reviewer_release": "${REVIEWER_RELEASE}",
            "endpoints": {
          ${PORTAL},
          ${EVIDENCE},
          ${KRAKEN_DB},
          ${MISSION},
          ${APPROVAL},
          ${FORECAST}
            }
          }
          EOF

          # Shields.io endpoint badge
          cat > out/ci/site-health/uptime_badge.json << EOF
          {
            "schemaVersion": 1,
            "label": "status",
            "message": "${OVERALL} (${HEALTHY}/${ALL_UP})",
            "color": "${COLOR}",
            "cacheSeconds": 60
          }
          EOF

          echo "overall=${OVERALL}" >> $GITHUB_OUTPUT
          echo "healthy=${HEALTHY}" >> $GITHUB_OUTPUT
          echo "timestamp=${TIMESTAMP}" >> $GITHUB_OUTPUT
          echo "reviewer_release=${REVIEWER_RELEASE}" >> $GITHUB_OUTPUT

      - name: Publish workflow evidence
        uses: actions/upload-artifact@v4
        with:
          name: site-health-${{ github.run_id }}
          path: out/ci/site-health/
          if-no-files-found: error
          retention-days: 7

      - name: Write run summary
        run: |
          {
            echo "## Production health probe"
            echo ""
            echo "- Overall: ${{ steps.probe.outputs.overall }}"
            echo "- Healthy endpoints: ${{ steps.probe.outputs.healthy }}/6"
            echo "- Reviewer release: ${{ steps.probe.outputs.reviewer_release }}"
            echo "- Checked: ${{ steps.probe.outputs.timestamp }}"
            echo ""
            echo "The workflow is read-only. It does not commit generated state to the repository."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail job on outage (optional alerting hook)
        if: steps.probe.outputs.overall == 'outage'
        run: |
          echo "::warning::lumen-core.ai is reporting an outage — ${{ steps.probe.outputs.healthy }}/6 endpoints healthy"
          # Non-fatal: keep the report available for incident review.

      - name: Fail closed on reviewer release mismatch
        if: steps.probe.outputs.reviewer_release != 'pass'
        run: |
          echo "::error::Public reviewer files do not match the checked-out release."
          exit 1
