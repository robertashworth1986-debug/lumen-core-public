name: Production Surface Observation

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-surface-observer
  cancel-in-progress: true

jobs:
  health-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Observe bounded public surfaces
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts

          set +e
          python3 code/ops/probe_production_surfaces.py \
            --timeout-seconds 10 \
            --require-healthy \
            --output artifacts/production_surface_observation.json \
            > /dev/null
          observer_rc=$?
          set -e

          jq empty artifacts/production_surface_observation.json
          jq -e '
            .endpoints
            | to_entries
            | length > 0 and all(
                .[];
                (.value.body_sha256
                  | type == "string" and test("^[0-9a-f]{64}$"))
                and (.value.body_valid | type == "boolean")
                and (.value.validation_state | type == "string")
              )
          ' artifacts/production_surface_observation.json > /dev/null
          TIMESTAMP=$(jq -r '.checked_utc' artifacts/production_surface_observation.json)
          OVERALL=$(jq -r '.overall' artifacts/production_surface_observation.json)
          HEALTHY=$(jq -r '.healthy_count' artifacts/production_surface_observation.json)
          TOTAL=$(jq -r '.total_count' artifacts/production_surface_observation.json)

          case "$OVERALL" in
            operational) COLOR="brightgreen" ;;
            degraded) COLOR="yellow" ;;
            outage|observer_error) COLOR="red" ;;
            *) COLOR="lightgrey" ;;
          esac

          jq -n \
            --arg message "${OVERALL} (${HEALTHY}/${TOTAL})" \
            --arg color "$COLOR" \
            '{
              schemaVersion: 1,
              label: "observed status",
              message: $message,
              color: $color,
              cacheSeconds: 60
            }' > artifacts/production_surface_badge.json
          jq empty artifacts/production_surface_badge.json

          echo "observer_rc=${observer_rc}" >> "$GITHUB_OUTPUT"
          echo "overall=${OVERALL}" >> "$GITHUB_OUTPUT"
          echo "healthy=${HEALTHY}" >> "$GITHUB_OUTPUT"
          echo "total=${TOTAL}" >> "$GITHUB_OUTPUT"
          echo "timestamp=${TIMESTAMP}" >> "$GITHUB_OUTPUT"

          {
            echo "## Production Surface Observation"
            echo
            echo "- Checked UTC: \`${TIMESTAMP}\`"
            echo "- Result: \`${OVERALL}\`"
            echo "- Passing surfaces: \`${HEALTHY}/${TOTAL}\`"
            echo "- Observer exit code: \`${observer_rc}\`"
            echo
            echo "This is one bounded, read-only observation. It is not an uptime, performance, security, savings, validation, eligibility, or award claim."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bounded observation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-surface-observation-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

      - name: Fail on non-operational observation
        if: steps.probe.outputs.observer_rc == '2'
        shell: bash
        run: |
          echo "::error::lumen-core.ai observation is ${{ steps.probe.outputs.overall }} - ${{ steps.probe.outputs.healthy }}/${{ steps.probe.outputs.total }} surfaces passed status and body validation"
          exit 1

      - name: Fail on observer runtime error
        if: steps.probe.outputs.observer_rc != '0' && steps.probe.outputs.observer_rc != '2'
        shell: bash
        run: |
          echo "::error::The observer produced a fail-closed error receipt."
          exit 1
