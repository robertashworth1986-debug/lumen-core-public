name: 🔍 Site Health Probe

on:
  schedule:
    # Every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  health-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Probe all production endpoints
        id: probe
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          check_endpoint() {
            local name=$1
            local url=$2
            local code=$(curl -sf --max-time 10 -o /dev/null -w "%{http_code}" "$url" 2>/dev/null || echo "000")
            local ok=$([ "$code" = "200" ] && echo "true" || echo "false")
            echo "  \"$name\": { \"url\": \"$url\", \"status\": $code, \"ok\": $ok }"
          }

          PORTAL=$(check_endpoint "portal" "https://lumen-core.ai/")
          EVIDENCE=$(check_endpoint "evidence" "https://lumen-core.ai/evidence/")
          KRAKEN_DB=$(check_endpoint "kraken_dashboard" "https://lumen-core.ai/kraken_execution_dashboard.html")
          MISSION=$(check_endpoint "mission_control" "https://lumen-core.ai/mission_control.html")
          APPROVAL=$(check_endpoint "approval_hub" "https://lumen-core.ai/agent_approval_hub.html")
          FORECAST=$(check_endpoint "forecast" "https://lumen-core.ai/forecast.html")

          # Count healthy endpoints
          ALL_UP=6
          HEALTHY=$(echo "$PORTAL $EVIDENCE $KRAKEN_DB $MISSION $APPROVAL $FORECAST" | grep -o '"ok": true' | wc -l)

          if [ "$HEALTHY" -eq "$ALL_UP" ]; then
            OVERALL="operational"
            COLOR="brightgreen"
          elif [ "$HEALTHY" -gt 3 ]; then
            OVERALL="degraded"
            COLOR="yellow"
          else
            OVERALL="outage"
            COLOR="red"
          fi

          cat > data/site_health.json << EOF
          {
            "checked_utc": "${TIMESTAMP}",
            "overall": "${OVERALL}",
            "healthy_count": ${HEALTHY},
            "total_count": ${ALL_UP},
            "endpoints": {
          ${PORTAL},
          ${EVIDENCE},
          ${KRAKEN_DB},
          ${MISSION},
          ${APPROVAL},
          ${FORECAST}
            }
          }
          EOF

          # Shields.io endpoint badge
          cat > data/uptime_badge.json << EOF
          {
            "schemaVersion": 1,
            "label": "status",
            "message": "${OVERALL} (${HEALTHY}/${ALL_UP})",
            "color": "${COLOR}",
            "cacheSeconds": 60
          }
          EOF

          echo "overall=${OVERALL}" >> $GITHUB_OUTPUT
          echo "healthy=${HEALTHY}" >> $GITHUB_OUTPUT
          echo "timestamp=${TIMESTAMP}" >> $GITHUB_OUTPUT

      - name: Commit health report
        run: |
          git config user.name  "lumencore-bot"
          git config user.email "bot@lumen-core.ai"
          git add data/site_health.json data/uptime_badge.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(health): ${{ steps.probe.outputs.overall }} — ${{ steps.probe.outputs.healthy }}/6 endpoints up @ ${{ steps.probe.outputs.timestamp }}"
            git push
          fi

      - name: Fail job on outage (optional alerting hook)
        if: steps.probe.outputs.overall == 'outage'
        run: |
          echo "::warning::lumen-core.ai is reporting an outage — ${{ steps.probe.outputs.healthy }}/6 endpoints healthy"
          # Non-fatal: don't exit 1 so we still commit the status
