name: 🔍 Site Health Probe

on:
  schedule:
    # Survival mode: one preservation snapshot per UTC day.
    - cron: '17 12 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: read-only-site-health-probe
  cancel-in-progress: true

jobs:
  health-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Probe production endpoints over a bounded observation window
        id: probe
        shell: bash
        env:
          HEALTH_ARTIFACT_DIR: ${{ runner.temp }}/lumencore-health-probe
        run: |
          set -euo pipefail
          python3 code/ops/probe_public_health.py \
            --output-dir "$HEALTH_ARTIFACT_DIR" --rounds 4 --interval-seconds 60

      - name: Publish explicit health verdict
        if: always()
        shell: bash
        env:
          HEALTH_ARTIFACT_DIR: ${{ runner.temp }}/lumencore-health-probe
        run: |
          set -euo pipefail
          if [[ -s "$HEALTH_ARTIFACT_DIR/site_health.json" ]]; then
            overall=$(jq -r '.overall' "$HEALTH_ARTIFACT_DIR/site_health.json")
            healthy=$(jq -r '.healthy_count' "$HEALTH_ARTIFACT_DIR/site_health.json")
            total=$(jq -r '.total_count' "$HEALTH_ARTIFACT_DIR/site_health.json")
            static_state=$(jq -r '.static_surface_state' "$HEALTH_ARTIFACT_DIR/site_health.json")
            gateway_state=$(jq -r '.dynamic_gateway_state' "$HEALTH_ARTIFACT_DIR/site_health.json")
            checked_utc=$(jq -r '.checked_utc' "$HEALTH_ARTIFACT_DIR/site_health.json")
            {
              echo "## Production health verdict: ${overall^^}"
              echo "- Contracts passing every observation: \`$healthy/$total\`"
              echo "- Static surface: \`$static_state\`"
              echo "- Dynamic gateway: \`$gateway_state\`"
              echo "- Window began UTC: \`$checked_utc\`"
              echo "- Window ended UTC: \`$(jq -r '.observation_window.completed_utc' "$HEALTH_ARTIFACT_DIR/site_health.json")\`"
              echo "- Failed observations: \`$(jq -r '.observation_window.failed_observations' "$HEALTH_ARTIFACT_DIR/site_health.json")\`"
              echo "- Endpoints with mixed passing/failing samples: \`$(jq -r '.observation_window.flapping_endpoint_count' "$HEALTH_ARTIFACT_DIR/site_health.json")\`"
              echo "- Four rounds, at least 60 seconds apart, from one runner; not continuous uptime or origin attribution."
              echo "- Evidence: retained workflow artifact only; no repository commit or deployment occurred"
              echo ""
              echo "> A completed probe is not evidence of a healthy deployment. The explicit verdict above controls."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Production health verdict: UNKNOWN"
              echo "- No valid health receipt was produced."
              echo "- No repository commit or deployment occurred."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload bounded health receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-health-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/lumencore-health-probe/site_health.json
            ${{ runner.temp }}/lumencore-health-probe/uptime_badge.json
            ${{ runner.temp }}/lumencore-health-probe/site_health_samples.jsonl
          if-no-files-found: error
          retention-days: 14

      - name: Fail closed on incomplete or unhealthy observations
        if: always()
        shell: bash
        env:
          HEALTH_ARTIFACT_DIR: ${{ runner.temp }}/lumencore-health-probe
        run: |
          set -euo pipefail
          if ! jq -e '.overall == "operational" and .observation_window.all_samples_complete == true and .observation_window.failed_observations == 0' \
            "$HEALTH_ARTIFACT_DIR/site_health.json" >/dev/null; then
            echo "::error::Public contracts did not pass every observation; inspect site_health.json and the retained per-sample journal."
            exit 1
          fi
