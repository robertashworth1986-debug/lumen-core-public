name: 🔍 Site Health Probe

on:
  schedule:
    # Probe every 15 minutes, but only commit on an endpoint-state change or once per UTC day.
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scheduled-repository-writer
  cancel-in-progress: false

jobs:
  health-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Probe all production endpoints
        id: probe
        shell: bash
        env:
          CURL_TIMEOUT_SECONDS: '10'
        run: |
          set -euo pipefail
          mkdir -p data

          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          TODAY=$(date -u +"%Y-%m-%d")

          PREV_OVERALL=$(jq -r '.overall // "unknown"' data/site_health.json 2>/dev/null || echo "unknown")
          PREV_HEALTHY=$(jq -r '.healthy_count // -1' data/site_health.json 2>/dev/null || echo "-1")
          PREV_DATE=$(jq -r '.checked_utc // ""' data/site_health.json 2>/dev/null | cut -c1-10 || true)
          PREV_ENDPOINT_STATE=$(
            jq -cS '
              .endpoints // {}
              | to_entries
              | map({name: .key, status: .value.status, status_text: (.value.status_text // ""), ok: .value.ok})
              | sort_by(.name)
            ' data/site_health.json 2>/dev/null || echo '[]'
          )

          check_endpoint() {
            local name=$1
            local url=$2
            local code
            local status
            local ok

            # Do not use curl --fail here: HTTP errors such as 502 are valid probe
            # results and must not be collapsed into a transport failure. A network
            # failure is normalized to status 0, while status_text preserves 000.
            code=$(
              curl \
                --silent \
                --show-error \
                --location \
                --max-redirs 5 \
                --max-time "$CURL_TIMEOUT_SECONDS" \
                --output /dev/null \
                --write-out "%{http_code}" \
                "$url" \
                2>/dev/null
            ) || code="000"
            [[ "$code" =~ ^[0-9]{3}$ ]] || code="000"

            status=$((10#$code))
            if [[ "$status" -ge 200 && "$status" -lt 300 ]]; then
              ok="true"
            else
              ok="false"
            fi

            printf '  "%s": { "url": "%s", "status": %d, "status_text": "%s", "ok": %s }' \
              "$name" "$url" "$status" "$code" "$ok"
          }

          PORTAL=$(check_endpoint "portal" "https://lumen-core.ai/")
          EVIDENCE=$(check_endpoint "evidence" "https://lumen-core.ai/evidence/")
          KRAKEN_DB=$(check_endpoint "kraken_dashboard" "https://lumen-core.ai/kraken_execution_dashboard.html")
          MISSION=$(check_endpoint "mission_control" "https://lumen-core.ai/mission_control.html")
          APPROVAL=$(check_endpoint "approval_hub" "https://lumen-core.ai/agent_approval_hub.html")
          FORECAST=$(check_endpoint "forecast" "https://lumen-core.ai/forecast.html")

          ALL_UP=6
          HEALTHY=$(printf '%s\n' "$PORTAL" "$EVIDENCE" "$KRAKEN_DB" "$MISSION" "$APPROVAL" "$FORECAST" | grep -c '"ok": true' || true)

          if [[ "$HEALTHY" -eq "$ALL_UP" ]]; then
            OVERALL="operational"
            COLOR="brightgreen"
          elif [[ "$HEALTHY" -gt 3 ]]; then
            OVERALL="degraded"
            COLOR="yellow"
          else
            OVERALL="outage"
            COLOR="red"
          fi

          cat > data/site_health.json <<EOF
          {
            "checked_utc": "${TIMESTAMP}",
            "overall": "${OVERALL}",
            "healthy_count": ${HEALTHY},
            "total_count": ${ALL_UP},
            "endpoints": {
          ${PORTAL},
          ${EVIDENCE},
          ${KRAKEN_DB},
          ${MISSION},
          ${APPROVAL},
          ${FORECAST}
            }
          }
          EOF

          jq empty data/site_health.json

          CURRENT_ENDPOINT_STATE=$(
            jq -cS '
              .endpoints
              | to_entries
              | map({name: .key, status: .value.status, status_text: (.value.status_text // ""), ok: .value.ok})
              | sort_by(.name)
            ' data/site_health.json
          )

          cat > data/uptime_badge.json <<EOF
          {
            "schemaVersion": 1,
            "label": "status",
            "message": "${OVERALL} (${HEALTHY}/${ALL_UP})",
            "color": "${COLOR}",
            "cacheSeconds": 60
          }
          EOF

          jq empty data/uptime_badge.json

          SHOULD_COMMIT="false"
          REASON="no material status change"

          if [[ "$OVERALL" != "$PREV_OVERALL" ]] \
            || [[ "$HEALTHY" != "$PREV_HEALTHY" ]] \
            || [[ "$CURRENT_ENDPOINT_STATE" != "$PREV_ENDPOINT_STATE" ]]; then
            SHOULD_COMMIT="true"
            REASON="endpoint state changed"
          elif [[ "$PREV_DATE" != "$TODAY" ]]; then
            SHOULD_COMMIT="true"
            REASON="daily snapshot"
          fi

          echo "overall=${OVERALL}" >> "$GITHUB_OUTPUT"
          echo "healthy=${HEALTHY}" >> "$GITHUB_OUTPUT"
          echo "timestamp=${TIMESTAMP}" >> "$GITHUB_OUTPUT"
          echo "should_commit=${SHOULD_COMMIT}" >> "$GITHUB_OUTPUT"
          echo "commit_reason=${REASON}" >> "$GITHUB_OUTPUT"

          echo "Health result: ${OVERALL} (${HEALTHY}/${ALL_UP}); ${REASON}."

      - name: Commit material health report
        if: steps.probe.outputs.should_commit == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "lumencore-bot"
          git config user.email "bot@lumen-core.ai"
          git add data/site_health.json data/uptime_badge.json

          if ! git diff --cached --quiet; then
            git commit -m "chore(health): ${{ steps.probe.outputs.commit_reason }} — ${{ steps.probe.outputs.overall }} — ${{ steps.probe.outputs.healthy }}/6 @ ${{ steps.probe.outputs.timestamp }}"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Warn on outage
        if: steps.probe.outputs.overall == 'outage'
        shell: bash
        run: |
          echo "::warning::lumen-core.ai is reporting an outage — ${{ steps.probe.outputs.healthy }}/6 endpoints healthy"
          # Non-fatal: preserve the status report for operator review.
