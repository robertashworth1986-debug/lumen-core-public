name: Repair exact gateway runtime closure on VPS

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Full main-branch commit SHA selected for source and service-identity recovery
        required: true
        type: string
      approval:
        description: Explicit production gateway runtime-closure gate
        required: true
        type: choice
        default: HOLD
        options:
          - HOLD
          - REPAIR_PUBLIC_GATEWAY_DEPENDENCY_CLOSURE

permissions:
  contents: read

concurrency:
  group: lumencore-production-gateway
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      source_commit: ${{ steps.gate.outputs.source_commit }}
    steps:
      - name: Fail closed unless this exact workflow commit is approved
        id: gate
        shell: bash
        env:
          APPROVAL: ${{ inputs.approval }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          WORKFLOW_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$EVENT_NAME" == "workflow_dispatch" ]]
          [[ "$APPROVAL" == "REPAIR_PUBLIC_GATEWAY_DEPENDENCY_CLOSURE" ]]
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_COMMIT" == "$WORKFLOW_COMMIT" ]]
          printf 'source_commit=%s\n' "$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"

  repair:
    needs: authorize
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://lumen-core.ai/health
    env:
      APPROVAL: ${{ inputs.approval }}
      RELEASE_COMMIT: ${{ needs.authorize.outputs.source_commit }}
      REMOTE_STAGE: /tmp/lumencore-gateway-repair-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout the approved commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.authorize.outputs.source_commit }}

      - name: Require the approved commit to be current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          [[ "$(git rev-parse HEAD)" == "$RELEASE_COMMIT" ]]
          [[ "$(git rev-parse origin/main)" == "$RELEASE_COMMIT" ]]

      - name: Package exact gateway source closure
        id: package
        shell: bash
        run: |
          set -euo pipefail
          package_root=/tmp/gateway-repair
          source_root="$package_root/source"
          install -d -m 0700 "$source_root"
          mapfile -t files < <(
            bash code/ops/REPAIR_GATEWAY_PUBLIC_CONTRACT_ON_VPS.sh --print-files
          )
          [[ "${#files[@]}" -eq 20 ]]
          for relative in "${files[@]}"; do
            [[ -f "code/$relative" && ! -L "code/$relative" ]]
            install -D -m 0644 "code/$relative" "$source_root/$relative"
          done
          bundle_sha=$(
            LUMENCORE_GATEWAY_SOURCE_ROOT="$source_root" \
              bash code/ops/REPAIR_GATEWAY_PUBLIC_CONTRACT_ON_VPS.sh --bundle-sha
          )
          hardening_sha=$(
            bash code/ops/REPAIR_GATEWAY_PUBLIC_CONTRACT_ON_VPS.sh --hardening-sha
          )
          [[ "$bundle_sha" =~ ^[0-9a-f]{64}$ ]]
          [[ "$hardening_sha" =~ ^[0-9a-f]{64}$ ]]
          tar -C "$source_root" -cf "$package_root/gateway-source.tar" .
          install -m 0755 code/ops/REPAIR_GATEWAY_PUBLIC_CONTRACT_ON_VPS.sh \
            "$package_root/REPAIR_GATEWAY_PUBLIC_CONTRACT_ON_VPS.sh"
          {
            printf 'source_commit=%s\n' "$RELEASE_COMMIT"
            printf 'bundle_sha256=%s\n' "$bundle_sha"
            printf 'service_hardening_sha256=%s\n' "$hardening_sha"
            printf 'file_count=%s\n' "${#files[@]}"
            printf '%s\n' "${files[@]}"
          } > "$package_root/gateway-repair-manifest.txt"
          printf 'bundle_sha=%s\n' "$bundle_sha" >> "$GITHUB_OUTPUT"
          printf 'hardening_sha=%s\n' "$hardening_sha" >> "$GITHUB_OUTPUT"

      - name: Stage private HumanUnlock without printing it
        shell: bash
        env:
          HUMAN_UNLOCK: ${{ secrets.LUMA_HUMAN_UNLOCK_TOKEN }}
        run: |
          set -euo pipefail
          if (( ${#HUMAN_UNLOCK} < 32 )); then
            echo "::error::Repository secret LUMA_HUMAN_UNLOCK_TOKEN is missing or shorter than 32 characters; no VPS change was attempted."
            exit 1
          fi
          install -m 0600 /dev/null /tmp/gateway-repair/human-unlock
          printf '%s' "$HUMAN_UNLOCK" > /tmp/gateway-repair/human-unlock
          unset HUMAN_UNLOCK

      - name: Install SSH key
        uses: shimataro/ssh-key-action@87a8f067114a8ce263df83e9ed5c849953548bc3 # v2.8.1
        with:
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.VPS_KNOWN_HOSTS }}

      - name: Verify bounded remote prerequisites
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "opc@$VPS_HOST" '
            set -eu
            sudo -n true
            sudo -n test -d /opt/lumencore/code
            sudo -n test -x /opt/lumencore/.venv/bin/python
            test "$(id -u lumencore)" -ne 0
            test "$(id -gn lumencore)" = lumencore
            sudo -n -u lumencore test -x /opt/lumencore/.venv/bin/python
            sudo -n test ! -L /opt/lumencore/run
            sudo -n systemctl cat luma-gateway >/dev/null
            for command_name in \
              python3 sha256sum realpath install cp stat mktemp curl systemctl tar \
              id getent chown chmod dirname rmdir awk grep seq sleep tr; do
              command -v "$command_name" >/dev/null
            done
          '

      - name: Upload bounded gateway repair package
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          [[ "$REMOTE_STAGE" =~ ^/tmp/lumencore-gateway-repair-[0-9]+-[0-9]+$ ]]
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "opc@$VPS_HOST" \
            "test ! -e '$REMOTE_STAGE' && install -d -m 0700 '$REMOTE_STAGE'"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes \
            /tmp/gateway-repair/gateway-source.tar \
            /tmp/gateway-repair/gateway-repair-manifest.txt \
            /tmp/gateway-repair/REPAIR_GATEWAY_PUBLIC_CONTRACT_ON_VPS.sh \
            /tmp/gateway-repair/human-unlock \
            "opc@$VPS_HOST:$REMOTE_STAGE/"

      - name: Apply exact gateway closure with rollback
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          BUNDLE_SHA: ${{ steps.package.outputs.bundle_sha }}
          HARDENING_SHA: ${{ steps.package.outputs.hardening_sha }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "opc@$VPS_HOST" \
            "set -eu
             [[ '$REMOTE_STAGE' =~ ^/tmp/lumencore-gateway-repair-[0-9]+-[0-9]+$ ]]
             install -d -m 0700 '$REMOTE_STAGE/source'
             tar -C '$REMOTE_STAGE/source' -xf '$REMOTE_STAGE/gateway-source.tar'
             sudo -n env \
               LUMENCORE_HUMAN_UNLOCK_FILE='$REMOTE_STAGE/human-unlock' \
               LUMENCORE_GATEWAY_SOURCE_ROOT='$REMOTE_STAGE/source' \
               LUMENCORE_EXPECTED_GATEWAY_BUNDLE_SHA256='$BUNDLE_SHA' \
               LUMENCORE_EXPECTED_GATEWAY_HARDENING_SHA256='$HARDENING_SHA' \
               LUMENCORE_GATEWAY_SOURCE_COMMIT='$RELEASE_COMMIT' \
               bash '$REMOTE_STAGE/REPAIR_GATEWAY_PUBLIC_CONTRACT_ON_VPS.sh' --apply" \
            | tee /tmp/gateway-repair/gateway-repair-receipt.txt

      - name: Verify public gateway contracts after repair
        shell: bash
        env:
          BUNDLE_SHA: ${{ steps.package.outputs.bundle_sha }}
          HARDENING_SHA: ${{ steps.package.outputs.hardening_sha }}
        run: |
          set -euo pipefail
          # These runner-side records never trigger or certify remote restoration.
          POSTCHECK_STAGE=setup
          STAGE_BEGAN=false
          STAGE_COMPLETED=false
          COMPLETED_STAGES=''
          STARTED_SHA=''
          POSTCHECK_INTERRUPTED=false
          health_body='' status_body='' operator_body='' operator_headers=''
          websocket_body='' operator_receipt=''
          record_external_outcome() {
            python3 - "$1" "$2" "$POSTCHECK_STAGE" "$STAGE_BEGAN" "$STAGE_COMPLETED" \
              "$COMPLETED_STAGES" "$STARTED_SHA" "$POSTCHECK_INTERRUPTED" <<'PY'
          import hashlib, json, os, re, stat, sys
          from datetime import datetime, timezone
          from pathlib import Path
          kind, code, stage, began, completed, stages, started_sha, interrupted = sys.argv[1:]
          expected_stages = ['health_request', 'status_request', 'health_contract', 'status_contract',
                             'metrics', 'openapi_json', 'docs', 'redoc', 'websocket', 'legacy_receipt']
          assert kind in {'started', 'terminal'} and re.fullmatch(r'[0-9]{1,3}', code)
          code = int(code)
          assert 0 <= code <= 255 and stage in ['setup', 'complete', *expected_stages]
          assert began in {'true', 'false'} and completed in {'true', 'false'} and interrupted in {'true', 'false'}
          completed_stages = stages.splitlines()
          assert completed_stages == expected_stages[:len(completed_stages)]
          directory = Path('/tmp/gateway-repair')
          assert directory.is_dir() and not directory.is_symlink()
          def stable_bytes(path, limit=2*1024*1024):
              before = path.lstat()
              assert stat.S_ISREG(before.st_mode) and before.st_nlink == 1 and before.st_size <= limit
              data = path.read_bytes()
              after = path.lstat()
              fields = ('st_dev', 'st_ino', 'st_mode', 'st_nlink', 'st_size', 'st_mtime_ns', 'st_ctime_ns')
              assert all(getattr(before, key) == getattr(after, key) for key in fields)
              assert len(data) == before.st_size
              return data
          digest = lambda data: hashlib.sha256(data).hexdigest()
          binding = {key: os.environ[key] for key in
                     ('RELEASE_COMMIT', 'BUNDLE_SHA', 'HARDENING_SHA', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT')}
          assert re.fullmatch(r'[0-9a-f]{40}', binding['RELEASE_COMMIT'])
          assert all(re.fullmatch(r'[0-9a-f]{64}', binding[key]) for key in ('BUNDLE_SHA', 'HARDENING_SHA'))
          assert all(re.fullmatch(r'[1-9][0-9]*', binding[key]) for key in ('GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT'))
          helper_bytes = stable_bytes(directory/'gateway-repair-receipt.txt')
          helper_lines = helper_bytes.decode('utf-8').splitlines()
          for marker in ('GATEWAY_RUNTIME_CLOSURE_REPAIR_OK',
                         'Source commit: ' + binding['RELEASE_COMMIT'],
                         'Bundle SHA-256: ' + binding['BUNDLE_SHA'],
                         'Service hardening SHA-256: ' + binding['HARDENING_SHA']):
              assert helper_lines.count(marker) == 1
          prefix = 'Private helper outcome receipt SHA-256: '
          outcome_hashes = [line[len(prefix):] for line in helper_lines if line.startswith(prefix)]
          assert len(outcome_hashes) == 1 and re.fullmatch(r'[0-9a-f]{64}', outcome_hashes[0])
          binding.update(helper_stdout_artifact_sha256=digest(helper_bytes),
                         helper_outcome_reported_sha256=outcome_hashes[0])
          result = dict(schema='lumencore.gateway_external_verification.v1', kind=kind,
                        recorded_at=datetime.now(timezone.utc).isoformat(), binding=binding,
                        binding_basis='Exact workflow inputs and retained helper stdout; private helper receipt not independently read back.',
                        stage=stage, stage_began=began == 'true', stage_completed=completed == 'true',
                        completed_stages=completed_stages, original_exit_code=code,
                        interrupted=interrupted == 'true', restoration_attempted=False,
                        restoration_verified=False, service_state_verified=False,
                        production_readiness_verified=False)
          passed = (code == 0 and stage == 'complete' and completed_stages == expected_stages
                    and began == completed == 'true' and interrupted == 'false')
          if kind == 'started':
              assert code == 0 and stage == 'setup' and not completed_stages and not started_sha
              result['status'] = 'EXTERNAL_VERIFICATION_STARTED_UNKNOWN'
              name = 'public-verification-started.json'
          else:
              assert re.fullmatch(r'[0-9a-f]{64}', started_sha)
              start_bytes = stable_bytes(directory/'public-verification-started.json')
              assert digest(start_bytes) == started_sha
              start = json.loads(start_bytes)
              assert start['schema'] == result['schema'] and start['kind'] == 'started'
              assert start['binding'] == binding and start['status'] == 'EXTERNAL_VERIFICATION_STARTED_UNKNOWN'
              result['started_receipt_sha256'] = started_sha
              result['status'] = ('EXTERNAL_CHECKS_PASSED' if passed else
                                  'UNKNOWN_INTERRUPTED_EXTERNAL_VERIFICATION' if interrupted == 'true' else
                                  'EXTERNAL_VERIFICATION_FAILED' if code else 'UNKNOWN_INCOMPLETE_EXTERNAL_VERIFICATION')
              name = 'public-verification-outcome.json'
          data = (json.dumps(result, sort_keys=True, indent=2) + '\n').encode()
          fd = os.open(directory/name, os.O_WRONLY | os.O_CREAT | os.O_EXCL | getattr(os, 'O_NOFOLLOW', 0), 0o600)
          with os.fdopen(fd, 'wb') as stream:
              stream.write(data); stream.flush(); os.fsync(stream.fileno())
          assert stable_bytes(directory/name) == data
          print(digest(data))
          if kind == 'terminal' and code == 0 and not passed:
              raise SystemExit(98)
          PY
          }
          finish_external_verification() {
            local original_rc=$? final_rc
            final_rc=$original_rc
            trap - EXIT
            trap '' INT TERM
            if ! record_external_outcome terminal "$original_rc"; then
              echo '::error::External verification outcome persistence failed; helper recovery remains pending manual review.' >&2
              if [[ "$original_rc" -eq 0 ]]; then final_rc=97; fi
            fi
            rm -f -- "$health_body" "$status_body" "$operator_body" "$operator_headers" "$websocket_body" "$operator_receipt" || true
            exit "$final_rc"
          }
          start_stage() { POSTCHECK_STAGE="$1"; STAGE_BEGAN=true; STAGE_COMPLETED=false; }
          complete_stage() { COMPLETED_STAGES+="$POSTCHECK_STAGE"$'\n'; STAGE_COMPLETED=true; }
          trap finish_external_verification EXIT
          trap 'POSTCHECK_INTERRUPTED=true; exit 130' INT
          trap 'POSTCHECK_INTERRUPTED=true; exit 143' TERM
          STARTED_SHA="$(record_external_outcome started 0)" || exit 96
          health_body=$(mktemp)
          status_body=$(mktemp)
          operator_body=$(mktemp)
          operator_headers=$(mktemp)
          websocket_body=$(mktemp)
          operator_receipt=$(mktemp)
          start_stage health_request
          health_code=$(curl --fail-with-body -sS --max-time 15 \
            -o "$health_body" -w '%{http_code}' https://lumen-core.ai/health)
          complete_stage
          start_stage status_request
          status_code=$(curl --fail-with-body -sS --max-time 15 \
            -o "$status_body" -w '%{http_code}' https://lumen-core.ai/api/public/status)
          complete_stage
          for label in health status; do
            start_stage "${label}_contract"
            if [[ "$label" == health ]]; then body="$health_body"; code="$health_code";
            else body="$status_body"; code="$status_code"; fi
            [[ "$code" == 200 ]]
            jq -e '
            .status == "ok" and
            .service == "luma-experience-gateway" and
            .access_boundary == "operator_api_v1" and
            .public_surface == "minimal"
            ' "$body" >/dev/null
            complete_stage
          done

          probe_anonymous_operator_http() {
            local path="$1"
            local label="$2"
            local result
            local code
            local content_type
            local normalized_headers
            local expected_detail
            start_stage "$label"
            : > "$operator_body"
            : > "$operator_headers"
            result=$(curl -sS --max-time 15 \
              --header 'Cache-Control: no-cache' \
              --output "$operator_body" \
              --dump-header "$operator_headers" \
              --write-out '%{http_code}\t%{content_type}' \
              "https://lumen-core.ai${path}?verify=${RELEASE_COMMIT:0:12}-${label}")
            IFS=$'\t' read -r code content_type <<< "$result"
            [[ "$code" == 401 || "$code" == 503 ]]
            [[ "${content_type,,}" == application/json* ]]
            normalized_headers=$(tr -d '\r' < "$operator_headers")
            if [[ "$code" == 401 ]]; then
              expected_detail='operator API authentication required'
              grep -Eiq '^www-authenticate:[[:space:]]*Bearer([[:space:]]|$)' \
                <<< "$normalized_headers"
            else
              expected_detail='operator API access unavailable'
            fi
            jq -e --arg detail "$expected_detail" \
              'type == "object" and keys == ["detail"] and .detail == $detail' \
              "$operator_body" >/dev/null
            grep -Eiq '^cache-control:[[:space:]]*no-store([[:space:]]|$)' \
              <<< "$normalized_headers"
            grep -Eiq '^pragma:[[:space:]]*no-cache([[:space:]]|$)' \
              <<< "$normalized_headers"
            printf 'anonymous_%s_http=%s\n' "$label" "$code" >> "$operator_receipt"
            complete_stage
          }

          probe_anonymous_operator_http /metrics metrics
          probe_anonymous_operator_http /openapi.json openapi_json
          probe_anonymous_operator_http /docs docs
          probe_anonymous_operator_http /redoc redoc

          start_stage websocket
          websocket_code=$(curl -sS --max-time 15 --http1.1 \
            --header 'Cache-Control: no-cache' \
            --header 'Connection: Upgrade' \
            --header 'Upgrade: websocket' \
            --header 'Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==' \
            --header 'Sec-WebSocket-Version: 13' \
            --output "$websocket_body" \
            --write-out '%{http_code}' \
            "https://lumen-core.ai/ws?verify=${RELEASE_COMMIT:0:12}")
          [[ "$websocket_code" == 403 || "$websocket_code" == 404 ]]
          printf 'anonymous_ws_upgrade_http=%s\n' "$websocket_code" >> "$operator_receipt"
          complete_stage

          start_stage legacy_receipt
          printf 'source_commit=%s\nbundle_sha256=%s\nservice_hardening_sha256=%s\nhealth_http=%s\npublic_status_http=%s\n' \
            "$RELEASE_COMMIT" '${{ steps.package.outputs.bundle_sha }}' \
            '${{ steps.package.outputs.hardening_sha }}' "$health_code" "$status_code" \
            > /tmp/gateway-repair/public-verification-receipt.txt
          cat "$operator_receipt" >> /tmp/gateway-repair/public-verification-receipt.txt
          complete_stage
          POSTCHECK_STAGE=complete
          STAGE_BEGAN=true
          STAGE_COMPLETED=true

      - name: Remove local private unlock staging
        if: always()
        shell: bash
        run: rm -f -- /tmp/gateway-repair/human-unlock

      - name: Remove remote repair staging
        if: always()
        continue-on-error: true
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          [[ "$REMOTE_STAGE" =~ ^/tmp/lumencore-gateway-repair-[0-9]+-[0-9]+$ ]]
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "opc@$VPS_HOST" \
            "resolved=\$(realpath -m -- '$REMOTE_STAGE'); \
             [[ \"\$resolved\" =~ ^/tmp/lumencore-gateway-repair-[0-9]+-[0-9]+$ ]]; \
             rm -rf -- \"\$resolved\""

      - name: Upload bounded repair receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gateway-repair-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/gateway-repair/gateway-repair-manifest.txt
            /tmp/gateway-repair/gateway-repair-receipt.txt
            /tmp/gateway-repair/public-verification-receipt.txt
            /tmp/gateway-repair/public-verification-started.json
            /tmp/gateway-repair/public-verification-outcome.json
          if-no-files-found: warn
          retention-days: 30
