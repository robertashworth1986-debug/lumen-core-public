permissions:
  contents: read

concurrency:
  group: codecheck-eia-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  author-readiness:
    name: Author packet and archive gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
      TZ: UTC

    steps:
      - name: Check out the reviewed source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install the pinned Python runtime
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.9"

      - name: Verify the exact reviewer runtime
        run: python code/ops/VERIFY_CODECHECK_REVIEWER_RUNTIME.py --check-only

      - name: Install the hash-locked reviewer dependencies
        run: |
          python code/ops/VERIFY_REVIEWER_DEPENDENCY_LOCK.py
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: --requirement requirements-reviewer-ubuntu-py311.lock
          python -m pip check

      - name: Verify the published author-readiness receipt
        run: python code/ops/BUILD_CODECHECK_EIA_READINESS.py --check-only

      - name: Build the deterministic unpublished release candidate
        run: python code/ops/BUILD_CODECHECK_EIA_RELEASE_CANDIDATE.py

      - name: Test the fail-closed author and release packets
        run: python -m pytest -q tests/test_codecheck_eia_readiness.py tests/test_codecheck_eia_release_candidate.py tests/test_codecheck_reviewer_runtime.py
