name: Public site exact-snapshot gate

on:
  pull_request:
    paths:
      - '.github/workflows/deploy.yml'
      - '.github/workflows/deploy-public-site-release.yml'
      - '.github/workflows/public-site-exact-snapshot-ci.yml'
      - 'code/deploy/APPLY_PUBLIC_SITE_RELEASE_ON_VPS.sh'
      - 'code/deploy/DISCOVER_PUBLIC_SITE_ROLLBACK_AUTHORITY_ON_VPS.py'
      - 'code/deploy/RESTORE_PUBLIC_SITE_RELEASE_ON_VPS.sh'
      - 'code/deploy/package_public_site_release.py'
      - 'code/deploy/public_site_release_contract.py'
      - 'code/ops/BUILD_PUBLIC_SITE_DEPLOYMENT_TRANSACTION_RECEIPT.py'
      - 'code/ops/VERIFY_PUBLIC_SITE_LIVE_RELEASE.py'
      - 'code/ops/CLASSIFY_PUBLIC_RELEASE_INCIDENT.py'
      - 'code/ops/VERIFY_INCIDENT_RESPONSE_AND_CONTINUITY.py'
      - 'config/incident_response_and_continuity_v1.json'
      - 'docs/INCIDENT_RESPONSE_AND_CONTINUITY_PLAN.md'
      - 'docs/PUBLIC_SITE_EXACT_SNAPSHOT_PROTOCOL.md'
      - 'dashboard/operator_home.html'
      - 'dashboard/opportunity_sprint.html'
      - 'dashboard/proof_to_pilot.html'
      - 'dashboard/external_review.html'
      - 'dashboard/reviewer_docket.json'
      - 'dashboard/mission_control.html'
      - 'dashboard/quant_lab.html'
      - 'dashboard/grants.html'
      - 'dashboard/kraken_execution_dashboard.html'
      - 'dashboard/forecast.html'
      - 'dashboard/anomalies.html'
      - 'dashboard/explain.html'
      - 'dashboard/lab.html'
      - 'dashboard/evidence/index_bounded.html'
      - 'dashboard/robots.txt'
      - 'dashboard/sitemap.xml'
      - 'dashboard/site.webmanifest'
      - 'dashboard/manifest.json'
      - 'dashboard/assets/lumaarc_arc_seal_v1.png'
      - 'dashboard/assets/lumencore.css'
      - 'dashboard/assets/lumencore.js'
      - 'dashboard/assets/luma_command_fabric.css'
      - 'dashboard/assets/luma_command_fabric.js'
      - 'dashboard/assets/luma_institutional_surface.css'
      - 'dashboard/assets/luma_institutional_surface.js'
      - 'dashboard/assets/vendor/three.min.js'
      - 'dashboard/js/alpha_globe_3d.js'
      - 'dashboard/js/cinematic_telemetry_layer.js'
      - 'dashboard/js/luma_design_system.js'
      - 'dashboard/js/luma_path_resolver.js'
      - 'dashboard/assets/prooflock/**'
      - 'dashboard/build_week/prooflock_console/**'
      - 'tests/test_public_site_deploy_hardening.py'
      - 'tests/test_public_site_deployment_transaction_receipt.py'
      - 'tests/test_incident_response_and_continuity.py'
      - 'tests/test_public_discovery.py'
      - 'tests/test_canonical_surface_design.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy.yml'
      - '.github/workflows/deploy-public-site-release.yml'
      - '.github/workflows/public-site-exact-snapshot-ci.yml'
      - 'code/deploy/APPLY_PUBLIC_SITE_RELEASE_ON_VPS.sh'
      - 'code/deploy/DISCOVER_PUBLIC_SITE_ROLLBACK_AUTHORITY_ON_VPS.py'
      - 'code/deploy/RESTORE_PUBLIC_SITE_RELEASE_ON_VPS.sh'
      - 'code/deploy/package_public_site_release.py'
      - 'code/deploy/public_site_release_contract.py'
      - 'code/ops/BUILD_PUBLIC_SITE_DEPLOYMENT_TRANSACTION_RECEIPT.py'
      - 'code/ops/VERIFY_PUBLIC_SITE_LIVE_RELEASE.py'
      - 'code/ops/CLASSIFY_PUBLIC_RELEASE_INCIDENT.py'
      - 'code/ops/VERIFY_INCIDENT_RESPONSE_AND_CONTINUITY.py'
      - 'config/incident_response_and_continuity_v1.json'
      - 'docs/INCIDENT_RESPONSE_AND_CONTINUITY_PLAN.md'
      - 'docs/PUBLIC_SITE_EXACT_SNAPSHOT_PROTOCOL.md'
      - 'dashboard/operator_home.html'
      - 'dashboard/opportunity_sprint.html'
      - 'dashboard/proof_to_pilot.html'
      - 'dashboard/external_review.html'
      - 'dashboard/reviewer_docket.json'
      - 'dashboard/mission_control.html'
      - 'dashboard/quant_lab.html'
      - 'dashboard/grants.html'
      - 'dashboard/kraken_execution_dashboard.html'
      - 'dashboard/forecast.html'
      - 'dashboard/anomalies.html'
      - 'dashboard/explain.html'
      - 'dashboard/lab.html'
      - 'dashboard/evidence/index_bounded.html'
      - 'dashboard/robots.txt'
      - 'dashboard/sitemap.xml'
      - 'dashboard/site.webmanifest'
      - 'dashboard/manifest.json'
      - 'dashboard/assets/lumaarc_arc_seal_v1.png'
      - 'dashboard/assets/lumencore.css'
      - 'dashboard/assets/lumencore.js'
      - 'dashboard/assets/luma_command_fabric.css'
      - 'dashboard/assets/luma_command_fabric.js'
      - 'dashboard/assets/luma_institutional_surface.css'
      - 'dashboard/assets/luma_institutional_surface.js'
      - 'dashboard/assets/vendor/three.min.js'
      - 'dashboard/js/alpha_globe_3d.js'
      - 'dashboard/js/cinematic_telemetry_layer.js'
      - 'dashboard/js/luma_design_system.js'
      - 'dashboard/js/luma_path_resolver.js'
      - 'dashboard/assets/prooflock/**'
      - 'dashboard/build_week/prooflock_console/**'
      - 'tests/test_public_site_deploy_hardening.py'
      - 'tests/test_public_site_deployment_transaction_receipt.py'
      - 'tests/test_incident_response_and_continuity.py'
      - 'tests/test_public_discovery.py'
      - 'tests/test_canonical_surface_design.py'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install bounded test dependency
        run: python -m pip install --disable-pip-version-check pytest==9.1.0

      - name: Check shell syntax
        run: bash -n code/deploy/APPLY_PUBLIC_SITE_RELEASE_ON_VPS.sh code/deploy/RESTORE_PUBLIC_SITE_RELEASE_ON_VPS.sh

      - name: Compile deployment receipt controls
        run: >-
          python -m py_compile
          code/deploy/DISCOVER_PUBLIC_SITE_ROLLBACK_AUTHORITY_ON_VPS.py
          code/deploy/public_site_release_contract.py
          code/ops/BUILD_PUBLIC_SITE_DEPLOYMENT_TRANSACTION_RECEIPT.py

      - name: Run exact-snapshot protocol tests
        run: >-
          python -m pytest
          tests/test_public_site_deploy_hardening.py
          tests/test_public_site_deployment_transaction_receipt.py
          tests/test_incident_response_and_continuity.py
          tests/test_public_discovery.py
          tests/test_canonical_surface_design.py
          -q
