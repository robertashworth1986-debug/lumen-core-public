# LumenCore bounded public origin.
#
# This configuration deliberately serves only the immutable public-site tree.
# It has no gateway, API, websocket, trading, operator-data, or directory-index
# routes.  BOOTSTRAP_PUBLIC_SITE_ORIGIN.sh installs it only after the named
# Let's Encrypt certificate and standard Certbot TLS support files exist.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name lumen-core.ai www.lumen-core.ai app.lumen-core.ai research.lumen-core.ai;

    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
    }

    location = /nginx-health {
        default_type application/json;
        access_log off;
        limit_except GET HEAD { deny all; }
        return 200 '{"status":"ok","platform":"nginx","surface":"bounded-public-origin"}';
    }

    location / {
        limit_except GET HEAD { deny all; }
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name lumen-core.ai www.lumen-core.ai;

    root /opt/lumencore/dashboard;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    autoindex off;

    ssl_certificate /etc/letsencrypt/live/lumen-core.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lumen-core.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; font-src 'self' data: https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; connect-src 'self'; worker-src 'self' blob:; media-src 'self'; frame-src 'none'; upgrade-insecure-requests" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

    location = /nginx-health {
        default_type application/json;
        access_log off;
        limit_except GET HEAD { deny all; }
        return 200 '{"status":"ok","platform":"nginx","surface":"bounded-public-origin"}';
    }

    location = / {
        limit_except GET HEAD { deny all; }
        try_files /operator_home.html =404;
    }

    location = /evidence/ {
        limit_except GET HEAD { deny all; }
        try_files /evidence/index_bounded.html =404;
    }

    location = /build_week/prooflock_console/ {
        limit_except GET HEAD { deny all; }
        try_files /build_week/prooflock_console/index.html =404;
    }

    location ~ /\. {
        deny all;
    }

    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
    }

    access_log /var/log/nginx/lumencore_public_access.log;
    error_log /var/log/nginx/lumencore_public_error.log warn;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.lumen-core.ai;

    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/lumen-core.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lumen-core.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

    location / {
        limit_except GET HEAD { deny all; }
        return 302 https://lumen-core.ai/proof_to_pilot.html;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name research.lumen-core.ai;

    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/lumen-core.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lumen-core.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

    location / {
        limit_except GET HEAD { deny all; }
        return 302 https://lumen-core.ai/quant_lab.html;
    }
}
