# ============================================================
#  LumaTrader Institutional Intelligence Portal
#  nginx reverse proxy configuration
#
#  Domain:  yourdomain.com  (replace with your actual domain)
#  VPS:     Ubuntu/Debian with nginx installed
#
#  Port map:
#    80/443  → portal landing page (index.html static)
#    /trading → :5016  Panel (Trading Execution Intelligence)
#    /intel   → :7700  FastAPI (Cross-Sector Opportunity Intel)
#    /scout   → :5017  Panel (LamaScout Artist Intelligence)
#
#  Install:
#    sudo cp lumatrader.conf /etc/nginx/sites-available/lumatrader
#    sudo ln -s /etc/nginx/sites-available/lumatrader /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
#
#  SSL (recommended):
#    sudo apt install certbot python3-certbot-nginx
#    sudo certbot --nginx -d yourdomain.com -d www.yourdomain.com
# ============================================================

# ── upstream definitions ──────────────────────────────────────────────────────
upstream trading_dashboard {
    server 127.0.0.1:5016;
    keepalive 32;
}

upstream intel_api {
    server 127.0.0.1:7700;
    keepalive 32;
}

upstream scout_dashboard {
    server 127.0.0.1:5017;
    keepalive 32;
}

upstream luma_gateway {
    server 127.0.0.1:8787;
    keepalive 64;
}

# ── HTTP → HTTPS redirect (uncomment after certbot) ──────────────────────────
# server {
#     listen 80;
#     server_name yourdomain.com www.yourdomain.com;
#     return 301 https://$host$request_uri;
# }

# ── main server block ─────────────────────────────────────────────────────────
server {
    listen 80;
    # listen 443 ssl http2;                         # uncomment for HTTPS
    server_name yourdomain.com www.yourdomain.com;  # ← replace with your domain

    # ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ── security headers ────────────────────────────────────────────────────
    add_header X-Frame-Options           "SAMEORIGIN"   always;
    add_header X-Content-Type-Options    "nosniff"      always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # ── portal landing page (static) ────────────────────────────────────────
    location = / {
        root   /var/www/lumatrader;
        index  index.html;
        expires 10m;
        add_header Cache-Control "public, max-age=600";
    }

    location = /index.html {
        root   /var/www/lumatrader;
        expires 10m;
    }

    # Serve static HTML with gateway fallback so dashboard pages keep working
    # even if web-root sync is behind.
    location ~* \.html$ {
        root   /var/www/lumatrader;
        try_files $uri @gateway_html;
        expires 10m;
        access_log off;
    }

    location @gateway_html {
        proxy_pass         http://luma_gateway;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # serve non-HTML static assets from the web root
    location ~* \.(css|js|png|svg|ico|woff2?)$ {
        root   /var/www/lumatrader;
        try_files $uri =404;
        expires 1h;
        access_log off;
    }

    # ── Trading Execution Dashboard → port 5016 ──────────────────────────────
    location /trading {
        rewrite ^/trading(/.*)$ $1 break;
        proxy_pass         http://trading_dashboard;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Panel WebSocket — Trading
    location /trading/ws {
        rewrite ^/trading/ws(/.*)$ /ws$1 break;
        proxy_pass         http://trading_dashboard;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 86400s;
    }

    # ── Cross-Sector Intelligence API → port 7700 ────────────────────────────
    location /intel {
        rewrite ^/intel(/.*)$ $1 break;
        proxy_pass         http://intel_api;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;

        # CORS for dashboard JS fetches
        add_header Access-Control-Allow-Origin  "$http_origin" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS"  always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        if ($request_method = OPTIONS) { return 204; }
    }

    # ── Luma Experience Gateway API (same-origin for dashboard pages) ───────
    location /api/ {
        proxy_pass         http://luma_gateway;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Gateway websocket stream used by live clients.
    location /ws/live {
        proxy_pass         http://luma_gateway;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    # ── LamaScout Artist Intelligence Dashboard → port 5017 ─────────────────
    location /scout {
        rewrite ^/scout(/.*)$ $1 break;
        proxy_pass         http://scout_dashboard;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Panel WebSocket — LamaScout
    location /scout/ws {
        rewrite ^/scout/ws(/.*)$ /ws$1 break;
        proxy_pass         http://scout_dashboard;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 86400s;
    }

    # ── health check (gateway-backed) ──────────────────────────────────────
    location = /health {
        proxy_pass         http://luma_gateway/health;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        access_log off;
    }

    # Optional nginx-only liveness for infra checks.
    location = /nginx-health {
        return 200 '{"status":"ok","platform":"nginx"}';
        add_header Content-Type application/json;
        access_log off;
    }

    # ── access / error logs ─────────────────────────────────────────────────
    access_log /var/log/nginx/lumatrader_access.log;
    error_log  /var/log/nginx/lumatrader_error.log  warn;
}
