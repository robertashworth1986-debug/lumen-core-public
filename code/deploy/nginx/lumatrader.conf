# ============================================================
#  LumaTrader Institutional Intelligence Portal
#  nginx reverse proxy configuration
#
#  Domain:  yourdomain.com  (replace with your actual domain)
#
#  Coverage:
#    main domain       -> static pages + gateway fallback
#    /api, /auth, /ws  -> gateway (:8787)
#    /trading, /dashboard -> Panel trading dashboard (:5016)
#    /scout            -> Panel scout dashboard (:5017)
#    /intel            -> sector intelligence API (:7700)
#    /out, /evidence   -> gateway-backed static trees
#    app.<domain>      -> reviewer-safe investor surface redirect
#    research.<domain> -> reviewer-safe research surface redirect
# ============================================================

# ── upstream definitions ──────────────────────────────────────────────────────
upstream trading_dashboard {
    server 127.0.0.1:5016;
    keepalive 32;
}

upstream intel_api {
    server 127.0.0.1:7700;
    keepalive 32;
}

upstream scout_dashboard {
    server 127.0.0.1:5017;
    keepalive 32;
}

upstream lamascout_api {
    server 127.0.0.1:8001;
    keepalive 32;
}

upstream luma_gateway {
    server 127.0.0.1:8787;
    keepalive 64;
}

# ── HTTP -> HTTPS redirect for all names ─────────────────────────────────────
server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com app.yourdomain.com research.yourdomain.com;
    return 301 https://$host$request_uri;
}

# ── main server block ─────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name yourdomain.com www.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /health {
        proxy_pass         http://luma_gateway/health;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        access_log off;
    }

    location = /nginx-health {
        default_type application/json;
        return 200 '{"status":"ok","platform":"nginx"}';
        access_log off;
    }

    location /api/scout/ {
        proxy_pass         http://lamascout_api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Gateway-backed APIs and auth routes.
    location /api/ {
        proxy_pass         http://luma_gateway;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /auth/ {
        proxy_pass         http://luma_gateway;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /ws/live {
        proxy_pass         http://luma_gateway;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    location = /dashboard {
        return 302 /quant_lab.html;
    }

    location = /dashboard/ {
        return 302 /quant_lab.html;
    }

    location /dashboard/ws {
        rewrite ^/dashboard/ws(/.*)$ /ws$1 break;
        proxy_pass         http://trading_dashboard;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 86400s;
    }

    location /trading {
        rewrite ^/trading(/.*)$ $1 break;
        proxy_pass         http://trading_dashboard;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /trading/ws {
        rewrite ^/trading/ws(/.*)$ /ws$1 break;
        proxy_pass         http://trading_dashboard;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 86400s;
    }

    location /intel {
        rewrite ^/intel(/.*)$ $1 break;
        proxy_pass         http://intel_api;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;

        add_header Access-Control-Allow-Origin "$http_origin" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        if ($request_method = OPTIONS) { return 204; }
    }

    location /scout {
        rewrite ^/scout(/.*)$ $1 break;
        proxy_pass         http://scout_dashboard;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /scout/ws {
        rewrite ^/scout/ws(/.*)$ /ws$1 break;
        proxy_pass         http://scout_dashboard;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 86400s;
    }

    # Public proof access is curated. Do not expose /opt/lumencore/out as a
    # browsable directory; reviewers should enter through proof_to_pilot.html
    # and hash-verified /data/*.json feeds.
    location = /proof/ {
        return 302 /proof_to_pilot.html;
    }

    location /proof/ {
        return 404;
    }

    location = /evidence/runs {
        return 404;
    }

    location ^~ /evidence/runs/ {
        return 404;
    }

    location /evidence/ {
        alias /opt/lumencore/dashboard/evidence/;
        try_files $uri $uri/ =404;
    }

    # Grant application packets include operator-only form fields. Reviewer-safe
    # grant feeds are published under /data and /dashboard/data instead.
    location ^~ /out/grants/ {
        return 404;
    }

    location /out/ {
        proxy_pass         http://luma_gateway;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Legacy compatibility: historical dashboard bundles still request these paths.
    location ~ ^/INSTITUTIONAL_STACK_V2/out/(.*)$ {
        return 302 /out/$1;
    }

    location = /data/sector_energy_evidence_pipeline_latest.json {
        return 302 /out/ops/sector_energy_evidence_pipeline_latest.json;
    }

    location = /data/sector_energy_investor_bridge_latest.json {
        return 302 /out/sector_energy/sector_energy_investor_bridge_latest.json;
    }

    location = /INSTITUTIONAL_STACK_V2/dashboard/data/sector_energy_evidence_pipeline_latest.json {
        return 302 /out/ops/sector_energy_evidence_pipeline_latest.json;
    }

    location = /INSTITUTIONAL_STACK_V2/dashboard/data/sector_energy_investor_bridge_latest.json {
        return 302 /out/sector_energy/sector_energy_investor_bridge_latest.json;
    }

    # The public root resolves only to current reviewer-safe entrypoints.
    location = / {
        root /opt/lumencore/dashboard;
        try_files /dashboard_portal.html /index.html =404;
    }

    # Static-first, gateway fallback for every page and asset path.
    location / {
        root /opt/lumencore/dashboard;
        index dashboard_portal.html index.html mission_control.html;
        try_files $uri $uri/ @gateway_fallback;
    }

    location @gateway_fallback {
        proxy_pass         http://luma_gateway;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    access_log /var/log/nginx/lumatrader_access.log;
    error_log  /var/log/nginx/lumatrader_error.log warn;
}

# Investor app subdomain.
server {
    listen 443 ssl;
    server_name app.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = /health {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 200 '{"status":"ok","surface":"app","mode":"reviewer_safe_redirect","target":"https://yourdomain.com/investor_command_room.html"}';
        access_log off;
    }

    location / {
        return 302 https://yourdomain.com/investor_command_room.html;
    }
}

# Research subdomain.
server {
    listen 443 ssl;
    server_name research.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = /health {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 200 '{"status":"ok","surface":"research","mode":"reviewer_safe_redirect","target":"https://yourdomain.com/quant_lab.html"}';
        access_log off;
    }

    location / {
        return 302 https://yourdomain.com/quant_lab.html;
    }
}
