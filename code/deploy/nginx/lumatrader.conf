# ============================================================
#  LumaTrader Institutional Intelligence Portal
#  nginx reverse proxy configuration
#
#  Domain:  yourdomain.com  (replace with your actual domain)
#
#  Coverage:
#    main domain       -> explicit public static manifest
#    /health           -> bounded gateway health
#    /api/master/booth-brief -> bounded Level 3 public contract
#    /evidence         -> static bounded proof-to-pilot page
#    operator APIs, websockets, proof trees, and output trees -> denied
#    app.<domain> and research.<domain> -> explicitly retired
# ============================================================

# BEGIN LUMENCORE PUBLIC EDGE MAP V1
map "$request_method:$uri" $lumencore_public_route_denied {
    default 1;
    "~^(GET|HEAD):/$" 0;
    "~^(GET|HEAD):/operator_home\.html$" 0;
    "~^(GET|HEAD):/assets/(?:lumencore|luma_command_fabric)\.css$" 0;
    "~^(GET|HEAD):/proof_to_pilot\.html$" 0;
    "~^(GET|HEAD):/health$" 0;
    "~^(GET|HEAD):/api/master/booth-brief$" 0;
    "~^(GET|HEAD):/evidence$" 0;
    "~^(GET|HEAD):/evidence/$" 0;
    "~^(GET|HEAD):/evidence/index_bounded\.html$" 0;
}
# END LUMENCORE PUBLIC EDGE MAP V1

# ── upstream definitions ──────────────────────────────────────────────────────
upstream trading_dashboard {
    server 127.0.0.1:5016;
    keepalive 32;
}

upstream intel_api {
    server 127.0.0.1:7700;
    keepalive 32;
}

upstream scout_dashboard {
    server 127.0.0.1:5017;
    keepalive 32;
}

upstream lamascout_api {
    server 127.0.0.1:8001;
    keepalive 32;
}

upstream luma_gateway {
    server 127.0.0.1:8787;
    keepalive 64;
}

# ── HTTP -> HTTPS redirect for all names ─────────────────────────────────────
server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com app.yourdomain.com research.yourdomain.com;
    return 301 https://$server_name$request_uri;
}

# ── main server block ─────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name yourdomain.com www.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # BEGIN LUMENCORE PUBLIC EDGE GUARD V1
    if ($lumencore_public_route_denied) {
        return 404;
    }
    # END LUMENCORE PUBLIC EDGE GUARD V1

    location = /health {
        proxy_pass         http://luma_gateway/health;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        access_log off;
        limit_except GET HEAD { deny all; }
    }

    location = /api/master/booth-brief {
        proxy_pass         http://luma_gateway/api/master/booth-brief;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        access_log off;
        limit_except GET HEAD { deny all; }
    }

    location /api/scout/ {
        return 404;
    }

    # Operator routes are private by default.
    location /api/ {
        return 404;
    }

    location /auth/ {
        return 404;
    }

    location /ws/live {
        return 404;
    }

    location = /dashboard {
        return 404;
    }

    location = /dashboard/ {
        return 404;
    }

    location /dashboard/ws {
        return 404;
    }

    location /trading {
        return 404;
    }

    location /trading/ws {
        return 404;
    }

    location /intel {
        return 404;
    }

    location /scout {
        return 404;
    }

    location /scout/ws {
        return 404;
    }

    location /proof/ {
        return 404;
    }

    location = /evidence {
        return 301 /evidence/;
    }

    location = /evidence/ {
        root /opt/lumencore/dashboard;
        try_files /evidence/index_bounded.html =404;
        add_header Cache-Control "no-cache" always;
    }

    location = /evidence/index_bounded.html {
        root /opt/lumencore/dashboard;
        try_files /evidence/index_bounded.html =404;
        add_header Cache-Control "no-cache" always;
    }

    location ^~ /evidence/ {
        return 404;
    }

    location /out/ {
        return 404;
    }

    # Legacy compatibility: historical dashboard bundles still request these paths.
    location ~ ^/INSTITUTIONAL_STACK_V2/out/(.*)$ {
        return 404;
    }

    location = /data/sector_energy_evidence_pipeline_latest.json {
        return 404;
    }

    location = /data/sector_energy_investor_bridge_latest.json {
        return 404;
    }

    location = /INSTITUTIONAL_STACK_V2/dashboard/data/sector_energy_evidence_pipeline_latest.json {
        return 404;
    }

    location = /INSTITUTIONAL_STACK_V2/dashboard/data/sector_energy_investor_bridge_latest.json {
        return 404;
    }

    # The public root is an explicit operator/product map. Do not let nginx
    # resolve the dashboard directory itself, which produces a 403 when
    # autoindex is disabled.
    location = / {
        root /opt/lumencore/dashboard;
        try_files /operator_home.html =404;
    }

    location = /operator_home.html {
        root /opt/lumencore/dashboard;
        try_files /operator_home.html =404;
    }

    location = /assets/lumencore.css {
        root /opt/lumencore/dashboard;
        try_files /assets/lumencore.css =404;
    }

    location = /assets/luma_command_fabric.css {
        root /opt/lumencore/dashboard;
        try_files /assets/luma_command_fabric.css =404;
    }

    location = /proof_to_pilot.html {
        return 302 /evidence/;
    }

    location / {
        return 404;
    }

    access_log /var/log/nginx/lumatrader_access.log;
    error_log  /var/log/nginx/lumatrader_error.log warn;
}

# Retired subdomains remain closed until separately governed surfaces exist.
server {
    listen 443 ssl;
    server_name app.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        return 404;
    }
}

server {
    listen 443 ssl;
    server_name research.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        return 404;
    }
}
