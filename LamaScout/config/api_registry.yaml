sources:
  - name: youtube
    display_name: YouTube
    source_type: streaming_platform
    active: true
    access_mode: read_only_metrics
    auth:
      api_key_env: YOUTUBE_API_KEY
      aliases:
        - GOOGLE_YOUTUBE_API_KEY
        - GOOGLE_API_KEY
    endpoint: "https://www.googleapis.com/youtube/v3"
    search_terms:
      - emerging country artist usa 2026
      - rising hiphop artist
      - breakthrough indie rock
      - viral singer songwriter
      - unsigned pop talent
      - breakthrough edm producer
      - rising local festival performer
      - unsigned open mic act
      - regional showcase artist
      - breakout live circuit
      - independent artist debut single 2026
      - new r&b vocalist official 2026
    notes: "Video/channel metrics for national artist discovery. No posting, comments, uploads, or account mutation."

  - name: spotify
    display_name: Spotify
    source_type: audio_platform
    active: true
    access_mode: read_only_metrics
    auth:
      client_id_env: SPOTIFY_CLIENT_ID
      client_secret_env: SPOTIFY_CLIENT_SECRET
      client_id_aliases:
        - SPOTIFY_API_CLIENT_ID
      client_secret_aliases:
        - SPOTIFY_API_CLIENT_SECRET
    endpoint: "https://api.spotify.com/v1"
    search_terms:
      - emerging country artist usa 2026
      - rising hiphop artist
      - breakthrough indie rock
      - viral singer songwriter
      - unsigned pop talent
      - breakthrough edm producer
      - rising local festival performer
      - unsigned open mic act
      - regional showcase artist
      - breakout live circuit
      - bedroom pop indie
      - lo-fi singer songwriter
    notes: "Artist, follower, genre, and popularity signals through client-credentials read-only flow."

  - name: meta
    display_name: Meta Graph (Facebook/Instagram)
    source_type: social_platform
    active: true
    access_mode: read_only_public_signal
    auth:
      access_token_env: META_ACCESS_TOKEN
      aliases:
        - FACEBOOK_ACCESS_TOKEN
        - FACEBOOK_GRAPH_ACCESS_TOKEN
        - INSTAGRAM_ACCESS_TOKEN
    endpoint: "https://graph.facebook.com"
    search_terms:
      - emerging country artist usa 2026
      - rising hiphop artist
      - breakthrough indie rock
      - viral singer songwriter
      - unsigned pop talent
      - rising local festival performer
      - regional showcase artist
      - independent artist music
      - new country singer
      - indie pop musician
    notes: "Facebook/Instagram creator signal lane. No posting, messaging, ads, page edits, comments, or account mutation."

  - name: google_trends
    display_name: Google Trends
    source_type: cultural_trend
    active: true
    access_mode: public_signal
    auth: {}
    endpoint: "https://trends.google.com/trends/api"
    search_terms:
      - emerging country artist usa 2026
      - rising hiphop artist
      - breakthrough indie rock
      - viral singer songwriter
      - unsigned pop talent
      - breakthrough edm producer
      - rising local festival performer
      - unsigned open mic act
      - regional showcase artist
      - breakout live circuit
    notes: "Search interest and trend momentum from open Google Trends."

  - name: musicbrainz
    display_name: MusicBrainz
    source_type: music_metadata
    active: true
    access_mode: public_open_api
    auth: {}
    endpoint: "https://musicbrainz.org/ws/2/artist/"
    search_terms:
      - emerging country artist usa 2026
      - rising hiphop artist
      - breakthrough indie rock
      - viral singer songwriter
      - unsigned pop talent
      - breakthrough edm producer
      - rising local festival performer
      - unsigned open mic act
      - regional showcase artist
      - breakout live circuit
    notes: "Open artist metadata from MusicBrainz, no API key required."

  - name: wikipedia
    display_name: Wikipedia
    source_type: press_signal
    active: true
    access_mode: public_open_api
    auth: {}
    endpoint: "https://en.wikipedia.org/w/api.php"
    search_terms:
      - emerging country artist usa 2026
      - rising hiphop artist
      - breakthrough indie rock
      - viral singer songwriter
      - unsigned pop talent
      - breakthrough edm producer
      - rising local festival performer
      - unsigned open mic act
      - regional showcase artist
