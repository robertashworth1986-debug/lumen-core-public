  - name: twitter_x
    display_name: X / Twitter
    source_type: social_platform
    active: false
    access_mode: read_only_metrics
    auth:
      bearer_token_env: TWITTER_BEARER_TOKEN
      aliases:
        - X_BEARER_TOKEN
    endpoint: "https://api.twitter.com/2"
    search_terms:
      - independent music artist
      - new single release
      - unsigned artist debut
    notes: "Buzz, mentions, and social signal. Kept inactive until key and rate-limit policy are reviewed."

  - name: ticketmaster
    display_name: Ticketmaster
    source_type: venue_signal
    active: false
    access_mode: read_only_events
    auth:
      api_key_env: TICKETMASTER_API_KEY
    endpoint: "https://app.ticketmaster.com/discovery/v2"
    search_terms:
      - emerging live show artist
      - regional festival breakout
      - headline support act
